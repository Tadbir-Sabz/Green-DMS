      type: object
      description: واحد اندازه‌گیری (مرجع سراسری)
      required: [code, title]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string, maxLength: 16 }
        title: { type: string, maxLength: 64 }
        decimal_places: { type: integer, minimum: 0, maximum: 6 }

