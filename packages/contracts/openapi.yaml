      responses:
        '200':
          description: صفحه‌ای از وضعیت توزیع
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Delivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /deliveries/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [deliveries]
      summary: جزئیات تحویل (POD با عکس و امضا)
      responses:
        '200':
