    get:
      tags: [bi]
      summary: پیش‌بینیِ فروشِ روزانه (هموارسازیِ خطیِ هالت رویِ سابقهٔ فروش)
      parameters:
        - name: days
          in: query
          description: طولِ سابقهٔ روزهایِ گذشته برای برازش (پیش‌فرض ۹۰، ۱..۳۶۵)
          schema: { type: integer, minimum: 1, maximum: 365, default: 90 }
        - name: horizon
          in: query
          description: تعدادِ روزهایِ آینده برای پیش‌بینی (پیش‌فرض ۷، ۱..۹۰)
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
      responses:
        '200':
