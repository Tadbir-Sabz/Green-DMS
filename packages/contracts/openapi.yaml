      parameters:
        - { name: as_of, in: query, schema: { type: string, format: date } }
        - { name: bank_account_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: موقعیت خزانه
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TreasuryPosition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /treasury/closes:
    get:
      tags: [treasury]
      summary: فهرست بستن‌های روزانهٔ خزانه شعبه‌ها
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [draft, closed, approved] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: صفحه‌ای از بستن‌های روزانه
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/TreasuryClose' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [treasury]
      summary: ثبت و بستن روزانهٔ خزانه یک شعبه
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreasuryClose' }
      responses:
        '201':
          description: بستن روزانه ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreasuryClose' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /treasury/closes/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [treasury]
      summary: جزئیات یک بستن روزانهٔ خزانه
      responses:
        '200':
          description: بستن روزانه
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreasuryClose' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /treasury/closes/{id}/approve:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    post:
      tags: [treasury]
      summary: تأیید بستن روزانهٔ خزانه (closed → approved)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: بستن روزانه تأیید شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreasuryClose' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cheques:
    get:
      tags: [cheques]
      summary: فهرست چک‌های دریافتی/پرداختی و سررسیدها
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
        - { name: direction, in: query, schema: { type: string, enum: [received, issued] } }
        - { name: status, in: query, schema: { type: string, enum: [pending, cleared, bounced, returned] } }
        - { name: due_from, in: query, schema: { type: string, format: date } }
        - { name: due_to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: صفحه‌ای از چک‌ها
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Cheque' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [cheques]
      summary: ثبت چک (دریافت از مشتری یا صدور برای تأمین‌کننده)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Cheque' }
      responses:
        '201':
          description: چک ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cheque' }
  /cheques/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [cheques]
      summary: جزئیات چک
      responses:
        '200':
          description: چک
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cheque' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [cheques]
      summary: تعیین تکلیف چک (وصول/برگشت/واگذاری به بانک)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Cheque' }
      responses:
        '200':
          description: چک به‌روزرسانی شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cheque' }
  /payments:
    get:
      tags: [payments]
      summary: فهرست رسیدهای وصول (نقد/کارت/آنلاین/چک)
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: kind, in: query, schema: { type: string } }
      responses:
        '200':
          description: صفحه‌ای از رسیدها
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/PaymentReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [payments]
      summary: ثبت وصول و تخصیص به فاکتورها
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentReceipt' }
      responses:
        '201':
          description: رسید ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentReceipt' }
        '422': { $ref: '#/components/responses/RuleRejected' }
  /payments/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [payments]
      summary: جزئیات رسید با تخصیص‌ها
      responses:
        '200':
          description: رسید
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentReceipt' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- دفتر کل (GL) ----------------
  /gl/accounts:
    get:
      tags: [gl]
      summary: درخت کدینگ حساب‌های دفتر کل (۴ سطح)
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
        - { name: nature, in: query, schema: { type: string, enum: [debit, credit] } }
        - { name: account_type, in: query, schema: { type: string, enum: [asset, liability, equity, revenue, expense, contra] } }
      responses:
        '200':
          description: صفحه‌ای از حساب‌ها به ترتیب کد
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/GlAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /gl/periods:
    get:
      tags: [gl]
      summary: دوره‌های مالی (باز/بسته/قفل)
      parameters:
        - { name: fiscal_year, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [open, closed, locked] } }
      responses:
        '200':
          description: فهرست دوره‌ها (جدیدترین ابتدا)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FiscalPeriod' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [gl]
      summary: ساخت/بازکردن یک دورهٔ مالی
      description: |
        دوره با وضعیت `open` ساخته می‌شود؛ `(fiscal_year, period_no)` باید یکتا باشد
        و `end_date ≥ start_date`. در غیر این صورت `409`/`400` با پیام فارسی.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FiscalPeriodCreate' }
      responses:
        '201':
          description: دوره ساخته شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FiscalPeriod' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /gl/periods/{id}/close:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    post:
      tags: [gl]
      summary: بستن دورهٔ مالی (پس از آن سند جدید در این دوره رد می‌شود)
      responses:
        '200':
          description: دوره بسته شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FiscalPeriod' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /gl/journals:
    get:
      tags: [gl]
      summary: فهرست اسناد حسابداری
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
        - { name: status, in: query, schema: { type: string, enum: [draft, posted, voided] } }
        - { name: source_type, in: query, schema: { type: string, enum: [invoice, credit_note, receipt, payment_voucher, goods_receipt, supplier_invoice, value_document, cash_txn, cheque, payroll, manual, opening, closing, recurring] } }
        - { name: fiscal_period_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: صفحه‌ای از اسناد به ترتیب شماره سند
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/JournalEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [gl]
      summary: ثبت و صدور سند دستیِ متوازن
      description: |
        سند با وضعیت `posted` ثبت می‌شود. جمع بدهکار/بستانکار سطرها باید برابر باشد
        (`fn_journal_balanced`)، هر سطر دقیقاً یک سمت غیر صفر داشته باشد
        (`ck_journal_line_one_side`) و تاریخ سند داخل یک دورهٔ مالی «باز» قرار گیرد
        (`fn_check_journal_period`). نقض هر یک → `422` با پیام فارسی.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalEntryCreate' }
      responses:
        '201':
          description: سند ثبت و صادر شد (با سطرها)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RuleRejected' }
  /gl/journals/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [gl]
      summary: جزئیات سند با سطرها
      responses:
        '200':
          description: سند حسابداری
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /gl/trial-balance:
    get:
      tags: [gl]
      summary: تراز آزمایشی از نمای v_trial_balance (فقط اسناد صادرشده)
      parameters:
        - { name: fiscal_year, in: query, schema: { type: integer } }
        - { name: period_no, in: query, schema: { type: integer, minimum: 1, maximum: 12 } }
      responses:
        '200':
          description: ردیف‌های تراز آزمایشی به ترتیب کد حساب
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TrialBalanceRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------- رهگیری و مسیریابی ----------------
  /tracking/locations:
    get:
      tags: [tracking]
      summary: موقعیت‌های زنده کارکنان میدانی برای نقشه رهگیری
      parameters:
        - { name: staff_id, in: query, schema: { type: string, format: uuid } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: آخرین موقعیت هر کارمند میدانی
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LatestPosition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tracking]
      summary: ارسال نمونه موقعیت از اپ فروشنده/موزع (batch)
      description: |
        اپ موقعیت‌ها را در صف آفلاین نگه می‌دارد و دسته‌ای می‌فرستد؛ سرور
        `is_mocked` و `accuracy_m` را ثبت و با رویداد زنده `location.update`
        به نقشه مدیریت پخش می‌کند.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [samples]
              properties:
                samples:
                  type: array
                  items: { $ref: '#/components/schemas/LocationSample' }
      responses:
        '202':
          description: نمونه‌ها پذیرفته شدند
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /tracking/routes:
    get:
      tags: [tracking]
      summary: طرح‌های مسیر محاسبه‌شده
      parameters:
        - { name: staff_id, in: query, schema: { type: string, format: uuid } }
        - { name: plan_date, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: فهرست طرح‌های مسیر
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RoutePlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tracking]
      summary: محاسبه «بهترین مسیر‌بندی با یک کلیک» برای اپ فروشنده/موزع
      description: |
        مشتریان مسیر (یا ایستگاه‌های انتخاب‌شده) می‌آیند؛ سرور با ارائه‌دهنده
        مسیریابی (نشان/map.ir یا OSRM داخلی) بهترین ترتیب و هندسه را برمی‌گرداند
        و طرح برای استفاده بعدی ذخیره می‌شود (ماژول ۶ §۶.۳).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_ids]
              properties:
                plan_date: { type: string, format: date }
                customer_ids:
                  type: array
                  items: { type: string, format: uuid }
                provider: { type: string, enum: [neshan, mapir, osrm_selfhosted] }
                objective: { type: string, enum: [min_duration, min_distance] }
      responses:
        '200':
          description: طرح مسیر محاسبه شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutePlan' }
        '422': { $ref: '#/components/responses/RuleRejected' }
  /geofences:
