      properties:
        id: { type: string, format: uuid }
        doc_number: { type: string }
        fiscal_year: { type: integer }
        order_date: { type: string, format: date }
        grand_total: { type: string, description: decimal string }
        status: { type: string }
    PortalBalance:
      type: object
      required: [outstanding, overdue, credit_limit, credit_available]
      properties:
        outstanding: { type: string, description: ماندهٔ دریافتنیِ کل (decimal string) }
        overdue: { type: string, description: معوق (decimal string) }
        credit_limit: { type: [string, 'null'] }
        credit_available: { type: [string, 'null'] }
    BiForecastPoint:
      type: object
      required: [date, value]
      properties:
        date: { type: string, format: date }
        value: { type: string, description: فروشِ خالصِ پیش‌بینی‌شده (decimal string) }
    BiForecast:
      type: object
      description: پیش‌بینیِ فروشِ روزانه با هموارسازیِ خطیِ هالت
      required: [method, history_days, horizon_days, points, total, trend_per_day, direction]
      properties:
        method: { type: string, enum: [holt-linear] }
        history_days: { type: integer }
        horizon_days: { type: integer }
        points:
          type: array
          items: { $ref: '#/components/schemas/BiForecastPoint' }
        total: { type: string, description: مجموعِ فروشِ پیش‌بینی‌شده در افق }
        trend_per_day: { type: string, description: مؤلفهٔ روند (تغییرِ روزانهٔ سطح) }
        direction: { type: string, enum: [up, down, flat] }
    OptimizedStop:
      type: object
      description: یک توقفِ ترتیب‌داده‌شده در مسیرِ بهینه
      required: [customer_id, code, name, lat, lng, sequence, leg_distance_km, cumulative_distance_km, eta_min]
      properties:
        customer_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        sequence: { type: integer, description: ترتیبِ بازدید (۱-based) }
        leg_distance_km: { type: number, format: float, description: فاصله از توقفِ قبلی }
        cumulative_distance_km: { type: number, format: float, description: مسافتِ تجمعی از شروع }
        eta_min: { type: number, format: float, description: زمانِ تخمینیِ رسیدن از شروع (دقیقه) }
    RoutingOptimization:
      type: object
      required: [route_id, stop_count, stops, total_distance_km, total_duration_min, savings_percent]
      properties:
        route_id: { type: [string, 'null'], format: uuid }
        stop_count: { type: integer }
        stops:
          type: array
          items: { $ref: '#/components/schemas/OptimizedStop' }
        total_distance_km: { type: number, format: float }
        total_duration_min: { type: number, format: float }
        savings_percent: { type: number, format: float, description: درصدِ بهبود نسبت به ترتیبِ ورودی }
    Attachment:
      type: object
      description: یک ضمیمهٔ بارگذاری‌شده (فایل در آبجکت‌استوریج؛ اینجا metadata + URL امضاشده)
      required: [id, owner_type, owner_id, file_name, content_type, size_bytes, sha256, url, created_at]
      properties:
        id: { type: string, format: uuid }
        owner_type:
          type: string
          enum: [pod, invoice, journal_entry, receipt, return_request, sales_order, product, stock_count, other]
        owner_id: { type: string, format: uuid }
        file_name: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { type: string, description: اثرِ انگشت SHA-256 محتوای فایل }
        url: { type: string, format: uri, description: URL امضاشدهٔ کوتاه‌عمر برای دانلود }
        created_at: { type: string, format: date-time }
    AttachmentUrl:
      type: object
      required: [url, expires_in]
      properties:
        url: { type: string, format: uri, description: URL امضاشدهٔ دانلود }
        expires_in: { type: integer, description: عمرِ URL به ثانیه }
    EntityAttachmentOwnerType:
      type: string
      description: >-
        انواع مالک مصوب C3 — دقیقاً همان enum تاریخی `Attachment.owner_type`
        منهای `product` (نمای محصولمحور C1) و `other` (راستیآزماییناپذیر،
        fail-closed). همگی در `owner-scope.ts` زنجیرهٔ مالکیت اجارهای دارند.
      enum: [invoice, sales_order, return_request, stock_count, receipt, journal_entry, pod]
    EntityAttachmentCounts:
      type: object
      required: [images, documents, total]
      properties:
        images: { type: integer, minimum: 0 }
        documents: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    EntityAttachmentItem:
      type: object
      description: >-
        همان `schemas.Attachment` بهعلاوهٔ دستهبندی تصویر/سند که فقط در لحظهٔ
        خواندن محاسبه میشود. هیچ `is_primary`، `sort_order`، `domain_id` یا
        وضعیت ذخیرهشدهای وجود ندارد.
      required:
        - id
        - owner_type
        - owner_id
        - file_name
        - content_type
        - size_bytes
        - sha256
        - url
        - created_at
        - kind
        - kind_label_fa
      properties:
        id: { type: string, format: uuid }
        owner_type: { $ref: '#/components/schemas/EntityAttachmentOwnerType' }
        owner_id: { type: string, format: uuid }
        file_name: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { type: string, description: اثر انگشت SHA-256 محتوای فایل }
        url: { type: string, format: uri, description: URL امضاشدهٔ کوتاهعمر }
        created_at: { type: string, format: date-time }
        kind: { type: string, enum: [image, document] }
        kind_label_fa: { type: string, description: «تصویر» یا «سند» }
    EntityAttachmentView:
      type: object
      description: >-
        نمای مشترک ضمائم یک موجودیت واجدشرایط — شکل یکسان برای فاکتور،
        سفارش، مرجوعی، انبارگردانی، سند حسابداری، رسید پرداخت و POD.
        صرفاً کاتالوگ مرکزی/عملیاتی؛ هیچ فیلد دامنهای، عضویت یا دسترسپذیری
        دامنهای ندارد.
      required:
        - owner_type
        - owner_id
        - owner_label_fa
        - module_path
        - items
        - counts
        - note_fa
        - message_fa
      properties:
        owner_type: { $ref: '#/components/schemas/EntityAttachmentOwnerType' }
        owner_id: { type: string, format: uuid }
        owner_label_fa: { type: string, description: برچسب فارسی مصوب موجودیت }
        module_path: { type: string, description: نشانی صفحهٔ مدیریت موجودیت برای ناوبری }
        items:
          type: array
          description: جدیدترین ضمیمه اول (ترتیب قطعی created_at سپس id)
          items: { $ref: '#/components/schemas/EntityAttachmentItem' }
        counts: { $ref: '#/components/schemas/EntityAttachmentCounts' }
        note_fa: { type: string, description: محدودیتهای مصوب (بدون حذف/بایگانی/انتخاب اصلی) }
        message_fa: { type: string, description: یادآوری مرز مرکزی/دامنهای }

    ProductMediaItem:
      type: object
      description: >-
        یک تصویر/سند کالا؛ همان schemas.Attachment بهعلاوهٔ دستهبندی و نشانگر
        تصویرِ اصلی که فقط در لحظهٔ خواندن محاسبه شده است (§B4 — بدون ستون DB).
      required:
        - id
        - owner_type
        - owner_id
        - file_name
        - content_type
        - size_bytes
        - sha256
        - url
        - created_at
        - kind
        - kind_label_fa
        - is_primary
        - primary_label_fa
      properties:
        id: { type: string, format: uuid }
        owner_type: { type: string, enum: [product] }
        owner_id: { type: string, format: uuid }
        file_name: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { type: string, description: اثرِ انگشت SHA-256 محتوای فایل }
        url: { type: string, format: uri, description: URL امضاشدهٔ کوتاهعمر }
        created_at: { type: string, format: date-time }
        kind: { type: string, enum: [image, document] }
        kind_label_fa: { type: string, description: «تصویر» یا «سند» }
        is_primary: { type: boolean, description: فقط نخستین تصویر بر اساس created_at مقدار true دارد }
        primary_label_fa: { type: [string, 'null'], description: «اصلی (خودکار)» یا null }
    ProductMediaView:
      type: object
      description: >-
        نمای مرکز تصاویر/اسناد یک کالای مرکزی. صرفاً کاتالوگ مرکزی؛ هیچ فیلد
        دامنهای، عضویت، وضعیت عرضه یا دسترسپذیری دامنهای ندارد.
      required:
        - product_id
        - product_code
        - product_name
        - items
        - primary_image
        - counts
        - primary_image_rule
        - primary_image_label_fa
        - primary_image_note_fa
        - message_fa
      properties:
        product_id: { type: string, format: uuid }
        product_code: { type: string }
        product_name: { type: string }
        items:
          type: array
          description: قدیمیترین ضمیمه اول (ترتیب قطعی created_at سپس id)
          items: { $ref: '#/components/schemas/ProductMediaItem' }
        primary_image:
          oneOf:
            - { $ref: '#/components/schemas/ProductMediaItem' }
            - { type: 'null' }
        counts:
          type: object
          required: [images, documents, total]
          properties:
            images: { type: integer, minimum: 0 }
            documents: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
        primary_image_rule: { type: string, enum: [first_image_by_created_at] }
        primary_image_label_fa: { type: string, description: برچسب مصوب §B4 }
        primary_image_note_fa: { type: string, description: محدودیت مستند جابهجایی خودکار تصویرِ اصلی }
        message_fa: { type: string }

