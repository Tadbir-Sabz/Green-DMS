        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /onboarding/register:
    post:
      tags: [onboarding]
      summary: خودخدمت‌دهیِ ثبتِ اجارهٔ جدید (شرکت + شعبه + نقش‌ها + حسابِ مدیر)
      description: >-
        عمومی و بدونِ نشست. در تولید باید پشتِ نرخ‌گذاری/CAPTCHA/کدِ دعوت قرار گیرد
        (یادداشتِ امنیتی در گزارشِ تحویل). ساختِ اجاره اتمی است (یا همه یا هیچ).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_code, company_name, admin_email, admin_password]
              properties:
                company_code: { type: string, minLength: 2, maxLength: 32, pattern: '^[A-Za-z0-9_-]+$' }
                company_name: { type: string, minLength: 2, maxLength: 160 }
                admin_email: { type: string, format: email, maxLength: 160 }
                admin_password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
                  description: >-
                    رمزِ مدیر. علاوه بر طولِ حداقلی، باید دستِ‌کم ۳ دسته از نویسه‌ها
                    (حروفِ کوچک، حروفِ بزرگ، رقم، نماد) را داشته باشد و از فهرستِ
                    رمزهایِ رایج نباشد؛ در غیرِ این صورت با ۴۰۰ و کدِ weak_password
                    رد می‌شود.
                invite_code:
                  type: string
                  maxLength: 64
                  description: >-
                    کدِ دعوت — فقط وقتی لازم است که سرور با ONBOARDING_MODE=invite
                    پیکربندی شده باشد. در حالتِ پیش‌فرض (open) نادیده گرفته می‌شود.
                    نامعتبر/نبودِ آن با ۴۰۳ رد می‌شود.
                admin_first_name: { type: string, maxLength: 60 }
                admin_last_name: { type: string, maxLength: 60 }
      responses:
        '201':
          description: اجاره و حسابِ مدیر ساخته شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterTenantResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
