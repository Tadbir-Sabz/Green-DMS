        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: مانده مشتریان با رده‌بندی سنی
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ArAgingRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /ar/{customerId}/statement:
    parameters:
      - { name: customerId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [ar]
      summary: صورتحساب دوره‌ای مشتری (صدور و ارسال پیامکی/پورتال)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: صورتحساب
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerStatement' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- حسابداری خرید (AP) ----------------
  /ap:
