        title: { type: string, minLength: 1, maxLength: 64 }
        symbol: { type: [string, 'null'], maxLength: 16 }
        title_latin: { type: [string, 'null'], maxLength: 64 }
        decimal_places: { type: integer, minimum: 0, maximum: 4 }
