  /routing/optimize:
    post:
      tags: [routing]
      summary: بهینه‌سازی مسیر ویزیت (TSP) — ترتیبِ بهینهٔ توقف‌ها با کمینه مسافت
      description: >-
        ترتیبِ توقف‌ها با الگوریتمِ نزدیک‌ترین همسایه + بهبودِ 2-opt محاسبه می‌شود.


        **محدودیتِ دقت:** فاصله‌ها با فرمولِ «هاورساین» یعنی فاصلهٔ خطِ مستقیمِ
        ژئودزیکیِ رویِ کرهٔ زمین محاسبه می‌شوند، **نه** مسافتِ واقعیِ شبکهٔ جاده‌ای.
        بنابراین total_distance_km و eta_min «برآورد» هستند و می‌توانند از مسافتِ
        واقعیِ رانندگی کمتر باشند (عبور از معبر، محدودیتِ ترافیک و ارتفاع لحاظ نمی‌شود).


        توقف‌هایی که مختصاتِ نامعتبر یا ناموجود دارند از بهینه‌سازی کنار گذاشته می‌شوند
        (بدونِ شکستِ درخواست) و در stop_count شمارش نمی‌شوند. اگر خروجیِ بهینه‌ساز از
        ترتیبِ ورودی بدتر باشد، همان ترتیبِ ورودی (خطِ پایه) با savings_percent برابرِ صفر
        برگردانده می‌شود.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                route_id:
                  type: string
                  format: uuid
                  description: بهینه‌سازیِ همهٔ مشتریانِ یک مسیرِ ویزیت
                customer_ids:
                  type: array
                  items: { type: string, format: uuid }
                  maxItems: 200
                  description: >-
                    فهرستِ صریحِ توقف‌ها (اگر route_id داده نشود). سقفِ سرور ۲۰۰ توقف است
                    (MAX_ROUTE_STOPS)؛ بیش از آن با وضعیتِ ۴۰۰ و کدِ too_many_stops رد می‌شود.
                start_lat: { type: number, format: double, minimum: -90, maximum: 90, description: عرضِ جغرافیاییِ دپو/نقطهٔ شروع }
                start_lng: { type: number, format: double, minimum: -180, maximum: 180, description: طولِ جغرافیاییِ دپو/نقطهٔ شروع }
                avg_speed_kmh: { type: number, format: double, minimum: 1, maximum: 150, description: سرعت متوسط (پیش‌فرض ۳۰) }
                service_min_per_stop: { type: number, format: double, minimum: 0, maximum: 240, description: زمان خدمت در هر توقف به دقیقه (پیش‌فرض ۵) }
      responses:
        '200':
          description: مسیرِ بهینه‌شده با ترتیبِ توقف‌ها و برآورد مسافت/زمان
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutingOptimization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
