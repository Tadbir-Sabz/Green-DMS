              schema: { $ref: '#/components/schemas/CustomerRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleRejected' }
  /requests/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [requests]
      summary: جزئیات درخواست
      responses:
        '200':
          description: درخواست
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [requests]
      summary: به‌روزرسانی درخواست
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerRequest' }
      responses:
        '200':
          description: درخواست به‌روزرسانی شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerRequest' }
  /requests/{id}/convert:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    post:
      tags: [requests]
      summary: تبدیل درخواست تأییدشده به سفارش فروش (با حفظِ actor و مجوزهای نشست)
      description: |
        TASK-24W · HIGH-1-R1 — تبدیل سفارش را از همان مسیرِ یگانهٔ `POST /orders`
        می‌سازد (کفِ سود، سقفِ تخفیف، قواعد، اعتبار و موجودی همه اعمال می‌شوند) ولی
        زمینهٔ احراز هویت را حفظ می‌کند:

        * **actor** از نشست می‌آید؛ نبودِ آن ⇒ 403 (fail-closed).
        * مجوز `sales.request.convert` برای خودِ مسیر الزامی است.
        * اگر قلمی `requested_price` داشته باشد، مجوز `pricing.manual_price.apply`
          الزامی است؛ در غیر این صورت 403 `manual_price_not_authorized`.
        * اگر قیمتِ درخواستی از قیمتِ سیستمی واگرا باشد (یا سقفِ تخفیف رد شود)،
          `price_override_reason` الزامی است (حداقل ۳ نویسه) وگرنه 400.
        * پرچم‌های مجوز در بدنه پذیرفته نمی‌شوند؛ فقط `price_override_reason`/`note`.
        * ممیزی: یک ردیفِ `convert_to_order` در دفترِ تغییرِ قیمت با `request_id`،
          `order_id`، actor، قیمت‌های درخواستی، دلیل و مجوزهای مؤثر.
        * تبدیل **اتمیک** است: تبدیلِ هم‌زمان/تکراری ⇒ 409 و فقط یک سفارش.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConvertRequest' }
      responses:
        '201':
          description: سفارش ساخته شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleRejected' }
