components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: توکن دسترسی کوتاه‌عمر (۱۵ دقیقه)؛ تازه‌سازی با `/auth/refresh`
    externalApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: کلید مصرف‌کننده بیرونی (طرح نرخ‌گذاری‌شده)

  parameters:
    cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: مقدار `next_cursor` صفحه قبلی
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: اندازه صفحه
    idPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    domainIdPath:
      name: domainId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: شناسه دامنه؛ تنها پس از احراز مالکیت و اختیار سرور قابل مصرف است
    productIdPath:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: شناسه کالای مرکزی؛ هویت کالا شبیهسازی یا تکثیر نمیشود
    xDomainIdHeader:
      name: x-domain-id
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: زمینه اجباری دامنه؛ نبود آن بستهشدن ایمن با ۴۰۰ است

  responses:
    BadRequest:
      description: درخواست نامعتبر (خطای اعتبارسنجی)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: نشست نامعتبر یا منقضی — نیازمند ورود مجدد/تازه‌سازی
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: مجوز کافی نیست (RBAC — ضمیمه H)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: منبع یافت نشد
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: تعارض (کد تکراری، client_uuid تکراری یا row_version ناهمخوان)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Locked:
      description: حساب قفل شده (تلاش‌های ناموفق متوالی)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RuleRejected:
      description: موتور قوانین عملیات را رد کرد؛ `message_fa` را به کاربر نمایش دهید
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: اتصال کاتالوگ دامنه تا تصمیم مالک و مرجع معتبر غیرفعال است؛ هیچ داده عضویت ارائه نمیشود
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DomainCatalogUnavailable' }
    TooManyRequests:
      description: >-
        نرخ درخواست بیش از حد مجاز. بدنهٔ پاسخ کدِ too_many_requests و
        retry_after_sec را دارد؛ Retry-After هم به‌صورتِ سرصفحهٔ استاندارد برمی‌گردد.
      headers:
        Retry-After:
          description: ثانیه‌هایِ باقی‌مانده تا پایانِ پنجرهٔ نرخ
          schema: { type: integer, minimum: 1 }
        RateLimit-Limit:
          schema: { type: integer }
        RateLimit-Remaining:
          schema: { type: integer }
        RateLimit-Reset:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Error:
      type: object
      required: [code, message_fa]
      properties:
        code:
          type: string
          description: |
            کدِ پایدارِ خطا برای مصرفِ برنامه‌ای (متنِ نمایشی `message_fa` است و ممکن است تغییر کند).

            کدهای تازهٔ TASK-24X که کلاینت باید بشناسد:

            **ایمنیِ درخواست (A-1)** — `409`
            - `request_already_converted`: همین `request_id` قبلاً به سفارش تبدیل شده است؛
              `details.sales_order_id` شناسهٔ سفارشِ موجود را می‌دهد. عملیاتِ تکراری نیست:
              کلاینت باید همان سفارش را نمایش دهد، نه دوباره تلاش کند.

            **استثنای کفِ سود (C-1)** — همگی `409`
            - `approval_chain_required`: هیچ زنجیرهٔ تأییدِ فعالی برای `pricing.margin_exception`
              تعریف نشده است. بدونِ آن هیچ استثنایی ثبت نمی‌شود (fail-closed).
            - `approval_chain_empty`: زنجیره وجود دارد ولی هیچ مرحله‌ای ندارد.
            - `approval_engine_unavailable`: موتورِ تأیید در دسترس نیست.
            - `approval_request_failed`: ساختِ درخواستِ تأیید ناموفق بود؛ استثنا لغو شد.
            - `approval_link_failed`: اتصالِ استثنا به درخواستِ تأیید ناموفق بود؛ استثنا لغو شد.
            - `approval_request_missing`: ردیفِ تاریخی که به هیچ گردشِ تأییدی وصل نیست
              (دادهٔ پیش از TASK-24X) — قابلِ تأیید نیست، باید لغو و دوباره ثبت شود.
            - `approval_pending`: گردشِ تأییدِ متصل هنوز تأیید نشده است.
            - `second_person_required`: تأییدکننده همان درخواست‌دهنده است.
            - `self_approval_forbidden`: تأییدِ درخواستِ خود در گردشِ تأیید (همیشه `403`).
            - `approver_not_authorized`: تصمیم‌گیرنده نقش/کارمندِ آن مرحله نیست (`403`).
            - `amount_band_mismatch`: مبلغِ درخواست با باندِ گامِ ورودی نمی‌خواند.
            - `duplicate_decision`: برای این مرحله قبلاً تصمیم ثبت شده است.

            **مرز مرکزی/دامنهای Product Master (TASK-PM-02)** — همگی `400`
            - `domain_property_rejected`: ویژگی عضویت، دسترسپذیری، فعالسازی یا
              هویت دامنهای در بدنه، query یا سرستون CSV یک عملیات کاتالوگ مرکزی
              ارسال شده است؛ هیچ نوشتهای انجام نشد. `details.fields` نام فیلدها
              و `details.owner_decisions` تصمیمهای باز مالک را میدهد.
            - `domain_context_not_supported`: هدر `x-domain-id` روی عملیات
              کاتالوگ مرکزی ارسال شده است. شناسهٔ ارسالی مشتری اثبات هویت دامنه
              نیست و نمای مرکزی را دامنهای نمیکند.

            **همسانی سطوح خواندنی مرکزی (TASK-PM-02-B2)** — فهرست، جزئیات،
            خروجی CSV و گزارش import نیز همین مرز را اعمال میکنند: کلید query
            دامنهای ناشناخته پیش از حذف بیصدای `whitelist` رد میشود، بنابراین
            درخواست `?available=true` هرگز یک نمای مرکزی کامل را بهعنوان پاسخ
            «دامنهای» برنمیگرداند. این فقط یک دفاع fail-closed است؛ هیچ هویت،
            عضویت، وضعیت یا اختیار دامنهای ایجاد نمیکند.
          examples: ['validation_failed', 'rule_rejected', 'version_conflict', 'request_already_converted', 'approval_chain_required', 'domain_property_rejected', 'domain_context_not_supported']
        message_fa: { type: string, description: پیام فارسی آماده نمایش به کاربر }
        details:
          type: object
          additionalProperties: true
          description: جزئیات فیلد/قاعده ردشده — هر پیام فیلد فارسی است (details.fields.{نام فیلد})
        request_id: { type: string, description: شناسه پیگیری برای ممیزی }

    Page:
      type: object
      properties:
        next_cursor:
          type: [string, 'null']
          description: مقدار cursor برای صفحه بعدی؛ null یعنی پایان
        has_more: { type: boolean }

    GeoPoint:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Point] }
        coordinates:
          type: array
          items: { type: number }
          minItems: 2
          maxItems: 2
          description: '[طول، عرض] به WGS84'

    GeoLineString:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [LineString] }
        coordinates:
          type: array
          items:
            type: array
            items: { type: number }
            minItems: 2
            maxItems: 2

    UpdateGeofence:
      type: object
      description: به‌روزرسانی جزئی محدوده — همه فیلدها اختیاری
      properties:
        name: { type: string, maxLength: 120 }
        kind: { type: string, enum: [work_area, customer, warehouse, restricted] }
        area: { $ref: '#/components/schemas/GeoPolygon' }
        customer_id: { type: [string, 'null'], format: uuid }
        warehouse_id: { type: [string, 'null'], format: uuid }
        is_active: { type: boolean }
    GeoPolygon:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Polygon] }
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items: { type: number }
              minItems: 2
              maxItems: 2

    LoginRequest:
      type: object
      required: [username]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        otp_code: { type: string, description: در صورت فعال‌بودن ورود دومرحله‌ای }

    PasswordResetRequest:
      type: object
      required: [username, code, new_password]
      description: بازیابی رمز عبور با کد پیامکیِ دلیل password_reset
      properties:
        username: { type: string }
        code: { type: string, minLength: 4, maxLength: 8, description: همان کد پیامک‌شده }
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
          description: رمز تازه (دست‌کم ۸ نویسه)؛ فقط هش آن ذخیره و هرگز برنمی‌گردد

    AuthSession:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token: { type: string, description: JWT کوتاه‌عمر }
        refresh_token: { type: string }
        expires_in: { type: integer, description: طول عمر access_token به ثانیه }
        user: { $ref: '#/components/schemas/User' }

    Device:
      type: object
      description: >-
        دستگاه مجاز کاربر (جدول device — مهاجرت 0012)؛ پایه «کنترل دستگاه:
        لیست دستگاه‌های مجاز و ابطال از راه دور» در ضمیمه H
      required: [id, device_uuid, platform, app_kind, is_trusted, created_at]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        device_uuid: { type: string, description: شناسه سخت‌افزاری/نصب اپ (از سوی اپ ارسال می‌شود) }
        platform: { type: string, enum: [android] }
        app_kind: { type: string, enum: [sales, delivery, telesales] }
        app_version: { type: [string, 'null'] }
        os_version: { type: [string, 'null'] }
        push_token: { type: [string, 'null'] }
        is_trusted:
          type: boolean
          description: با تأیید کد پیامکی (device_bind) true می‌شود؛ تا آن زمان دستگاه مجاز نیست
        last_seen_at: { type: [string, 'null'], format: date-time }
        revoked_at:
          type: [string, 'null']
          format: date-time
          description: باطل‌شده؟ null یعنی فعال؛ ردیف برای ممیزی می‌ماند
        created_at: { type: string, format: date-time, readOnly: true }

    DeviceCreate:
      type: object
      required: [device_uuid, platform, app_kind]
      properties:
        device_uuid: { type: string, minLength: 1, maxLength: 128 }
        platform: { type: string, enum: [android] }
        app_kind: { type: string, enum: [sales, delivery, telesales] }
        app_version: { type: string, maxLength: 32 }
        os_version: { type: string, maxLength: 32 }
        push_token: { type: string, maxLength: 512 }

    SessionContext:
      type: object
      required: [user, roles, permissions]
      description: >
        پاسخ GET /auth/me — نقش‌ها و مجوزهای resolveشده از جداول مهاجرت 0004 و
        seed 0022؛ رابط کاربری بدون فراخوانی مجدد می‌تواند منو و دکمه‌ها را بسازد
      properties:
        user: { $ref: '#/components/schemas/User' }
        roles:
          type: array
          items: { type: string }
          description: کدهای نقش کاربر
        permissions:
          type: array
          items: { type: string }
          description: مجوزهای قطعی (الگوهای نقش resolve شده‌اند)

    User:
      type: object
      required: [username]
      description: >
        کاربر سیستم؛ «فروشنده» لزوماً کاربر نیست (فقط پرسنل میدانی).
        فیلدهای writeOnly فقط در POST /users و PATCH /users/{id} پذیرفته می‌شوند
        و هرگز در پاسخ برنمی‌گردند (رمز عبور اصلاً ذخیره/برگردانده نمی‌شود).
      properties:
        id: { type: string, format: uuid, readOnly: true }
        username: { type: string }
        staff_id: { type: [string, 'null'], format: uuid, description: نسبت به پرسنل، در صورت وجود }
        role_ids:
          type: array
          items: { type: string, format: uuid }
        is_active: { type: boolean }
        locked_until: { type: [string, 'null'], format: date-time, readOnly: true }
        last_login_at: { type: [string, 'null'], format: date-time, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        # ------- فقط-نوشتَنی (درخواست‌های POST/PATCH) -------
        password:
          type: string
          format: password
          writeOnly: true
          description: رمز عبور؛ هش آن ذخیره می‌شود و در پاسخ هرگز برنمی‌گردد
        access_level:
          type: string
          enum: [web, field_sales, field_delivery, field_telesales, scope_only, none]
          description: سطح دسترسی کاربر (check app_user_access_level — مهاجرت 0004 §۱.۴)
        is_locked:
          type: boolean
          description: >
            قفل دستی توسط مدیر: در GET /users وضعیت فعلی قفل را می‌دهد و در
            POST/PATCH دستور قفل (true) یا باز کردن قفل و صفر کردن شمارنده تلاش (false) است
        person_code:
          type: string
          writeOnly: true
          description: کد شخص تازه — فقط وقتی staff_id داده نشده باشد (پیش‌فرض USR-نام کاربری)
        first_name:
          type: string
          writeOnly: true
          description: نام شخص تازه — فقط وقتی staff_id داده نشده باشد
        last_name:
          type: string
          writeOnly: true
          description: نام خانوادگی شخص تازه — فقط وقتی staff_id داده نشده باشد

    Role:
      type: object
      required: [code, name]
      description: نقش با الگوی اعطای مجوز («*» همه، «x.y» زیرمجموعه)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string, examples: ['salesperson_cold', 'supervisor'] }
        name: { type: string }
        is_system: { type: boolean, readOnly: true }
        permission_codes:
          type: array
          items: { type: string }
          description: الگوهای مجوز اعطا شده (از seed مهاجرت 0022)

    Person:
      type: object
      required: [code, legal_type]
      description: >
        شخص حقیقی/حقوقی — پایه مشتری، تأمین‌کننده و پرسنل.
        legal_type دقیقاً همان مقادیر check قید جدول person است (natural/legal)؛
        برای legal باید legal_name و برای natural باید first_name یا last_name آمده باشد.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string, description: کد شخص در شرکت (قید یکتای company_id+code) }
        legal_type: { type: string, enum: [natural, legal] }
        first_name: { type: [string, 'null'], description: برای شخص حقیقی }
        last_name: { type: [string, 'null'], description: برای شخص حقیقی }
        legal_name: { type: [string, 'null'], description: برای شخص حقوقی (legal) }
        national_id: { type: [string, 'null'] }
        economic_code: { type: [string, 'null'], description: برای شخص حقوقی }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time, readOnly: true }

    Staff:
      type: object
      required: [person_id]
      description: پرسنل — سمت، سرپرست، وسیله و حوزه کاری
      properties:
        id: { type: string, format: uuid, readOnly: true }
        person_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        job_position_code: { type: string, examples: ['salesperson_cold', 'courier'] }
        employee_no: { type: string }
        hire_date: { type: string, format: date }
        supervisor_id: { type: [string, 'null'], format: uuid, description: نسبت فروشنده به سرپرست }
        vehicle_id: { type: [string, 'null'], format: uuid }
        is_field: { type: boolean, description: آیا میدانی است (رهگیری/تور) }
        area_ids:
          type: array
          items: { type: string, format: uuid }
          description: حوزه‌های مجاز کار
        status: { type: string, enum: [active, inactive] }
        created_at: { type: string, format: date-time, readOnly: true }
        row_version: { type: integer, minimum: 0, description: نسخه قفل خوش‌بینانه — مغایرت با سرور در PATCH برابر است با 409 version_conflict }

    UpdateStaff:
      type: object
      description: به‌روزرسانی جزئی پرسنل — همه فیلدها اختیاری (متناظر با PartialType(CreateStaffDto) سمت API)
      properties:
        person_id: { type: string, format: uuid }
        job_position_code: { type: string }
        employee_no: { type: string }
        hire_date: { type: string, format: date }
        supervisor_id: { type: [string, 'null'], format: uuid }
        vehicle_id: { type: [string, 'null'], format: uuid }
        is_field: { type: boolean }
        area_ids:
          type: array
          items: { type: string, format: uuid }
        status: { type: string, enum: [active, inactive] }
        row_version: { type: integer, minimum: 0 }

    Customer:
      type: object
      required: [person_id, code]
      description: مشتری با مسیر، لیست قیمت، شرایط تسویه و موقعیت نقشه
      properties:
        id: { type: string, format: uuid, readOnly: true }
        person_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        code: { type: string }
        area_id: { type: [string, 'null'], format: uuid }
        route_id: { type: [string, 'null'], format: uuid }
        salesperson_id: { type: [string, 'null'], format: uuid }
        channel: { type: string, description: کانال فروش (سرد/گرم/پورتال) }
        price_list_id: { type: [string, 'null'], format: uuid }
        settlement_term_id: { type: [string, 'null'], format: uuid }
        visit_sequence: { type: integer, description: ترتیب در مسیر }
        geo: { oneOf: [{ $ref: '#/components/schemas/GeoPoint' }, { type: 'null' }] }
        geo_accuracy_m: { type: number }
        geo_source: { type: string, enum: [gps, map_pick, geocode, import] }
        geo_captured_at: { type: [string, 'null'], format: date-time, readOnly: true }
        credit_limit: { type: [string, 'null'], description: سقف اعتبار (رشته اعشاری) }
        status: { type: string, enum: [active, suspended, blocked, closed] }
        created_at: { type: string, format: date-time, readOnly: true }
        row_version: { type: integer, minimum: 0, description: نسخه قفل خوش‌بینانه — مغایرت با سرور در PATCH برابر است با 409 version_conflict }

    Product:
      type: object
      required:
        - id
        - code
        - name
        - category_id
        - base_uom_id
        - is_batch_tracked
        - is_expiry_tracked
        - is_returnable_container
        - requires_permit
        - distribution_kind
        - min_order_qty
        - status
        - created_at
        - row_version
      description: >
        کالا — پاسخ سرور (همه فیلدهای الزامی همیشه در پاسخ هستند؛ فیلدهای
        nullable مثل brand_id ممکن است null باشند). برای نوشتن از
        ProductCreate (POST) و ProductUpdate (PATCH) استفاده می‌شود.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string }
        name: { type: string }
        name_latin: { type: [string, 'null'], description: 'نام لاتین (اختیاری) — نمایش: فارسی، fallback لاتین' }
        family_id: { type: [string, 'null'], format: uuid, description: 'خانوادهٔ اختیاریِ variant (SKU-per-variant)' }
        variant_signature: { type: [string, 'null'], readOnly: true, description: 'sha256 قطعیِ محورهای variant (M-3)' }
        category_id: { type: string, format: uuid }
        brand_id: { type: [string, 'null'], format: uuid }
        base_uom_id: { type: string, format: uuid }
        tax_code_id: { type: [string, 'null'], format: uuid }
        is_batch_tracked: { type: boolean }
        is_expiry_tracked: { type: boolean }
        shelf_life_days: { type: [integer, 'null'], description: 'null یعنی کالای انقضادار نیست' }
        is_returnable_container: { type: boolean, description: کالای برگشت‌پذیر (بشکه/سیلندر) }
        requires_permit: { type: boolean }
        distribution_kind: { type: string, enum: [cold, warm, both], description: نوع توزیع (سرد/گرم/هر دو) }
        min_order_qty: { type: number, description: 'حداقل سفارش (رشته اعشاری از دیتابیس به عدد سریالایز می‌شود)' }
        weight_gr: { type: [integer, 'null'] }
        volume_cm3: { type: [integer, 'null'] }
        status: { type: string, enum: [active, blocked, discontinued] }
        created_at: { type: string, format: date-time, readOnly: true }
        row_version:
          type: integer
          readOnly: true
          description: قفل خوش‌بینانه — PATCH با این مقدار مغایرت = 409 version_conflict

    ProductCreate:
      type: object
      required: [name, category_id, base_uom_id]
      description: >-
        فیلدهای نوشتنی برای POST — سرور id، status، created_at و row_version را
        می‌سازد؛ فیلدهای اختیاری مقدار پیش‌فرض DDL می‌گیرند. D1: code اختیاری است؛
        در صورتِ عدمِ ارسال، کدِ خودکارِ SKU-XXXXXX ساخته می‌شود.
      properties:
        code: { type: string, description: 'D1: اختیاری — خالی = تولیدِ خودکارِ SKU' }
        name: { type: string }
        name_latin: { type: [string, 'null'], description: 'M-3: نامِ لاتینِ کالا' }
        family_id: { type: [string, 'null'], format: uuid, description: 'M-3: خانواده (محورِ variant)' }
        category_id: { type: string, format: uuid }
        brand_id: { type: [string, 'null'], format: uuid }
        base_uom_id: { type: string, format: uuid }
        tax_code_id: { type: [string, 'null'], format: uuid }
        is_batch_tracked: { type: boolean }
        is_expiry_tracked: { type: boolean }
        shelf_life_days: { type: [integer, 'null'], description: 'فقط برای کالای انقضادار' }
        is_returnable_container: { type: boolean }
        requires_permit: { type: boolean }
        distribution_kind: { type: string, enum: [cold, warm, both] }
        min_order_qty: { type: number }
        weight_gr: { type: [integer, 'null'] }
        volume_cm3: { type: [integer, 'null'] }

    ProductUpdate:
      type: object
      description: >
        فیلدهای قابل تغییر PATCH — همه اختیاری؛ تغییرها با row_version اعمال
        می‌شوند (مغایرت = 409 version_conflict)
      properties:
        code: { type: string }
        name: { type: string }
        name_latin: { type: [string, 'null'] }
        family_id: { type: [string, 'null'], format: uuid }
        category_id: { type: string, format: uuid }
        brand_id: { type: [string, 'null'], format: uuid }
        base_uom_id: { type: string, format: uuid }
        tax_code_id: { type: [string, 'null'], format: uuid }
        is_batch_tracked: { type: boolean }
        is_expiry_tracked: { type: boolean }
        shelf_life_days: { type: [integer, 'null'] }
        is_returnable_container: { type: boolean }
        requires_permit: { type: boolean }
        distribution_kind: { type: string, enum: [cold, warm, both] }
        min_order_qty: { type: number }
        weight_gr: { type: [integer, 'null'] }
        volume_cm3: { type: [integer, 'null'] }
        status: { type: string, enum: [active, blocked, discontinued] }
        row_version:
          type: integer
          description: قفل خوش‌بینانه — مقدار فرستاده‌شده باید با مقدار فعلی سرور یکی باشد
        confirm_sensitive:
          type: boolean
          description: 'D4: تأییدِ صریحِ دومرحله‌ای برای تغییراتِ حساس (مالیات/وضعیت/واحدِ پایه) — بدون آن 400'

    ProductCategory:
      type: object
      required: [id, code, name]
      description: دسته‌بندی درختی کالا (هر شرکت ساختار خودش را دارد)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string }
        name: { type: string }
        parent_id: { type: [string, 'null'], format: uuid, description: والد در سلسله‌مراتب }
        name_latin: { type: [string, 'null'] }
        parent_name: { type: [string, 'null'] }
        cost_method: { type: string, enum: [moving_avg, fifo, standard] }
        is_active: { type: boolean }
        product_count: { type: integer, minimum: 0 }
        child_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Unit:
      type: object
      required: [id, code, title]
      description: واحد اندازه‌گیری — داده مرجع سراسری (جدول uom)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string, examples: ['pcs', 'box', 'carton'] }
        title: { type: string }
        decimal_places: { type: integer, minimum: 0, maximum: 4 }
        symbol: { type: [string, 'null'], maxLength: 16 }
        title_latin: { type: [string, 'null'], maxLength: 64 }
        is_active: { type: boolean }
        product_count: { type: integer, minimum: 0 }
        packaging_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PriceList:
      type: object
      required: [code, title]
      description: لیست قیمت؛ قیمت مشتری‌محور در `customer_price` اولویت دارد
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string }
        title: { type: string }
        kind: { type: string, enum: [general, wholesale, retail, chain, cooperative, channel] }
        currency: { type: string, minLength: 3, maxLength: 3, default: IRR }
        is_active: { type: boolean }
        items:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              packaging_id: { type: [string, 'null'], format: uuid, description: 'M-2: قیمتِ سطحِ بسته‌بندی — NULL = واحدِ پایه' }
              price: { type: string, description: 'قیمت واحد (رشته اعشاری)' }
              valid_from: { type: [string, 'null'], format: date }
              valid_to: { type: [string, 'null'], format: date }

    Promotion:
      type: object
      required: [code, title, kind]
      description: تخفیف/جایزه با شرایط و منفعت به JSON (ماژول ۱)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string }
        title: { type: string }
        kind: { type: string, enum: [percent_line, amount_line, bundle, buy_x_get_y, gift_item, cash_discount, repeat_order, coupon, volume_tier] }
        valid_from: { type: string, format: date }
        valid_to: { type: string, format: date }
        priority: { type: integer }
        allow_stacking: { type: boolean }
        max_discount_amount: { type: [string, 'null'] }
        max_per_customer_per_day: { type: [string, 'null'] }
        conditions:
          type: object
          additionalProperties: true
          description: شرایط احراز (کالا/کانال/حداقل مبلغ)
        benefit:
          type: object
          additionalProperties: true
          description: منفعت (درصد/مبلغ/کالای جایزه)
        is_active: { type: boolean }

    # ---------------- موتور قیمت/تخفیف (TASK-24) ----------------
    PricingDomain:
      type: object
      required: [code, title, kind]
      description: قلمرو قیمت‌گذاری (کانال/حوزه/شعبه) — قیمت قلمروی بر لیست سراسری شرکت اولویت دارد
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 128 }
        kind: { type: string, enum: [channel, area, branch] }
        channel: { type: [string, 'null'], enum: [retail, wholesale, chain, horeca, institution, null] }
        area_id: { type: [string, 'null'], format: uuid }
        branch_id: { type: [string, 'null'], format: uuid }
        priority: { type: integer, minimum: 0, maximum: 1000 }
        is_active: { type: boolean }

    MarginPolicy:
      type: object
      required: [scope, min_margin_pct]
      description: سیاست کف سود؛ دقت انتخاب کالا(۳) > دسته(۲) > شرکت(۱) و در تساوی، قلمرو و اولویت
      properties:
        id: { type: string, format: uuid, readOnly: true }
        domain_id: { type: [string, 'null'], format: uuid }
        scope: { type: string, enum: [company, category, product] }
        category_id: { type: [string, 'null'], format: uuid }
        product_id: { type: [string, 'null'], format: uuid }
        cost_basis: { type: string, enum: [avg_cost, standard_cost, last_purchase_cost], default: avg_cost }
        min_margin_pct: { type: string, description: درصد کف سود (رشته اعشاری؛ می‌تواند منفی باشد) }
        on_unknown_cost: { type: string, enum: [block, warn, ignore], default: warn }
        valid_from: { type: [string, 'null'], format: date }
        valid_to: { type: [string, 'null'], format: date }
        priority: { type: integer, minimum: 0, maximum: 1000 }
        is_active: { type: boolean }

    MarginException:
      type: object
      required: [entity_type, reason]
      description: استثنای کف سود؛ فقط با تأیید شخص دوم (≠ درخواست‌دهنده) معتبر است
      properties:
        id: { type: string, format: uuid, readOnly: true }
        entity_type: { type: string, enum: [price_list_item, customer_price, sales_order, promotion] }
        entity_id: { type: [string, 'null'], format: uuid }
        product_id: { type: [string, 'null'], format: uuid }
        customer_id: { type: [string, 'null'], format: uuid }
        policy_id: { type: [string, 'null'], format: uuid }
        required_margin_pct: { type: [number, 'null'] }
        effective_margin_pct: { type: [number, 'null'] }
        granted_margin_pct: { type: [number, 'null'] }
        reason: { type: string, maxLength: 1000 }
        status: { type: string, enum: [pending, approved, rejected, expired, cancelled], readOnly: true }
        requested_by: { type: string, format: uuid, readOnly: true }
        decided_by: { type: [string, 'null'], format: uuid, readOnly: true }
        decided_at: { type: [string, 'null'], format: date-time, readOnly: true }
        valid_until: { type: [string, 'null'], format: date }
        approval_request_id: { type: [string, 'null'], format: uuid, readOnly: true }

    CustomerPrice:
      type: object
      required: [customer_id, product_id, price]
      description: قیمت اختصاصی مشتری — بالاترین اولویت در حل قیمت
      properties:
        id: { type: string, format: uuid, readOnly: true }
        customer_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        packaging_id: { type: [string, 'null'], format: uuid }
        price: { type: string }
        min_qty: { type: [string, 'null'] }
        max_qty: { type: [string, 'null'] }
        max_discount_pct: { type: [string, 'null'] }
        valid_from: { type: [string, 'null'], format: date }
        valid_to: { type: [string, 'null'], format: date }
        note: { type: [string, 'null'], maxLength: 500 }
        margin_exception_id: { type: [string, 'null'], format: uuid }
        row_version: { type: integer, minimum: 0 }
        approved_by: { type: [string, 'null'], format: uuid, readOnly: true }

    Coupon:
      type: object
      required: [code]
      description: کوپن تشویق؛ اجرای تشویق‌های requires_coupon فقط با کوپن معتبر
      properties:
        id: { type: string, format: uuid, readOnly: true }
        promotion_id: { type: string, format: uuid, readOnly: true }
        code: { type: string, maxLength: 64 }
        customer_id: { type: [string, 'null'], format: uuid }
        valid_from: { type: [string, 'null'], format: date }
        valid_to: { type: [string, 'null'], format: date }
        max_uses: { type: [integer, 'null'], minimum: 1 }
        max_uses_per_customer: { type: [integer, 'null'], minimum: 1 }
        is_active: { type: boolean }

    PriceChangeLog:
      type: object
      description: 'ردیف دفتر تغییر قیمت (append-only؛ UPDATE/DELETE در DB مسدود است)'
      properties:
        id: { type: integer }
        entity_type: { type: string }
        entity_id: { type: [string, 'null'], format: uuid }
        action: { type: string }
        before_data: { type: [object, 'null'], additionalProperties: true }
        after_data: { type: [object, 'null'], additionalProperties: true }
        actor_user_id: { type: [string, 'null'], format: uuid }
        at: { type: string, format: date-time }

    PricingSettings:
      type: object
      description: سیاست پایدار قیمت‌گذاری شرکت (TASK-24F)
      properties:
        apply_promotions_on_orders: { type: boolean, description: اعمال خودکار تشویق‌ها روی سفارش (پیش‌فرض false) }
        max_total_discount_pct: { type: [number, 'null'], minimum: 0, maximum: 100, description: سقف کل تخفیف سند؛ null = بدون سقف }
        max_line_discount_pct: { type: [number, 'null'], minimum: 0, maximum: 100, description: سقف پیش‌فرض تخفیف هر قلم وقتی منبع قیمت سقف ندارد }
        allow_loss_making_sales: { type: boolean, description: اجازه فروش زیر بهای تمام‌شده (پیش‌فرض false) }
        min_order_date_lookback_days: { type: [integer, 'null'], minimum: 0, maximum: 3650, description: حداکثر عقب‌گرد مجاز تاریخ سفارش؛ null = فقط با مجوز pricing.backdate.apply }
        require_override_reason: { type: boolean, description: الزام دلیل برای قیمت دستی/عبور از سقف/تاریخ گذشته }
    PricingSettingsUpdate:
      type: object
      description: همه فیلدها اختیاری‌اند؛ فقط موارد ارسالی تغییر می‌کند.
      properties:
        apply_promotions_on_orders: { type: boolean }
        max_total_discount_pct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        max_line_discount_pct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        allow_loss_making_sales: { type: boolean }
        min_order_date_lookback_days: { type: [integer, 'null'], minimum: 0, maximum: 3650 }
        require_override_reason: { type: boolean }

    PriceQuoteRequest:
      type: object
      required: [lines]
      description: |
        درخواست استعلام/شبیه‌سازی قیمت. سقف کل تخفیف دیگر پارامتر درخواست نیست و از
        سیاست پایدار شرکت (`GET/PATCH /pricing/settings`) خوانده می‌شود (TASK-24F · HIGH-2).
        پرچم‌های allow_manual_price / allow_discount_override در قرارداد وجود ندارند و
        فقط از مجوزهای نشست تعیین می‌شوند (TASK-24F · HIGH-3).
      properties:
        customer_id: { type: [string, 'null'], format: uuid }
        pricing_date: { type: [string, 'null'], format: date, description: 'پیش‌فرض: تاریخ امروز' }
        price_list_id: { type: [string, 'null'], format: uuid }
        coupon_codes:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 64 }
        # TASK-24X · B-1 — `apply_promotions` از ورودیِ کلاینت حذف شد.
        # منبعِ معتبر `pricing_settings.apply_promotions_on_orders` است؛ استعلام،
        # شبیه‌سازی و سفارش با زمینهٔ یکسان نتیجهٔ یکسان می‌دهند. کلاینتی که این
        # فیلد را بفرستد دیگر اثری ندارد (فیلدِ ناشناخته به‌دلیل whitelist حذف
        # می‌شود)، ولی مقدارِ ارسالی هرگز نمی‌تواند سیاستِ شرکت را خاموش کند.
        cross_domain_reason: { type: [string, 'null'], maxLength: 500, description: 'دلیل استفاده از لیست قیمت قلمروی دیگر؛ فقط همراه مجوز pricing.price_list.cross_domain اثر دارد و ممیزی می‌شود' }
        idempotency_key: { type: [string, 'null'], maxLength: 128, description: 'کلید تکرارناپذیری؛ تکرار با همان بدنه نتیجه ذخیره‌شده را بازمی‌گرداند' }
        persist_audit: { type: boolean, description: فقط در simulate — پیش‌فرض true }
        lines:
          type: array
          maxItems: 200
          items:
            type: object
            required: [product_id, qty]
            properties:
              product_id: { type: string, format: uuid }
              packaging_id: { type: [string, 'null'], format: uuid }
              qty: { type: number, exclusiveMinimum: 0, maximum: 1000000000 }
              unit_price: { type: [string, 'null'], description: قیمت دستی (نیازمند مجوز pricing.manual_price.apply) }
              discount_amount: { type: [string, 'null'], description: تخفیف دستی قلم (فراتر از سقف نیازمند مجوز pricing.discount.override) }

    ConvertRequest:
      type: object
      description: |
        بدنهٔ اختیاریِ تبدیلِ درخواست به سفارش (TASK-24W). هیچ فیلدِ مجوزی وجود ندارد؛
        فیلدهای ناشناختهٔ بدنه توسط ValidationPipe حذف می‌شوند.
      properties:
        price_override_reason:
          type: string
          maxLength: 500
          description: دلیلِ الزامی وقتی قیمتِ درخواستی از قیمتِ سیستمی واگراست
        note:
          type: string
          maxLength: 500
          description: یادداشتِ اختیاریِ سفارش (جایگزینِ یادداشتِ درخواست)
    QuoteResult:
      type: object
      description: نتیجه ارزیابی موتور قیمت — همه مبالغ رشته اعشاری دو رقم اعشار
      properties:
        pricing_date: { type: string, format: date }
        currency: { type: string }
        customer_id: { type: [string, 'null'], format: uuid }
        domain_ids:
          type: array
          items: { type: string, format: uuid }
        lines:
          type: array
          items: { $ref: '#/components/schemas/QuoteLineResult' }
        subtotal: { type: string }
        manual_discount_total: { type: string }
        discount_total: { type: string }
        tax_total: { type: string }
        grand_total: { type: string }
        cost_total: { type: string }
        margin_pct: { type: [number, 'null'], description: حاشیه سود درصدی؛ در نبود درآمد تهی است }
        applied_promotions:
          type: array
          items: { $ref: '#/components/schemas/AppliedPromotion' }
        skipped_promotions:
          type: array
          items:
            type: object
            properties:
              promotion_id: { type: string, format: uuid }
              code: { type: string }
              reason:
                type: string
                enum: [not_applicable, condition_unmatched, unsupported_condition, unsupported_benefit, not_stackable, exclusive_group_conflict, blocked_by_non_stackable, daily_cap_exceeded, total_cap_exceeded, customer_cap_exceeded, coupon_required, coupon_invalid, zero_benefit]
                description: 'منبعِ حقیقت: SKIP_REASONS در pricing-engine.ts'
              message_fa: { type: string }
        gift_lines:
          type: array
          items:
            type: object
            properties:
              promotion_id: { type: string, format: uuid }
              promotion_code: { type: string }
              product_id: { type: string, format: uuid }
              qty: { type: number }
              unit_price: { type: string }
              value: { type: string }
              valuation_source: { type: string, enum: [basket, reference_price, unknown] }
              line_nos:
                type: array
                items: { type: integer }
                description: خطوط سبدی که هدیه به آن‌ها تخصیص یافته است
              requested_value: { type: [string, 'null'], description: ارزش نظری پیش از محدودشدن به مانده سبد }
        margin_violations:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              margin_pct: { type: [number, 'null'] }
              required_margin_pct: { type: [number, 'null'] }
              policy_id: { type: [string, 'null'], format: uuid }
              code:
                type: string
                enum: [margin_floor_violation, margin_cost_unknown, margin_loss_making]
                description: 'منبعِ حقیقت: MARGIN_VIOLATION_CODES در pricing-engine.ts'
              message_fa: { type: string }
        warnings:
          type: array
          items: { type: string }
        approval_required:
          type: object
          properties:
            required: { type: boolean }
            reasons:
              type: array
              items: { type: string }
        explanation:
          type: array
          items: { type: string }
        replayed: { type: boolean, description: true یعنی پاسخ از کش idempotency بازپخش شده است }
        idempotency_key: { type: [string, 'null'] }

    QuoteLineResult:
      type: object
      properties:
        line_no: { type: integer }
        product_id: { type: string, format: uuid }
        product_code: { type: string }
        product_name: { type: string }
        packaging_id: { type: [string, 'null'], format: uuid }
        packaging_title: { type: [string, 'null'] }
        packaging_factor: { type: number }
        qty: { type: number }
        qty_base: { type: number }
        unit_price: { type: string }
        gross: { type: string }
        manual_discount: { type: string }
        manual_discount_pct: { type: number }
        pricing:
          type: object
          properties:
            unit_price: { type: string }
            unit_price_base: { type: string }
            source: { type: string, enum: [customer, price_list, manual] }
            scope:
              type: string
              enum: [customer, explicit_list, domain, company, manual]
              description: 'منبع قیمت حل‌شده (TASK-24F: explicit_list جای requested_list)؛ منبعِ حقیقت: PRICE_SCOPES در pricing-engine.ts'
            price_list_id: { type: [string, 'null'], format: uuid }
            price_list_code: { type: [string, 'null'] }
            price_item_id: { type: [string, 'null'], format: uuid }
            customer_price_id: { type: [string, 'null'], format: uuid }
            packaging_id: { type: [string, 'null'], format: uuid }
            max_discount_pct: { type: [number, 'null'] }
            explanation_fa: { type: string }
        promotions:
          type: array
          items: { $ref: '#/components/schemas/AppliedPromotion' }
        discount_total: { type: string }
        net_ex_tax: { type: string }
        tax_rate_pct: { type: number }
        tax_amount: { type: string }
        line_total: { type: string }
        margin:
          type: object
          properties:
            cost_basis: { type: string, enum: [avg_cost, standard_cost, last_purchase_cost, none] }
            cost_unit: { type: [string, 'null'] }
            cost_total: { type: [string, 'null'] }
            net_revenue: { type: string }
            margin_pct: { type: [number, 'null'] }
            policy_id: { type: [string, 'null'], format: uuid }
            required_margin_pct: { type: [number, 'null'] }
            status:
              type: string
              enum: [ok, violation, cost_unknown, exception_applied, no_policy]
              description: 'منبعِ حقیقت: MARGIN_STATUSES در pricing-engine.ts (TASK-24F · MEDIUM-3)'
            exception_id: { type: [string, 'null'], format: uuid }
            exception_granted_margin_pct: { type: [number, 'null'], description: 'سقفِ واقعیِ تخفیفِ اعطاشده در استثنای اعمال‌شده (TASK-24F · MEDIUM-1)' }
            message_fa: { type: [string, 'null'] }
        gift_lines:
          type: array
          items: { type: object, additionalProperties: true }

    AppliedPromotion:
      type: object
      properties:
        promotion_id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        kind: { type: string, enum: [percent_line, amount_line, bundle, buy_x_get_y, gift_item, cash_discount, repeat_order, coupon, volume_tier] }
        priority: { type: integer }
        amount: { type: string }
        base_amount: { type: string }
        allow_stacking: { type: boolean }
        exclusive_group: { type: [string, 'null'] }
        coupon_code: { type: [string, 'null'] }
        coupon_id: { type: [string, 'null'], format: uuid }
        explanation_fa: { type: string }

    Warehouse:
      type: object
      required: [code, name, kind]
      description: انبار مرکزی، شعبه یا خودرو (انبار سیار)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        kind: { type: string, enum: [main, vehicle, transit, damaged, quarantine, consignment] }
        parent_warehouse_id: { type: [string, 'null'], format: uuid }
        vehicle_id: { type: [string, 'null'], format: uuid }
        area_id: { type: [string, 'null'], format: uuid }
        allow_negative: { type: boolean }
        is_active: { type: boolean }
        row_version: { type: integer, minimum: 0, description: نسخه قفل خوش‌بینانه — مغایرت با سرور در PATCH برابر است با 409 version_conflict }

    StockBalance:
      type: object
      description: موجودی قابل رزرو در انبار (بدون کلید مجزا — ترکیب انبار/کالا/بچ)
      properties:
        warehouse_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        batch_id: { type: [string, 'null'], format: uuid }
        qty_on_hand: { type: number }
        qty_reserved: { type: number }
        qty_available: { type: number, description: 'on_hand − reserved — محاسبه‌شده' }
        qty_on_hand_value: { type: [string, 'null'], description: ارزش موجودی (بهای تمام‌شده) }
        updated_at: { type: string, format: date-time, readOnly: true }

    StockAdjustment:
      type: object
      required: [warehouse_id, product_id, qty_delta, reason_code]
      description: اصلاحیه موجودی؛ مغایرت‌های بزرگ از طریق approvals تأیید می‌شوند
      properties:
        warehouse_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        batch_id: { type: [string, 'null'], format: uuid }
        qty_delta: { type: number }
        reason_code: { type: string, enum: [damage, expiry, sample, internal_use, theft, count_fix, other] }
        note: { type: [string, 'null'] }
        client_uuid: { type: string, format: uuid, description: کلید idempotency آفلاین — ثبت تکراری = 409 }

    StockTake:
      type: object
      required: [warehouse_id]
      description: سند انبارگردانی با شمارش واقعی در برابر سیستم
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid, readOnly: true }
        warehouse_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, counting, review, approved, posted, voided] }
        row_version: { type: integer, minimum: 0, description: نسخه قفل خوش‌بینانه — مغایرت با سرور در PATCH برابر است با 409 version_conflict }
        lines:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              batch_id: { type: [string, 'null'], format: uuid }
              system_qty: { type: number, readOnly: true }
              counted_qty: { type: number }
              variance_qty: { type: number, readOnly: true }

    Transfer:
      type: object
      required: [from_warehouse_id, to_warehouse_id]
      description: انتقال بین‌انباری (بارگیری خودرو / انتقال شعبه)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        doc_number: { type: string, readOnly: true }
        from_warehouse_id: { type: string, format: uuid }
        to_warehouse_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, approved, in_transit, received, voided] }
        lines:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              batch_id: { type: [string, 'null'], format: uuid }
              qty: { type: number }

    Area:
      type: object
      required: [code, name]
      description: حوزه فروش (سلسله‌مراتبی — هر حوزه انبار و وسایل نقلیه خود را دارد)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid }
        parent_area_id: { type: [string, 'null'], format: uuid }
        code: { type: string }
        name: { type: string }
        is_active: { type: boolean }

    Route:
      type: object
      required: [area_id, code, name]
      description: مسیر پیمایشی با ترتیب هفتگی بازدید مشتریان
      properties:
        id: { type: string, format: uuid, readOnly: true }
        area_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        visit_weekday: { type: [integer, 'null'], minimum: 0, maximum: 6, description: '۰=شنبه … ۵=جمعه' }
        is_active: { type: boolean }
        customer_ids:
          type: array
          items: { type: string, format: uuid }
          description: ترتیب مشتریان در مسیر

    Tour:
      type: object
      required: [tour_date, kind, salesperson_id]
      description: تور فروش/توزیع — دریافت توسط فروشنده یا تخصیص مدیر
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid, readOnly: true }
        doc_number: { type: string, readOnly: true }
        tour_date: { type: string, format: date }
        kind: { type: string, enum: [cold, warm, distribution, telesales] }
        salesperson_id: { type: string, format: uuid }
        supervisor_id: { type: [string, 'null'], format: uuid }
        route_id: { type: [string, 'null'], format: uuid }
        vehicle_id: { type: [string, 'null'], format: uuid }
        warehouse_id: { type: [string, 'null'], format: uuid, description: انبار سیار خودرو }
        status: { type: string, enum: [planned, active, settled, closed] }
        planned_start_at: { type: [string, 'null'], format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'] }

    TourSettlement:
      type: object
      description: تسویه تور — نقد دریافتی در برابر اسناد با مغایرت
      properties:
        tour_id: { type: string, format: uuid }
        expected_cash: { type: [string, 'null'], description: مجموع وصول‌های نقدی تور }
        received_cash: { type: [string, 'null'], description: نقد واقعاً تحویلی موزع }
        variance_amount: { type: [string, 'null'], description: 'مغایرت (مثبت=کسری)' }
        commission_total: { type: [string, 'null'], description: پورسانت محاسبه‌شده }
        status: { type: string, enum: [open, reconciled, closed] }

    Visit:
      type: object
      required: [tour_id, customer_id]
      description: بازدید با check-in/out مختصات‌دار و ضدتقلب
      properties:
        id: { type: string, format: uuid, readOnly: true }
        tour_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        check_in_at: { type: [string, 'null'], format: date-time }
        check_out_at: { type: [string, 'null'], format: date-time }
        geo_in: { oneOf: [{ $ref: '#/components/schemas/GeoPoint' }, { type: 'null' }] }
        geo_out: { oneOf: [{ $ref: '#/components/schemas/GeoPoint' }, { type: 'null' }] }
        accuracy_in_m: { type: [number, 'null'] }
        distance_m: { type: [string, 'null'], description: فاصله از موقعیت ثبت‌شده مشتری (متر) }
        result: { type: [string, 'null'], enum: [order, no_order, closed, payment_only, return_only, null], description: نتیجه بازدید — هم‌تراز با CHECK جدول visit (مهاجرت 0011) }
        no_order_reason: { type: [string, 'null'] }
        is_mocked: { type: boolean, readOnly: true, description: GPS جعلی تشخیص داده شد }
        client_uuid: { type: [string, 'null'], format: uuid, description: یکتای آفلاین — ثبت تکراری = 409 }

    CustomerRequest:
      type: object
      required: [customer_id, channel]
      description: درخواست مشتری پیش از سفارش (تلفنی/پورتال/میدانی/پیامک)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid, readOnly: true }
        customer_id: { type: string, format: uuid }
        channel: { type: string, enum: [field, telesale, portal, walk_in] }
        requested_by: { type: [string, 'null'], format: uuid }
        tour_id: { type: [string, 'null'], format: uuid }
        request_date: { type: string, format: date }
        requested_delivery_date: { type: [string, 'null'], format: date }
        note: { type: string }
        status: { type: string, enum: [draft, submitted, converted, rejected, cancelled] }
        sales_order_id: { type: [string, 'null'], format: uuid, readOnly: true }
        client_uuid: { type: string, format: uuid }

    SalesOrder:
      type: object
      required: [customer_id, order_date]
      description: |
        سفارش فروش — قیمت‌گذاری همیشه از موتور قیمت و با کنترل‌های سرور-محور انجام می‌شود
        (TASK-24F): کف سود، سقف تخفیف، مجوز قیمت دستی و تاریخ گذشته قابل خاموش‌شدن با
        بدنه درخواست نیستند.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid, readOnly: true }
        doc_number: { type: string, readOnly: true }
        fiscal_year: { type: integer, readOnly: true }
        customer_id: { type: string, format: uuid }
        request_id: { type: [string, 'null'], format: uuid }
        salesperson_id: { type: [string, 'null'], format: uuid }
        tour_id: { type: [string, 'null'], format: uuid }
        channel: { type: string, enum: [field, telesale, portal, walk_in] }
        order_date: { type: string, format: date }
        delivery_date: { type: [string, 'null'], format: date }
        price_list_id: { type: [string, 'null'], format: uuid }
        subtotal: { type: [string, 'null'], readOnly: true }
        discount_total: { type: [string, 'null'], readOnly: true }
        tax_total: { type: [string, 'null'], readOnly: true }
        grand_total: { type: [string, 'null'], readOnly: true }
        settlement_term_id: { type: [string, 'null'], format: uuid }
        status:
          type: string
          enum: [draft, pending_approval, approved, partially_delivered, delivered, invoiced, cancelled, rejected]
        approval_request_id: { type: [string, 'null'], format: uuid, readOnly: true }
        note: { type: [string, 'null'] }
        price_override_reason: { type: [string, 'null'], maxLength: 500, description: 'دلیل قیمت دستی/عبور از سقف/تاریخ گذشته؛ در دفتر تغییر قیمت با actor و قیمت سیستمی ثبت می‌شود' }
        client_uuid: { type: [string, 'null'], format: uuid }
        row_version: { type: integer, minimum: 0, description: نسخه قفل خوش‌بینانه — مغایرت با سرور در PATCH برابر است با 409 version_conflict }
        lines:
          type: array
          items:
            type: object
            required: [product_id, qty]
            properties:
              product_id: { type: string, format: uuid }
              qty: { type: number, description: 'تعداد به واحد انتخابی؛ به واحد پایه در qty_base ذخیره می‌شود' }
              packaging_id: { type: [string, 'null'], format: uuid }
              unit_price: { type: [string, 'null'], description: قیمت محاسبه‌شده لحظه ثبت }
              discount_amount: { type: [string, 'null'] }
              tax_rate_pct: { type: [number, 'null'], description: 'نرخ مالیات قلم از tax_code کالا (اگر vat شرکت فعال باشد)' }
              tax_amount: { type: [string, 'null'], readOnly: true }
              line_total: { type: [string, 'null'], readOnly: true, description: 'qty*unit_price - discount + tax' }

    Waybill:
      type: object
      required: [sales_order_id, warehouse_id]
      description: حواله انبار — رزرو موجودی و مبنای توزیع
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid, readOnly: true }
        doc_number: { type: string, readOnly: true }
        fiscal_year: { type: integer, readOnly: true }
        sales_order_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid, readOnly: true }
        warehouse_id: { type: string, format: uuid }
        issued_at: { type: [string, 'null'], format: date-time, readOnly: true }
        status: { type: string, enum: [draft, issued, delivered, voided] }
        note: { type: [string, 'null'] }
        lines:
          type: array
          items:
            type: object
            required: [product_id, qty]
            properties:
              product_id: { type: string, format: uuid }
              qty: { type: number }
              batch_id: { type: [string, 'null'], format: uuid }

    Invoice:
      type: object
      required: [customer_id, invoice_date]
      description: فاکتور فروش — پایه AR و ارسال مؤدیان
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid, readOnly: true }
        doc_number: { type: string, readOnly: true }
        fiscal_year: { type: integer, readOnly: true }
        customer_id: { type: string, format: uuid }
        sales_order_id: { type: [string, 'null'], format: uuid }
        waybill_id: { type: [string, 'null'], format: uuid }
        invoice_date: { type: string, format: date }
        due_date: { type: [string, 'null'], format: date }
        subtotal: { type: [string, 'null'], readOnly: true }
        discount_total: { type: [string, 'null'], readOnly: true }
        tax_total: { type: [string, 'null'], readOnly: true }
        grand_total: { type: [string, 'null'], readOnly: true }
        paid_amount: { type: [string, 'null'], readOnly: true }
        status: { type: string, enum: [draft, posted, partially_paid, paid, voided] }
        return_status: { type: [string, 'null'], enum: [none, partial, full, null] }
        moadian_status: { type: [string, 'null'], enum: [not_sent, queued, sent, accepted, rejected, corrected, null] }
        lines:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              qty: { type: number }
              unit_price: { type: [string, 'null'] }
              discount_amount: { type: [string, 'null'] }
              tax_amount: { type: [string, 'null'] }
              line_total: { type: [string, 'null'] }

    ReturnRequest:
      type: object
      required: [customer_id, reason_code]
      description: مرجوعی — درخواست، تأیید و ثبت نهایی با تعیین تکلیف کالا
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid, readOnly: true }
        doc_number: { type: string, readOnly: true }
        customer_id: { type: string, format: uuid }
        invoice_id: { type: [string, 'null'], format: uuid }
        tour_id: { type: [string, 'null'], format: uuid }
        reason_code:
          type: string
          enum: [damaged, expired, wrong_item, shortage, customer_refusal, promotion_error, other]
          examples: ['expired', 'damaged', 'shortage', 'wrong_item']
        status:
          type: string
          enum: [draft, submitted, approved, partially_approved, rejected, posted, closed]
        credit_note_id: { type: [string, 'null'], format: uuid, readOnly: true }
        requested_at: { type: [string, 'null'], format: date-time, readOnly: true }
        approved_at: { type: [string, 'null'], format: date-time, readOnly: true }
        note: { type: [string, 'null'] }
        lines:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              qty: { type: number }
              qty_approved: { type: [number, 'null'], readOnly: true, description: مقدار تأیید/دریافت‌شده (فقط خواندنی) }
              batch_id: { type: [string, 'null'], format: uuid }
              disposition:
                type: [string, 'null']
                enum: [restock, damaged, scrap, return_to_supplier, null]
                description: تعیین تکلیف نهایی کالا (فقط در receive)

    Delivery:
      type: object
      required: [waybill_id, planned_date]
      description: وضعیت تحویل حواله با مدرک تحویل (POD)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid, readOnly: true }
        doc_number: { type: string, readOnly: true }
        waybill_id: { type: string, format: uuid }
        tour_id: { type: [string, 'null'], format: uuid }
        courier_staff_id: { type: [string, 'null'], format: uuid }
        planned_date: { type: string, format: date }
        status: { type: string, enum: [planned, dispatched, delivered, partial, failed, cancelled] }
        delivered_at: { type: [string, 'null'], format: date-time }
        failure_reason: { type: [string, 'null'] }
        receiver_name: { type: [string, 'null'], description: نام امضاکننده }
        signature_url: { type: [string, 'null'], format: uri }
        photo_url: { type: [string, 'null'], format: uri, description: عکس ممیزی تحویل }

    ArAgingRow:
      type: object
      description: مانده مشتری با رده‌بندی سنی (ماژول ۷)
      properties:
        customer_id: { type: string, format: uuid }
        customer_code: { type: string }
        customer_name: { type: string }
        total: { type: string }
        current: { type: string }
        d1_30: { type: string }
        d31_60: { type: string }
        d61_90: { type: string }
        over_90: { type: string }

    CustomerStatement:
      type: object
      description: صورتحساب دوره‌ای مشتری
      properties:
        customer_id: { type: string, format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        opening_balance: { type: string }
        closing_balance: { type: string }
        lines:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              doc_type: { type: string, examples: ['invoice', 'credit_note', 'receipt'] }
              doc_number: { type: string }
              debit: { type: string }
              credit: { type: string }
              balance: { type: string }

    SupplierBalance:
      type: object
      description: مانده تأمین‌کننده (ماژول ۸)
      properties:
        supplier_person_id: { type: string, format: uuid }
        supplier_name: { type: string }
        total_payable: { type: string }
        due_next: { type: [string, 'null'], format: date }

    PurchaseOrderLine:
      type: object
      description: قلم سفارش خرید (ماژول ۸ — مهاجرت 0015)
      properties:
        line_no: { type: integer }
        product_id: { type: string, format: uuid }
        qty: { type: string }
        qty_received: { type: string }
        unit_price: { type: string }
        discount_amount: { type: string }
        tax_amount: { type: string }
        line_total: { type: string }

    PurchaseOrder:
      type: object
      # lines فقط در پاسخ جزئیات/ثبت می‌آید؛ فهرست (GET /purchase-orders) خلاصه
      # بی‌سطر برمی‌گرداند (الگوی summary-vs-detail، مانند SupplierInvoice).
      required: [branch_id, supplier_id, warehouse_id]
      description: سفارش خرید (ماژول ۸ — مهاجرت 0015)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid }
        doc_number: { type: string, readOnly: true }
        fiscal_year: { type: integer, readOnly: true }
        supplier_id: { type: string, format: uuid }
        warehouse_id: { type: string, format: uuid }
        order_date: { type: string, format: date }
        expected_date: { type: [string, 'null'], format: date }
        currency: { type: string }
        subtotal: { type: string, readOnly: true }
        discount_total: { type: string, readOnly: true }
        tax_total: { type: string, readOnly: true }
        grand_total: { type: string, readOnly: true }
        status:
          type: string
          readOnly: true
          enum: [draft, pending_approval, approved, partially_received, received, closed, cancelled]
        lines:
          type: array
          items: { $ref: '#/components/schemas/PurchaseOrderLine' }

    GoodsReceiptLine:
      type: object
      description: قلم رسید انبار خرید (ماژول ۸ — مهاجرت 0015، بدون line_no)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        product_id: { type: string, format: uuid }
        batch_id: { type: [string, 'null'], format: uuid }
        purchase_order_line_id: { type: [string, 'null'], format: uuid }
        qty_received: { type: string }
        qty_rejected: { type: string }
        unit_cost: { type: string }

    GoodsReceipt:
      type: object
      # lines فقط در پاسخ جزئیات/ثبت می‌آید؛ فهرست (GET /goods-receipts) خلاصهٔ
      # بی‌سطر برمی‌گرداند (الگوی summary-vs-detail، مانند PurchaseOrder).
      required: [branch_id, supplier_id, warehouse_id]
      description: رسید انبار خرید (GRN) — ماژول ۸، مهاجرت 0015
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid }
        doc_number: { type: string, readOnly: true }
        fiscal_year: { type: integer, readOnly: true }
        supplier_id: { type: string, format: uuid }
        warehouse_id: { type: string, format: uuid }
        purchase_order_id: { type: [string, 'null'], format: uuid }
        received_at: { type: string, format: date-time, readOnly: true }
        received_by: { type: [string, 'null'], format: uuid, readOnly: true }
        status:
          type: string
          readOnly: true
          enum: [draft, posted, voided]
        note: { type: [string, 'null'] }
        lines:
          type: array
          items: { $ref: '#/components/schemas/GoodsReceiptLine' }

    Valuation:
      type: object
      description: ارزش موجودی به ازای انبار/کالا (میانگین متحرک) — ماژول ۹، مهاجرت 0016
      properties:
        warehouse_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        method:
          type: string
          enum: [moving_avg, fifo, standard]
        avg_cost: { type: string }
        qty_on_hand: { type: string }
        value_on_hand: { type: string }
        last_purchase_cost: { type: [string, 'null'] }

    SupplierInvoiceLine:
      type: object
      description: قلم فاکتور تأمین‌کننده (ماژول ۸)
      properties:
        line_no: { type: integer }
        product_id: { type: string, format: uuid }
        qty: { type: string }
        unit_price: { type: string }
        tax_amount: { type: string }
        line_total: { type: string }

    SupplierInvoice:
      type: object
      required: [branch_id, supplier_id, doc_number, amount]
      description: فاکتور/صورت‌حساب تأمین‌کننده (ماژول ۸ — مهاجرت 0015)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid }
        doc_number: { type: string, description: شماره فاکتورِ تأمین‌کننده }
        internal_no: { type: string, readOnly: true, description: شمارهٔ داخلی سامانه }
        supplier_id: { type: string, format: uuid }
        purchase_order_id: { type: [string, 'null'], format: uuid }
        invoice_date: { type: string, format: date }
        due_date: { type: [string, 'null'], format: date }
        amount: { type: string, description: مبلغ خالص (بدون مالیات) }
        tax_amount: { type: string }
        status:
          type: string
          readOnly: true
          enum: [draft, matched, mismatch, approved, partially_paid, paid, voided]
        match_status:
          type: string
          readOnly: true
          enum: [pending, matched, price_variance, qty_variance, no_grn]
        lines:
          type: array
          items: { $ref: '#/components/schemas/SupplierInvoiceLine' }

    PaymentVoucher:
      type: object
      required: [branch_id, supplier_id, method_id, amount]
      description: سند پرداخت به تأمین‌کننده با تخصیص به فاکتورها (ماژول ۸)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid }
        doc_number: { type: string, readOnly: true }
        fiscal_year: { type: integer, readOnly: true }
        supplier_id: { type: string, format: uuid }
        payment_date: { type: string, format: date }
        method_id: { type: string, format: uuid, description: از `payment_method` }
        amount: { type: string }
        status: { type: string, readOnly: true, enum: [draft, posted, voided] }
        allocations:
          type: array
          items:
            type: object
            properties:
              supplier_invoice_id: { type: string, format: uuid }
              amount: { type: string }

    TreasuryPosition:
      type: object
      description: مانده صندوق/بانک و مغایرت (ماژول ۱۰)
      properties:
        bank_account_id: { type: [string, 'null'], format: uuid }
        title: { type: string }
        balance_book: { type: string, description: مانده دفتری }
        balance_actual: { type: [string, 'null'], description: مانده اعلامی/صورت‌حساب بانک }
        variance: { type: [string, 'null'], description: مغایرت باز برای رسیدگی }
        as_of: { type: string, format: date }

    TreasuryClose:
      type: object
      required: [branch_id, close_date]
      description: بستن روزانهٔ خزانه یک شعبه (ماژول ۱۰ — مهاجرت 0013)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid }
        close_date: { type: string, format: date }
        cash_expected: { type: string, description: نقد مورد انتظار صندوق }
        cash_counted: { type: string, description: نقد شمارش‌شده }
        bank_balance: { type: string, description: ماندهٔ بانک }
        cheque_in_hand_amount: { type: string, description: مبلغ چک‌های نزد صندوق }
        cash_variance: { type: string, readOnly: true, description: مغایرت صندوق = شمارش‌شده − مورد انتظار }
        status: { type: string, enum: [draft, closed, approved], readOnly: true }
        note: { type: [string, 'null'] }
        closed_by: { type: [string, 'null'], format: uuid, readOnly: true }
        approved_by: { type: [string, 'null'], format: uuid, readOnly: true }

    Cheque:
      type: object
      required: [direction, amount, due_date]
      description: چک دریافتی از مشتری یا صادری به تأمین‌کننده
      properties:
        id: { type: string, format: uuid, readOnly: true }
        direction: { type: string, enum: [received, issued] }
        person_id: { type: string, format: uuid, description: صادرکننده/گیرنده }
        bank_account_id: { type: [string, 'null'], format: uuid }
        amount: { type: string }
        cheque_number: { type: string }
        bank_name: { type: string }
        due_date: { type: string, format: date }
        status: { type: string, enum: [pending, cleared, bounced, returned] }
        cleared_at: { type: [string, 'null'], format: date-time }

    PaymentReceipt:
      type: object
      required: [customer_id, method_id, amount]
      description: رسید وصول با تخصیص به فاکتورها
      properties:
        id: { type: string, format: uuid, readOnly: true }
        doc_number: { type: string, readOnly: true }
        customer_id: { type: string, format: uuid }
        method_id: { type: string, format: uuid, description: از `payment_method` (نقد/کارت/چک/…) }
        amount: { type: string }
        paid_at: { type: string, format: date-time }
        pos_terminal_id: { type: [string, 'null'], format: uuid }
        reference: { type: [string, 'null'], description: شماره پیگیری/تراکنش }
        allocations:
          type: array
          items:
            type: object
            properties:
              invoice_id: { type: string, format: uuid }
              amount: { type: string }
        tour_id: { type: [string, 'null'], format: uuid, description: برای تسویه تور }

    GlAccount:
      type: object
      description: یک حساب در درخت کدینگ دفتر کل (ماژول ۹ — مهاجرت 0018)
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: کد سلسله‌مراتبی حساب (تا ۴ سطح) }
        parent_id: { type: [string, 'null'], format: uuid }
        level: { type: integer, minimum: 1, maximum: 4 }
        title: { type: string }
        nature: { type: string, enum: [debit, credit], description: ماهیت حساب }
        account_type: { type: string, enum: [asset, liability, equity, revenue, expense, contra] }
        is_postable: { type: boolean, description: فقط حساب‌های سطح ۴ قابل ثبت مستقیم‌اند }
        control_type:
          type: [string, 'null']
          enum: [ar, ap, inventory, cash, bank, tax, cheque_in_hand, cogs, none, null]
          description: نقش کنترلی حساب برای نگاشت خودکار رویدادها
        currency: { type: string }
        is_active: { type: boolean }

    FiscalPeriod:
      type: object
      description: دورهٔ مالی (معمولاً ماهانه) — سند فقط در دورهٔ «باز» ثبت می‌شود
      properties:
        id: { type: string, format: uuid }
        fiscal_year: { type: integer, description: سال مالی شمسی }
        period_no: { type: integer, minimum: 1, maximum: 12 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        status: { type: string, enum: [open, closed, locked] }
        closed_at: { type: [string, 'null'], format: date-time }

    FiscalPeriodCreate:
      type: object
      required: [fiscal_year, period_no, start_date, end_date]
      description: بدنهٔ ساخت یک دورهٔ مالی جدید (با وضعیت open)
      properties:
        fiscal_year: { type: integer }
        period_no: { type: integer, minimum: 1, maximum: 12 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }

    JournalLine:
      type: object
      description: یک سطر سند — دقیقاً یک سمت (بدهکار یا بستانکار) غیر صفر
      properties:
        id: { type: string, description: شناسهٔ بزرگ‌عدد (bigint) به‌صورت رشته }
        line_no: { type: integer, minimum: 1 }
        account_id: { type: string, format: uuid }
        account_code: { type: string }
        account_title: { type: string }
        description: { type: string }
        debit: { type: string }
        credit: { type: string }
        party_type: { type: [string, 'null'], enum: [customer, supplier, staff, null] }
        party_id: { type: [string, 'null'], format: uuid }
        dimensions:
          type: object
          additionalProperties: true
          description: ابعاد تحلیلی (مرکز هزینه، پروژه، …)

    JournalEntry:
      type: object
      description: سند حسابداری (هدر) — جمع بدهکار/بستانکار برای سند غیر draft برابر است
      properties:
        id: { type: string, format: uuid }
        branch_id: { type: [string, 'null'], format: uuid }
        doc_number: { type: string, readOnly: true, description: شمارهٔ سند (JV-سال-ترتیب) }
        fiscal_period_id: { type: string, format: uuid }
        entry_date: { type: string, format: date }
        description: { type: string }
        source_type:
          type: string
          enum: [invoice, credit_note, receipt, payment_voucher, goods_receipt, supplier_invoice, value_document, cash_txn, cheque, payroll, manual, opening, closing, recurring]
        source_id: { type: [string, 'null'], format: uuid, description: شناسهٔ سند مبدأ (برای manual تهی) }
        total_debit: { type: string }
        total_credit: { type: string }
        status: { type: string, enum: [draft, posted, voided] }
        reversal_of_id: { type: [string, 'null'], format: uuid }
        posted_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        lines:
          type: array
          description: سطرها — فقط در پاسخ جزئیات/ثبت سند حاضر است، نه در فهرست
          items: { $ref: '#/components/schemas/JournalLine' }

    JournalLineCreate:
      type: object
      required: [account_id, description]
      description: سطر درخواستی سند — باید دقیقاً یک سمت (debit یا credit) غیر صفر باشد
      properties:
        account_id: { type: string, format: uuid }
        description: { type: string }
        debit: { type: string, description: رشتهٔ اعشاری؛ سمت استفاده‌نشده را صفر/حذف بگذارید }
        credit: { type: string }
        party_type: { type: string, enum: [customer, supplier, staff] }
        party_id: { type: string, format: uuid }
        dimensions:
          type: object
          additionalProperties: true

    JournalEntryCreate:
      type: object
      required: [branch_id, entry_date, description, lines]
      description: بدنهٔ ثبت سند دستیِ متوازن (حداقل دو سطر)
      properties:
        branch_id: { type: string, format: uuid }
        entry_date: { type: string, format: date }
        description: { type: string }
        fiscal_period_id:
          type: string
          format: uuid
          description: در صورت نبود، دورهٔ «باز» شامل entry_date به‌طور خودکار انتخاب می‌شود
        lines:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/JournalLineCreate' }

    TrialBalanceRow:
      type: object
      description: یک ردیف تراز آزمایشی (جمع بدهکار/بستانکار و ماندهٔ هر حساب)
      properties:
        fiscal_year: { type: integer }
        period_no: { type: integer }
        account_code: { type: string }
        title: { type: string }
        level: { type: integer, minimum: 1, maximum: 4 }
        nature: { type: string, enum: [debit, credit] }
        debit_total: { type: string }
        credit_total: { type: string }
        balance: { type: string, description: مانده (بدهکار − بستانکار) }

    LocationSample:
      type: object
      required: [staff_id, at, geo]
      description: نمونه موقعیت اپ میدانی (دسته‌ای از صف آفلاین)
      properties:
        staff_id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        geo: { $ref: '#/components/schemas/GeoPoint' }
        accuracy_m: { type: number }
        speed_kmh: { type: number }
        is_mocked: { type: boolean, description: اپ خود تشخیص می‌دهد GPS جعلی است }

    LatestPosition:
      type: object
      description: آخرین موقعیت معتبر یک کارمند میدانی
      properties:
        staff_id: { type: string, format: uuid }
        staff_name: { type: string }
        tour_id: { type: [string, 'null'], format: uuid }
        at: { type: string, format: date-time }
        geo: { $ref: '#/components/schemas/GeoPoint' }
        accuracy_m: { type: number }

    RoutePlan:
      type: object
      description: طرح مسیر «یک‌کلیکی» با هندسه و آمار
      properties:
        id: { type: string, format: uuid, readOnly: true }
        tour_id: { type: [string, 'null'], format: uuid }
        staff_id: { type: string, format: uuid }
        plan_date: { type: string, format: date }
        provider: { type: string, enum: [neshan, mapir, osrm_selfhosted] }
        objective: { type: string, enum: [min_duration, min_distance] }
        stop_count: { type: integer }
        total_distance_m: { type: integer }
        total_duration_s: { type: integer }
        geometry: { oneOf: [{ $ref: '#/components/schemas/GeoLineString' }, { type: 'null' }] }
        stops:
          type: array
          description: ترتیب بهینه‌شده توقف‌ها
          items:
            type: object
            properties:
              sequence: { type: integer }
              customer_id: { type: string, format: uuid }

    Geofence:
      type: object
      required: [name, kind, area]
      description: محدوده جغرافیایی کار (چندضلعی)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        kind: { type: string, enum: [work_area, customer, warehouse, restricted], description: 'work_area حوزه کاری است (نام در DDL)' }
        area: { $ref: '#/components/schemas/GeoPolygon' }
        customer_id: { type: [string, 'null'], format: uuid }
        warehouse_id: { type: [string, 'null'], format: uuid }
        is_active: { type: boolean }

    Rule:
      type: object
      required: [code, title, entity, event, effect]
      description: قاعده موتور قوانین با پیام فارسی قابل نمایش
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string }
        title: { type: string }
        entity: { type: string, examples: ['sales_order', 'customer', 'product', 'return_request'] }
        event: { type: string, enum: [before_save, before_approve, after_save, on_schedule] }
        # اثر قاعده دقیقاً هم‌اندازهٔ DDL مهاجرت 0009 (check روی ستون effect)
        effect: { type: string, enum: [block, warn, require_approval, set_field, notify] }
        priority: { type: integer }
        message_fa: { type: string }
        # شرایط به‌صورت فهرست گروه‌بندی‌شده ذخیره می‌شود (AND داخل گروه، OR بین گروه‌ها)
        conditions:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              group_no: { type: [integer, 'null'] }
              field: { type: string }
              operator: { type: string }
              value: {}
          description: شرط اجرای قاعده
        actions:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              action_type: { type: string }
              params: { type: object, additionalProperties: true }
          description: اقدامات قاعده (تخفیف/جایزه/تأیید و…)
        valid_from: { type: [string, 'null'], format: date }
        valid_to: { type: [string, 'null'], format: date }
        is_active: { type: boolean }

    ApprovalSubmission:
      type: object
      required: [approval_request_id, current_step, stages]
      description: |
        TASK-24Z — پاسخِ ارسال به گردشِ تأیید. `approval_request_id` را برای ثبتِ
        تصمیم در `POST /rules-engine/approvals/{id}/decision` و بررسی در کارتابل
        به کار ببرید. `stages` شمارِ مراحلِ ترکیب‌شدهٔ همهٔ سیاست‌های منطبق است.
      properties:
        approval_request_id: { type: string, format: uuid }
        current_step: { type: integer, minimum: 1 }
        stages: { type: integer, minimum: 1 }
        expires_at: { type: [string, 'null'], format: date-time }
    ApprovalRequest:
      type: object
      description: درخواست تأیید مبلغ‌محور (زنجیره تأیید — ماژول ۳ §۳.۳)
      properties:
        policy_snapshot:
          type: [object, 'null']
          description: ورودی سیاست‌های ترکیب هنگام ایجاد؛ برای سابقه‌های قدیمی بازسازی نمی‌شود
          properties:
            version: { type: integer }
            policies:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  scope: { type: string }
                  approval_chain_id: { type: string, format: uuid }
                  min_amount: { type: [string, number, 'null'] }
                  max_amount: { type: [string, number, 'null'] }
                  min_risk_score: { type: [integer, 'null'] }
                  expires_in_hours: { type: [integer, 'null'] }
            source_chains:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        approver_staff_id: { type: [string, 'null'], format: uuid }
                        approver_role_id: { type: [string, 'null'], format: uuid }
                        min_amount: { type: [string, number, 'null'] }
                        max_amount: { type: [string, number, 'null'] }
                        is_mandatory: { type: boolean }
        policy_id: { type: [string, 'null'], format: uuid, description: شناسه سیاست حاکم هنگام ایجاد؛ نه فهرست کامل منابع ترکیب }
        expires_at: { type: [string, 'null'], format: date-time }
        binding:
          type: [object, 'null']
          properties:
            operation: { type: string }
            consumed_at: { type: [string, 'null'], format: date-time }
            superseded_at: { type: [string, 'null'], format: date-time }
        snapshot_steps:
          type: array
          description: مراحل ذخیره‌شده درخواست؛ نه پیکربندی جاری سیاست
          items:
            type: object
            properties:
              step_no: { type: integer }
              approver_staff_id: { type: [string, 'null'], format: uuid }
              approver_role_id: { type: [string, 'null'], format: uuid }
              min_amount: { type: [string, number, 'null'] }
              max_amount: { type: [string, number, 'null'] }
              is_mandatory: { type: boolean }
        id: { type: string, format: uuid, readOnly: true }
        approval_chain_id: { type: [string, 'null'], format: uuid }
        entity_type: { type: string, examples: ['sales_order', 'return_request', 'stock_adjustment'] }
        entity_id: { type: string, format: uuid }
        amount: { type: [string, 'null'] }
        status: { type: string, enum: [pending, approved, rejected, expired, cancelled] }
        current_step: { type: integer }
        requested_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        # تصمیم‌های ثبت‌شده تاکنون (یک ردیف به‌ازای هر مرحله)
        decisions:
          type: array
          items:
            type: object
            properties:
              step_no: { type: integer }
              meta:
                type: [object, 'null']
                properties:
                  delegated_from: { type: string, format: uuid }
              decided_by: { type: [string, 'null'], format: uuid }
              decision: { type: [string, 'null'], enum: [approved, rejected, returned, null] }
              decided_at: { type: [string, 'null'], format: date-time }
              comment: { type: [string, 'null'] }
        steps:
          type: array
          items:
            type: object
            properties:
              step_no: { type: integer }
              approver_role: { type: string }
              decision: { type: [string, 'null'], enum: [approve, reject, null] }
              decided_at: { type: [string, 'null'], format: date-time }
              note: { type: string }

    # ---- TASK-24Y: سیاست، تفکیل، اعلان ----
    ApprovalPolicy:
      type: object
      description: |
        سیاست تأیید. تقدم `central` بر `domain` **ساختاری** است، نه عددی: یک
        آستانه مبلغ بزرگ در سیاست قلمرو نمی‌تواند سیاست مرکزی را کنار بزند.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        company_id: { type: string, format: uuid, readOnly: true }
        operation:
          type: string
          description: عملیات محافظت‌شده، مثلاً `sales.order.approve`
          examples: ['sales.order.approve', 'pricing.margin_exception']
        scope: { type: string, enum: [central, domain, operation] }
        domain_id: { type: [string, 'null'], format: uuid }
        min_amount: { type: [string, 'null'], description: حداقل مبلغ (شامل) }
        max_amount: { type: [string, 'null'], description: حداکثر مبلغ (شامل) }
        min_risk_score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        approval_chain_id: { type: string, format: uuid }
        expires_in_hours: { type: [integer, 'null'], minimum: 1 }
        on_expiry: { type: string, enum: [escalate, auto_reject], default: escalate }
        priority: { type: integer, default: 100 }
        is_active: { type: boolean, readOnly: true }

    CreateApprovalPolicy:
      type: object
      required: [operation, scope, approval_chain_id]
      properties:
        operation: { type: string, maxLength: 120 }
        scope: { type: string, enum: [central, domain, operation] }
        domain_id: { type: [string, 'null'], format: uuid }
        min_amount: { type: [number, 'null'], minimum: 0 }
        max_amount: { type: [number, 'null'], minimum: 0 }
        min_risk_score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        approval_chain_id: { type: string, format: uuid }
        expires_in_hours: { type: [integer, 'null'], minimum: 1 }
        on_expiry: { type: string, enum: [escalate, auto_reject] }
        priority: { type: integer, minimum: 1, maximum: 9999 }

    ApprovalDelegation:
      type: object
      description: تفکیل تأیید با دامنه و انقضای صریح؛ تفکیل منقضی هرگز اثر ندارد.
      properties:
        id: { type: string, format: uuid }
        delegator_id: { type: string, format: uuid }
        delegate_id: { type: string, format: uuid }
        operation: { type: [string, 'null'] }
        domain_id: { type: [string, 'null'], format: uuid }
        valid_from: { type: string, format: date-time }
        valid_to: { type: string, format: date-time }
        reason: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    CreateApprovalDelegation:
      type: object
      required: [delegate_id, valid_to, reason]
      properties:
        delegate_id: { type: string, format: uuid }
        operation: { type: [string, 'null'], maxLength: 120 }
        domain_id: { type: [string, 'null'], format: uuid }
        valid_from: { type: [string, 'null'], format: date-time }
        valid_to: { type: string, format: date-time }
        reason: { type: string, maxLength: 500 }

    ApprovalNotification:
      type: object
      description: اعلان تأیید (جعبه خروجی تراکنشی — در همان تراکنش تغییر وضعیت نوشته می‌شود)
      properties:
        id: { type: string, format: uuid }
        approval_request_id: { type: [string, 'null'], format: uuid }
        kind: { type: string, enum: [assigned, reminder, escalated, expired, decided, cancelled] }
        payload: { type: object, additionalProperties: true }
        status: { type: string, enum: [pending, sent, failed, skipped] }
        created_at: { type: string, format: date-time }
        sent_at: { type: [string, 'null'], format: date-time }

    ReportDescriptor:
      type: object
      description: شناسنامه یک گزارش مجاز (ضمیمه C)
      properties:
        key: { type: string, examples: ['ar_aging', 'tour_settlement', 'sales_by_route'] }
        title: { type: string }
        module: { type: string }
        required_permission: { type: string }

    BiKpi:
      type: object
      description: شاخص‌های کلانِ داشبورد BI برای شرکتِ نشست
      required:
        [period_days, sales, collected, gross, ar_balance, ar_overdue, open_invoice_count, active_customer_count]
      properties:
        period_days: { type: integer, description: بازهٔ روزهایِ فروش/وصولی }
        sales: { type: string, description: خالصِ فروشِ بازه (decimal، از mv_daily_sales.net_sales) }
        collected: { type: string, description: وصولیِ بازه (decimal) }
        gross: { type: string, description: ناخالصِ فروشِ بازه (decimal) }
        ar_balance: { type: string, description: کلِ ماندهٔ دریافتنیِ باز (decimal، از mv_ar_aging.total_due) }
        ar_overdue: { type: string, description: ماندهٔ سررسیدگذشته (decimal) }
        open_invoice_count: { type: integer, description: تعداد فاکتورهای باز }
        active_customer_count: { type: integer, description: تعداد مشتریان با ماندهٔ باز }
        collection_rate:
          type: [number, 'null']
          format: float
          description: نسبتِ وصول به فروشِ بازه (۰..۱)؛ null اگر فروشی نبوده
    AbcEntry:
      type: object
      description: یک قلمِ طبقه‌بندی‌شده در تحلیل ABC
      required: [id, code, name, revenue, share_pct, cumulative_pct, class]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        revenue: { type: string, description: درآمد (decimal) }
        qty: { type: string, description: مقدارِ فروش (decimal) — فقط در ABC کالاها }
        share_pct: { type: number, format: float, description: سهم از کلِ درآمد (٪) }
        cumulative_pct: { type: number, format: float, description: مجموعِ تجمعی تا این قلم (٪) }
        class: { type: string, enum: [A, B, C] }
    AbcResult:
      type: object
      required: [items, thresholds, total_revenue]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AbcEntry' }
        thresholds:
          type: object
          required: [a, b]
          properties:
            a: { type: number, description: آستانهٔ درصدیِ کلاسِ A }
            b: { type: number, description: آستانهٔ درصدیِ کلاسِ B }
        total_revenue: { type: string, description: کلِ درآمد (decimal) }
    BillingInvoice:
      type: object
      description: صورتحسابِ دوره‌ایِ اشتراک (ledger) — بدونِ پرداخت؛ وضعیت issued/void
      required: [id, invoice_no, period_start, period_end, amount, currency, status, notes, issued_at]
      properties:
        id: { type: string, format: uuid }
        invoice_no: { type: string }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        amount: { type: string, description: decimal string }
        currency: { type: string }
