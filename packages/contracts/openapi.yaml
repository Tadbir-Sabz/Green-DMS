        اثرانگشت بسته، هیچ تأییدکننده یا اجرای معتبری وجود ندارد.
      required: [status, reason_code, message_fa, operation, mechanism, fingerprint_supported, required_dependency_fa, initiator_user_id, approver_user_id, approved_at, approved_package_sha256, approved_mapping_sha256, approved_preview_sha256, current_package_sha256, current_mapping_sha256, current_preview_sha256, approval_invalidated, self_approval_forbidden]
