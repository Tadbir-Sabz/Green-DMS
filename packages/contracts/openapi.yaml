    get:
      tags: [ap]
      summary: جزئیات یک رسید انبار با اقلام
      responses:
        '200':
          description: رسید انبار
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoodsReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /goods-receipts/{id}/post:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    post:
      tags: [ap]
      summary: ثبت قطعی رسید انبار و اعمال اثر انبار و ارزش‌گذاری (draft → posted)
      responses:
        '200':
          description: رسید انبار ثبت قطعی شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoodsReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /valuation:
    get:
      tags: [valuation]
      summary: ارزش موجودی (میانگین متحرک) به ازای انبار/کالا
      parameters:
        - { name: warehouse_id, in: query, schema: { type: string, format: uuid } }
        - { name: product_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: ارزش موجودی
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Valuation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------- خزانه، چک، وصول ----------------
  /treasury:
    get:
      tags: [treasury]
      summary: مانده صندوق و بانک‌ها + مغایرت‌گیری (روزانه/دوره‌ای)
      parameters:
        - { name: as_of, in: query, schema: { type: string, format: date } }
        - { name: bank_account_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: موقعیت خزانه
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TreasuryPosition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /treasury/closes:
    get:
      tags: [treasury]
      summary: فهرست بستن‌های روزانهٔ خزانه شعبه‌ها
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
        - { name: branch_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [draft, closed, approved] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: صفحه‌ای از بستن‌های روزانه
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/TreasuryClose' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [treasury]
      summary: ثبت و بستن روزانهٔ خزانه یک شعبه
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreasuryClose' }
      responses:
        '201':
          description: بستن روزانه ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreasuryClose' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /treasury/closes/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [treasury]
      summary: جزئیات یک بستن روزانهٔ خزانه
      responses:
        '200':
          description: بستن روزانه
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreasuryClose' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /treasury/closes/{id}/approve:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    post:
      tags: [treasury]
      summary: تأیید بستن روزانهٔ خزانه (closed → approved)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: بستن روزانه تأیید شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreasuryClose' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cheques:
    get:
      tags: [cheques]
      summary: فهرست چک‌های دریافتی/پرداختی و سررسیدها
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
        - { name: direction, in: query, schema: { type: string, enum: [received, issued] } }
        - { name: status, in: query, schema: { type: string, enum: [pending, cleared, bounced, returned] } }
        - { name: due_from, in: query, schema: { type: string, format: date } }
        - { name: due_to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: صفحه‌ای از چک‌ها
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Cheque' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [cheques]
      summary: ثبت چک (دریافت از مشتری یا صدور برای تأمین‌کننده)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Cheque' }
      responses:
        '201':
          description: چک ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cheque' }
  /cheques/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [cheques]
      summary: جزئیات چک
      responses:
        '200':
          description: چک
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cheque' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [cheques]
      summary: تعیین تکلیف چک (وصول/برگشت/واگذاری به بانک)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Cheque' }
      responses:
        '200':
          description: چک به‌روزرسانی شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cheque' }
  /payments:
    get:
      tags: [payments]
      summary: فهرست رسیدهای وصول (نقد/کارت/آنلاین/چک)
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: kind, in: query, schema: { type: string } }
      responses:
        '200':
          description: صفحه‌ای از رسیدها
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/PaymentReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [payments]
      summary: ثبت وصول و تخصیص به فاکتورها
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentReceipt' }
      responses:
        '201':
          description: رسید ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentReceipt' }
        '422': { $ref: '#/components/responses/RuleRejected' }
  /payments/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [payments]
      summary: جزئیات رسید با تخصیص‌ها
      responses:
        '200':
          description: رسید
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentReceipt' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- دفتر کل (GL) ----------------
  /gl/accounts:
    get:
      tags: [gl]
      summary: درخت کدینگ حساب‌های دفتر کل (۴ سطح)
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
        - { name: nature, in: query, schema: { type: string, enum: [debit, credit] } }
        - { name: account_type, in: query, schema: { type: string, enum: [asset, liability, equity, revenue, expense, contra] } }
      responses:
        '200':
          description: صفحه‌ای از حساب‌ها به ترتیب کد
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/GlAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /gl/periods:
    get:
      tags: [gl]
      summary: دوره‌های مالی (باز/بسته/قفل)
      parameters:
        - { name: fiscal_year, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [open, closed, locked] } }
      responses:
        '200':
          description: فهرست دوره‌ها (جدیدترین ابتدا)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FiscalPeriod' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [gl]
      summary: ساخت/بازکردن یک دورهٔ مالی
      description: |
        دوره با وضعیت `open` ساخته می‌شود؛ `(fiscal_year, period_no)` باید یکتا باشد
        و `end_date ≥ start_date`. در غیر این صورت `409`/`400` با پیام فارسی.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FiscalPeriodCreate' }
      responses:
        '201':
          description: دوره ساخته شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FiscalPeriod' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /gl/periods/{id}/close:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    post:
      tags: [gl]
      summary: بستن دورهٔ مالی (پس از آن سند جدید در این دوره رد می‌شود)
      responses:
        '200':
          description: دوره بسته شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FiscalPeriod' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /gl/journals:
    get:
      tags: [gl]
      summary: فهرست اسناد حسابداری
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
        - { name: status, in: query, schema: { type: string, enum: [draft, posted, voided] } }
        - { name: source_type, in: query, schema: { type: string, enum: [invoice, credit_note, receipt, payment_voucher, goods_receipt, supplier_invoice, value_document, cash_txn, cheque, payroll, manual, opening, closing, recurring] } }
        - { name: fiscal_period_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: صفحه‌ای از اسناد به ترتیب شماره سند
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/JournalEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [gl]
      summary: ثبت و صدور سند دستیِ متوازن
      description: |
        سند با وضعیت `posted` ثبت می‌شود. جمع بدهکار/بستانکار سطرها باید برابر باشد
        (`fn_journal_balanced`)، هر سطر دقیقاً یک سمت غیر صفر داشته باشد
        (`ck_journal_line_one_side`) و تاریخ سند داخل یک دورهٔ مالی «باز» قرار گیرد
        (`fn_check_journal_period`). نقض هر یک → `422` با پیام فارسی.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalEntryCreate' }
      responses:
        '201':
          description: سند ثبت و صادر شد (با سطرها)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RuleRejected' }
  /gl/journals/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [gl]
      summary: جزئیات سند با سطرها
      responses:
        '200':
          description: سند حسابداری
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /gl/trial-balance:
    get:
      tags: [gl]
      summary: تراز آزمایشی از نمای v_trial_balance (فقط اسناد صادرشده)
      parameters:
        - { name: fiscal_year, in: query, schema: { type: integer } }
        - { name: period_no, in: query, schema: { type: integer, minimum: 1, maximum: 12 } }
      responses:
        '200':
          description: ردیف‌های تراز آزمایشی به ترتیب کد حساب
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TrialBalanceRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------- رهگیری و مسیریابی ----------------
  /tracking/locations:
    get:
      tags: [tracking]
      summary: موقعیت‌های زنده کارکنان میدانی برای نقشه رهگیری
      parameters:
        - { name: staff_id, in: query, schema: { type: string, format: uuid } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: آخرین موقعیت هر کارمند میدانی
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LatestPosition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tracking]
      summary: ارسال نمونه موقعیت از اپ فروشنده/موزع (batch)
      description: |
        اپ موقعیت‌ها را در صف آفلاین نگه می‌دارد و دسته‌ای می‌فرستد؛ سرور
        `is_mocked` و `accuracy_m` را ثبت و با رویداد زنده `location.update`
        به نقشه مدیریت پخش می‌کند.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [samples]
              properties:
                samples:
                  type: array
                  items: { $ref: '#/components/schemas/LocationSample' }
      responses:
        '202':
          description: نمونه‌ها پذیرفته شدند
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /tracking/routes:
    get:
      tags: [tracking]
      summary: طرح‌های مسیر محاسبه‌شده
      parameters:
        - { name: staff_id, in: query, schema: { type: string, format: uuid } }
        - { name: plan_date, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: فهرست طرح‌های مسیر
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RoutePlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tracking]
      summary: محاسبه «بهترین مسیر‌بندی با یک کلیک» برای اپ فروشنده/موزع
      description: |
        مشتریان مسیر (یا ایستگاه‌های انتخاب‌شده) می‌آیند؛ سرور با ارائه‌دهنده
        مسیریابی (نشان/map.ir یا OSRM داخلی) بهترین ترتیب و هندسه را برمی‌گرداند
        و طرح برای استفاده بعدی ذخیره می‌شود (ماژول ۶ §۶.۳).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_ids]
              properties:
                plan_date: { type: string, format: date }
                customer_ids:
                  type: array
                  items: { type: string, format: uuid }
                provider: { type: string, enum: [neshan, mapir, osrm_selfhosted] }
                objective: { type: string, enum: [min_duration, min_distance] }
      responses:
        '200':
          description: طرح مسیر محاسبه شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutePlan' }
        '422': { $ref: '#/components/responses/RuleRejected' }
  /geofences:
    get:
      tags: [geofences]
      summary: فهرست محدوده‌های جغرافیایی کار
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
        - { name: is_active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: صفحه‌ای از محدوده‌ها
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Geofence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [geofences]
      summary: تعریف محدوده (چندضلعی) برای حوزه/مشتری/انبار
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Geofence' }
      responses:
        '201':
          description: محدوده ساخته شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Geofence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /geofences/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [geofences]
      summary: جزئیات محدوده
      responses:
        '200':
          description: محدوده
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Geofence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [geofences]
      summary: ویرایش محدوده (ویرایش polygon در نقشه)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateGeofence' }
      responses:
        '200':
          description: محدوده به‌روزرسانی شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Geofence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [geofences]
      summary: حذف محدوده
      responses:
        '204': { description: محدوده حذف شد }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- موتور قوانین و تأییدها ----------------
  /rules:
    get:
      tags: [rules]
      summary: فهرست قوانین و کنترل‌ها
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
        - { name: entity, in: query, schema: { type: string } }
        - { name: event, in: query, schema: { type: string } }
        - { name: is_active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: صفحه‌ای از قوانین
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Rule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [rules]
      summary: تعریف قاعده (اثر مسدود/هشدار + پیام فارسی)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Rule' }
      responses:
        '201':
          description: قاعده ساخته شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
  /rules/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [rules]
      summary: جزئیات قاعده
      responses:
        '200':
          description: قاعده
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [rules]
      summary: به‌روزرسانی قاعده
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Rule' }
      responses:
        '200':
          description: قاعده به‌روزرسانی شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /approvals:
    get:
      tags: [approvals]
      summary: صف تأیید کاربر جاری (سفارش/مرجوعی/اصلاحیه مبلغ‌محور)
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
        - { name: entity_type, in: query, schema: { type: string } }
      responses:
        '200':
          description: صفحه‌ای از آیتم‌های در انتظار تأیید
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ApprovalRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /approvals/{id}/decision:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    post:
      tags: [approvals]
      summary: تصمیم تأییدکننده (تأیید/رد با توضیح)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                note: { type: string }
      responses:
        '200':
          description: تصمیم ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------- گزارش‌ها، تنظیمات، یکپارچه‌سازی ----------------
  /reports:
    get:
      tags: [reports]
      summary: فهرست گزارش‌های مجاز کاربر (ضمیمه C)
      responses:
        '200':
          description: فهرست گزارش‌ها
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReportDescriptor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /reports/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    get:
      tags: [reports]
      summary: اجرای گزارش با پارامترهای فیلتر
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv, xlsx], default: json } }
      responses:
        '200':
          description: نتیجه گزارش
          content:
            application/json:
              schema:
                type: object
                properties:
                  columns:
                    type: array
                    items: { type: object, properties: { key: { type: string }, title: { type: string } } }
                  rows:
                    type: array
                    items: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /settings:
    get:
      tags: [settings]
      summary: تنظیمات مؤثر (عمومی + تفکیکی هر حوزه/شعبه)
      parameters:
        - { name: scope_type, in: query, schema: { type: string, enum: [global, company, branch, area] } }
        - { name: scope_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: کلید/مقدارهای تنظیم
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SettingEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [settings]
      summary: به‌روزرسانی تنظیمات (حوزه‌ها فقط برای خودشان)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/SettingEntry' }
      responses:
        '200':
          description: تنظیمات به‌روزرسانی شد
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SettingEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /attachments:
    get:
      tags: [attachments]
      summary: فهرستِ ضمیمه‌های یک موجودیت (owner) در دامنهٔ شرکتِ نشست
      parameters:
        - name: owner_type
          in: query
          required: true
          schema:
            type: string
            enum: [pod, invoice, journal_entry, receipt, return_request, sales_order, product, stock_count, other]
        - name: owner_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: ضمیمه‌های موجودیت (هر مورد با URL امضاشدهٔ کوتاه‌عمر)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [attachments]
      summary: بارگذاری ضمیمه / مدرک تحویل (POD) — multipart/form-data
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, owner_type, owner_id]
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    بایت‌های فایل. انواع مجاز: image/jpeg، image/png، image/webp،
                    application/pdf؛ سقف حجم پیش‌فرض ۸ مگابایت.
                owner_type:
                  type: string
                  enum: [pod, invoice, journal_entry, receipt, return_request, sales_order, product, stock_count, other]
                  description: نوعِ موجودیتِ مالکِ ضمیمه
                owner_id:
                  type: string
                  format: uuid
                  description: شناسهٔ موجودیتِ مالک (مثلاً شناسهٔ delivery برای POD)
      responses:
        '201':
          description: فایل در آبجکت‌استوریج ذخیره و metadata ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: حجم فایل بیش از حدِ مجاز است
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: نوع فایل مجاز نیست
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /attachments/{id}/url:
    get:
      tags: [attachments]
      summary: دریافت URL امضاشدهٔ کوتاه‌عمر برای دانلود ضمیمه
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: URL امضاشدهٔ دانلود (بدون bucket عمومی)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bi/kpi:
    get:
      tags: [bi]
      summary: شاخص‌های کلانِ فروش/وصولی/ماندهٔ AR (داشبورد BI)
      parameters:
        - name: days
          in: query
          description: بازهٔ روزهای اخیر برای فروش/وصولی (پیش‌فرض ۳۰)
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        '200':
          description: KPIهای شرکتِ نشست
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BiKpi' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /bi/abc-customers:
    get:
      tags: [bi]
      summary: طبقه‌بندی ABC مشتریان بر پایهٔ درآمد (قانونِ پارتو)
      responses:
        '200':
          description: فهرستِ طبقه‌بندی‌شدهٔ مشتریان
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AbcResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /bi/abc-products:
    get:
      tags: [bi]
      summary: طبقه‌بندی ABC کالاها بر پایهٔ درآمد (قانونِ پارتو)
      responses:
        '200':
          description: فهرستِ طبقه‌بندی‌شدهٔ کالاها
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AbcResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /bi/forecast:
    get:
      tags: [bi]
      summary: پیش‌بینیِ فروشِ روزانه (هموارسازیِ خطیِ هالت رویِ سابقهٔ فروش)
      parameters:
        - name: days
          in: query
          description: طولِ سابقهٔ روزهایِ گذشته برای برازش (پیش‌فرض ۹۰، ۱..۳۶۵)
          schema: { type: integer, minimum: 1, maximum: 365, default: 90 }
        - name: horizon
          in: query
          description: تعدادِ روزهایِ آینده برای پیش‌بینی (پیش‌فرض ۷، ۱..۹۰)
          schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
      responses:
        '200':
          description: نقاطِ پیش‌بینیِ فروشِ خالصِ روزانه به‌همراه روند
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BiForecast' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /billing/invoices:
    get:
      tags: [billing]
      summary: فهرستِ صورتحساب‌های اشتراکِ اجاره (ledger، بدونِ پرداخت)
      responses:
        '200':
          description: فهرستِ صورتحساب‌ها (نزولیِ تاریخِ صدور)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BillingInvoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /billing/invoices/{id}:
    get:
      tags: [billing]
      summary: جزئیاتِ یک صورتحسابِ اشتراک
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: صورتحسابِ اشتراک
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingInvoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /onboarding/register:
    post:
      tags: [onboarding]
      summary: خودخدمت‌دهیِ ثبتِ اجارهٔ جدید (شرکت + شعبه + نقش‌ها + حسابِ مدیر)
      description: >-
        عمومی و بدونِ نشست. در تولید باید پشتِ نرخ‌گذاری/CAPTCHA/کدِ دعوت قرار گیرد
        (یادداشتِ امنیتی در گزارشِ تحویل). ساختِ اجاره اتمی است (یا همه یا هیچ).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_code, company_name, admin_email, admin_password]
              properties:
                company_code: { type: string, minLength: 2, maxLength: 32, pattern: '^[A-Za-z0-9_-]+$' }
                company_name: { type: string, minLength: 2, maxLength: 160 }
                admin_email: { type: string, format: email, maxLength: 160 }
                admin_password: { type: string, format: password, minLength: 8, maxLength: 128 }
                admin_first_name: { type: string, maxLength: 60 }
                admin_last_name: { type: string, maxLength: 60 }
      responses:
        '201':
          description: اجاره و حسابِ مدیر ساخته شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterTenantResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /portal/auth/login:
    post:
      tags: [portal]
      summary: ورود به پورتال مشتری (ایمیل + رمز) — توکن با audience مجزا از کارکنان
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8, maxLength: 128 }
      responses:
        '200':
          description: نشستِ پورتال صادر شد (توکن دسترسی + refresh)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423': { $ref: '#/components/responses/Locked' }
  /portal/auth/refresh:
    post:
      tags: [portal]
      summary: تازه‌سازیِ توکن پورتال (چرخش refresh)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: نشستِ تازه صادر شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /portal/auth/logout:
    post:
      tags: [portal]
      summary: خروج از پورتال (باطل‌کردن نشستِ جاری)
      responses:
        '200':
          description: نشست باطل شد
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /portal/me:
    get:
      tags: [portal]
      summary: حسابِ پورتال و مشتریِ وابستهٔ جاری
      responses:
        '200':
          description: شناسهٔ حسابِ پورتال + کد/نام مشتری
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalMe' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /portal/invoices:
    get:
      tags: [portal]
      summary: فاکتورهای ثبت‌شدهٔ مشتریِ پورتال
      responses:
        '200':
          description: فهرستِ فاکتورها (نزولیِ تاریخ)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PortalInvoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /portal/orders:
    get:
      tags: [portal]
      summary: سفارش‌های مشتریِ پورتال (غیرِ پیش‌نویس)
      responses:
        '200':
          description: فهرستِ سفارش‌ها (نزولیِ تاریخ)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PortalOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /portal/balance:
    get:
      tags: [portal]
      summary: ماندهٔ حساب و وضعیتِ اعتبارِ مشتریِ پورتال
      responses:
        '200':
          description: ماندهٔ دریافتنی، معوق، سقف و اعتبارِ باقی‌مانده
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalBalance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /portal/users:
    post:
      tags: [portal]
      summary: ساختِ حسابِ پورتال برای یک مشتری (توسطِ کارکنان، master.customer.update)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, email, password]
              properties:
                customer_id: { type: string, format: uuid }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8, maxLength: 128 }
                display_name: { type: [string, 'null'], maxLength: 120 }
      responses:
        '201':
          description: حسابِ پورتال ساخته شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalIdentity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /routing/optimize:
    post:
      tags: [routing]
      summary: بهینه‌سازی مسیر ویزیت (TSP) — ترتیبِ بهینهٔ توقف‌ها با کمینه مسافت
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                route_id:
                  type: string
                  format: uuid
                  description: بهینه‌سازیِ همهٔ مشتریانِ یک مسیرِ ویزیت
                customer_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: فهرستِ صریحِ توقف‌ها (اگر route_id داده نشود)
                start_lat: { type: number, format: double, minimum: -90, maximum: 90, description: عرضِ جغرافیاییِ دپو/نقطهٔ شروع }
                start_lng: { type: number, format: double, minimum: -180, maximum: 180, description: طولِ جغرافیاییِ دپو/نقطهٔ شروع }
                avg_speed_kmh: { type: number, format: double, minimum: 1, maximum: 150, description: سرعت متوسط (پیش‌فرض ۳۰) }
                service_min_per_stop: { type: number, format: double, minimum: 0, maximum: 240, description: زمان خدمت در هر توقف به دقیقه (پیش‌فرض ۵) }
      responses:
        '200':
          description: مسیرِ بهینه‌شده با ترتیبِ توقف‌ها و برآورد مسافت/زمان
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutingOptimization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /integrations:
    get:
      tags: [integrations]
      summary: وضعیت یکپارچه‌سازی‌ها (مؤدیان، پوز، پیامک، درگاه)
      responses:
        '200':
          description: وضعیت سرویس‌های بیرونی
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/IntegrationStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /integrations/{key}/test:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string, enum: [moadian, pos, sms, gateway] } }
    post:
      tags: [integrations]
      summary: آزمون اتصال سرویس بیرونی (فقط ادمین)
      responses:
        '200':
          description: نتیجه آزمون
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationStatus' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------- جزئیات یکپارچه‌سازی مؤدیان و درگاه (ضمیمه D) ----------------
  /integrations/moadian/invoice:
    post:
      tags: [integrations]
      summary: ثبت فاکتور در صف پایدار ارسال به سامانه مؤدیان
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoice_id]
              properties:
                invoice_id: { type: string, format: uuid }
      responses:
        '200':
          description: شغل در صف ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueJobReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /integrations/moadian/status:
    get:
      tags: [integrations]
      summary: وضعیت صف ارسال مؤدیان
      responses:
        '200':
          description: فهرست شغل‌های مؤدیان
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MoadianJob' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /integrations/psp/pay:
    post:
      tags: [integrations]
      summary: ثبت تراکنش کارت/درگاه در صف پرداخت
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PspCharge' }
      responses:
        '200':
          description: شغل پرداخت در صف ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueJobReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /integrations/psp/reconcile:
    get:
      tags: [integrations]
      summary: مغایرت‌گیری صف پرداخت (شمارش تراکنش‌های در انتظار)
      responses:
        '200':
          description: نتیجه مغایرت‌گیری
          content:
            application/json:
              schema:
                type: object
                properties:
                  reconciled: { type: integer }
                  pending: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /integrations/psp/webhook:
    post:
      tags: [integrations]
      summary: وب‌هوک درگاه پرداخت — با امضای HMAC (هدر x-psp-signature)، بدون نشست
      description: اعتبارسنجی امضا جای AuthGuard است؛ بدون PSP_WEBHOOK_SECRET هیچ رویدادی پذیرفته نمی‌شود (503).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PspWebhookEvent' }
      responses:
        '200':
          description: رویداد پذیرفته و اعمال شد
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  received: { type: boolean }
                  applied: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: کلید امضای وب‌هوک پیکربندی نشده است
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

