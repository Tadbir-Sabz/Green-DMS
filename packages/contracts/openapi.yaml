        '409': { $ref: '#/components/responses/Conflict' }
  /invoices/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [invoices]
      summary: جزئیات فاکتور با اقلام و وضعیت ارسال مالیاتی
      responses:
        '200':
          description: فاکتور
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- مرجوعی ----------------
  /returns:
    get:
      tags: [returns]
      summary: فهرست درخواست‌های مرجوعی
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [draft, submitted, approved, partially_approved, rejected, posted, closed] } }
      responses:
        '200':
          description: صفحه‌ای از مرجوعی‌ها
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ReturnRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [returns]
      summary: ثبت درخواست مرجوعی توسط فروشنده/مشتری
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnRequest' }
      responses:
        '201':
          description: درخواست مرجوعی ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /returns/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [returns]
      summary: جزئیات مرجوعی با اقلام و تعیین تکلیف کالا
      responses:
        '200':
          description: مرجوعی
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /returns/{id}/approve:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    post:
      tags: [returns]
      summary: تأیید مرجوعی (توسط مدیر/سرپرست طبق زنجیره تأیید)
      responses:
        '200':
          description: مرجوعی تأیید شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /returns/{id}/receive:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    post:
      tags: [returns]
      summary: ثبت نهایی مرجوعی (تحویل کالا به انبار + تعیین تکلیف)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  items:
                    type: object
                    required: [product_id, qty, disposition]
                    properties:
                      product_id: { type: string, format: uuid }
                      qty: { type: number }
                      disposition:
                        type: string
                        enum: [restock, damaged, scrap, return_to_supplier]
                        description: تعیین تکلیف کالا (ماژول ۴ §۴.۷)
      responses:
        '200':
          description: مرجوعی نهایی شد (بستانکاری مشتری ثبت شد)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------- پیگیری توزیع و تحویل ----------------
  /deliveries:
    get:
