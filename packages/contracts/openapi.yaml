  /pricing/settings:
    get:
      tags: [pricing]
      summary: سیاست پایدار قیمت‌گذاری شرکت
      description: |
        سقف کل تخفیف، سقف پیش‌فرض تخفیف قلم، اعمال خودکار تشویق روی سفارش، اجازه فروش
        زیر بهای تمام‌شده و حداکثر عقب‌گرد تاریخ سفارش. مقدار مؤثر سفارش و شبیه‌سازی
        از همین سیاست می‌آید (TASK-24F · HIGH-2).
      responses:
        '200':
          description: سیاست مؤثر (در نبود ردیف، پیش‌فرض‌های fail-closed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [pricing]
      summary: به‌روزرسانی سیاست قیمت‌گذاری (نیازمند pricing.settings.update)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PricingSettingsUpdate' }
      responses:
        '200':
          description: سیاست مؤثر پس از به‌روزرسانی
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /pricing/simulate:
    post:
      tags: [pricing]
      summary: شبیه‌سازی کامل تجاری + ثبت ردیف ممیزی (بدون سند کسب‌وکار)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceQuoteRequest' }
      responses:
        '201':
          description: نتیجه شبیه‌سازی همراه با شناسه ممیزی
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/QuoteResult' }
                  - type: object
                    properties:
                      simulation_id: { type: [string, 'null'], format: uuid, description: در صورت persist_audit=false تهی است }
                      creates_business_document:
                        type: boolean
                        enum: [false]
                        description: همیشه false — شبیه‌سازی سند/فاکتور/مصرفِ تشویق نمی‌سازد (فقط ردیفِ ممیزی)
                      hypothetical_inputs:
                        type: array
                        description: |
                          ورودی‌های فرضیِ همین اجرا (تفاوتِ عمدی با سفارش): مثلاً
                          `pricing_date`، `coupon_codes`، `lines.unit_price`. این
                          ورودی‌ها در جدول‌های کسب‌وکار ذخیره نمی‌شوند.
                        items: { type: string, enum: [pricing_date, coupon_codes, 'lines.unit_price'] }
