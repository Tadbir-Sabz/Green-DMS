        operation_type: { type: string, enum: [export] }
        phase: { type: string, enum: [preview] }
        execution_status: { type: string, enum: [completed] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        entity_types:
          type: array
          items: { $ref: '#/components/schemas/TransferOwnerType' }
        selections:
          type: array
          items: { $ref: '#/components/schemas/TransferSelection' }
        file_count: { type: integer, minimum: 0 }
        total_bytes: { type: integer, minimum: 0 }
        estimated_package_size_bytes: { type: integer, minimum: 0 }
        rejected_count: { type: integer, minimum: 0 }
        rejected_files:
          type: array
          items: { $ref: '#/components/schemas/TransferRejectedFile' }
        manifest:
          oneOf:
            - { $ref: '#/components/schemas/TransferManifest' }
