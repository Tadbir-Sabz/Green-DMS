      parameters:
        - { name: as_of, in: query, schema: { type: string, format: date } }
        - { name: bank_account_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: موقعیت خزانه
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TreasuryPosition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /cheques:
    get:
      tags: [cheques]
