      type: object
      required: [operation_id, operation_type, phase, execution_status, status, created_at, expires_at, version, entity_types, file_count, total_bytes, package_sha256, manifest_sha256, mapping_sha256, preview_sha256, items, counts, manifest, approval, execution, note_fa]
