openapi: 3.1.0

# =====================================================================
# قرارداد API سامانه پخش مویرگی (Green-DMS)
# منبع: dms-design-report.md › ضمیمه F (F.۱ قرارداد API)
# این سند «تثبیت‌شده» است: وب (Next.js) و سه اپ اندرویدی همگی از همین
# سند کلاینت تولید می‌کنند. هر تغییر ناسازگار فقط با نسخه جدید در مسیر.
# =====================================================================

info:
  title: Green-DMS API
  version: '1.0.0'
  summary: قرارداد مشترک وب و اپ‌های فروشنده، موزع و تلفنی
  description: |
    ## اصول قرارداد (طبق F.۱)
    - **نسخه‌بندی در مسیر:** همه منابع زیر `/v1` هستند؛ تغییر ناسازگار فقط با نسخه جدید.
    - **احراز هویت:** `Bearer` کوتاه‌عمر JWT + `Refresh Token` در `/auth/refresh`؛ اپ‌ها OTP پیامکی را از `/auth/otp/*` می‌گیرند.
    - **صفحه‌بندی:** مبتنی بر cursor — پاسخ‌های فهرست `next_cursor` و `has_more` برمی‌گردانند.
    - **خطاها:** پوشش یکسان `{code, message_fa, details, request_id}`؛ `code` ماشینی و `message_fa` قابل نمایش به کاربر فارسی‌زبان.
    - **آفلاین:** سند‌های میدانی `client_uuid` یکتا می‌فرستند؛ سرور اعمال تکراری را با `409 conflict` رد می‌کند.
    - **قفل خوش‌بینانه:** به‌روزرسانی‌ها `row_version` می‌فرستند؛ مغایرت = `409 version_conflict`.
    - **مبالغ:** رشته اعشاری حداکثر ۱۹ رقم (ریال، مگر تنظیم دیگر) تا دقت از دست نرود.
    - **مکان:** هندسه‌ها GeoJSON (نقطه = مشتری/موقعیت، خط = مسیر) با مختصات WGS84.

    ## رویدادهای زنده (WebSocket — خارج از دامنه REST)
    - `location.update` — موقعیت زنده فروشنده/موزع برای نقشه رهگیری
    - `order.status` — تغییر وضعیت سفارش/حواله/فاکتور برای پیگیری توزیع
    - `approval.queue` — ورود آیتم به صف تأیید کاربر جاری

    ## وب‌هوک بیرونی
    رویدادهای `webhooks` در پایین سند؛ هر درخواست با هدر `X-Signature` (HMAC-SHA256 از بدنه با کلید مشترک) امضا می‌شود و گیرنده تا سه بار با تأخیر نمایی تلاش مجدد می‌کند.

    ## نرخ‌گذاری
    پاسخ‌های `/auth/*` و `/tracking/locations` هدرهای `RateLimit-Limit/Remaining/Reset` دارند؛ مصرف‌کننده بیرونی با کلید `X-API-Key` (طرح `externalApiKey`) کار می‌کند.
  contact:
    name: Green-DMS — تیم فنی
  license:
    name: اختصاصی — استفاده داخلی سازمان
    identifier: LicenseRef-Proprietary

servers:
  - url: http://localhost:4000/api/v1
    description: توسعه محلی
  - url: https://dms.example.ir/api/v1
    description: محیط تولید

security:
  - bearerAuth: []

tags:
  - name: auth
    description: ورود، تازه‌سازی نشست و OTP
  - name: users
    description: کاربران سیستم و دستگاه‌های مجاز
  - name: roles
    description: نقش‌ها و نگاشت مجوزها (RBAC — ضمیمه H)
  - name: persons
    description: اشخاص حقیقی/حقوقی (پایه مشتری و پرسنل)
  - name: staff
    description: پرسنل، سمت، سرپرست و وابستگی حوزه/انبار
  - name: customers
    description: مشتریان، اعتبار و موقعیت جغرافیایی
  - name: products
    description: کالا و دسته‌بندی
  - name: price-lists
    description: لیست قیمت و قیمت مشتری‌محور
  - name: promotions
    description: تخفیف‌ها و جوایز فروش
  - name: warehouses
    description: انبارها (مرکزی، شعبه، خودرو)
  - name: stock
    description: موجودی، اصلاحیه و رزرو
  - name: stocktakes
    description: انبارگردانی
  - name: transfers
    description: انتقال بین‌انباری
  - name: areas
    description: حوزه فروش
  - name: routes
    description: مسیر (پیمایشی) فروشندگان
  - name: tours
    description: تورهای فروش و توزیع + تسویه
  - name: visits
    description: بازدید (check-in/out) با مختصات و ضدتقلب
  - name: requests
    description: درخواست مشتری (پیش از سفارش)
  - name: orders
    description: سفارش فروش
  - name: waybills
    description: حواله انبار
  - name: invoices
    description: فاکتور فروش و ارسال به مؤدیان
  - name: returns
    description: مرجوعی — درخواست، تأیید و ثبت نهایی
  - name: deliveries
    description: پیگیری توزیع و تحویل (POD)
  - name: ar
    description: حسابداری فروش — دفتر مشتری و سنی بدهکاری
  - name: ap
    description: حسابداری خرید — دفتر تأمین‌کننده، سفارش خرید، فاکتور و سند پرداخت
  - name: valuation
    description: ارزش‌گذاری موجودی — بهای میانگین متحرک، لایه‌های بها و موجودی ریالی
  - name: treasury
    description: خزانه‌داری — صندوق و بانک
  - name: cheques
    description: چک‌های دریافتی/پرداختی
  - name: payments
    description: رسید وصول و تخصیص پرداخت
  - name: gl
    description: دفتر کل — کدینگ حساب‌ها، اسناد، دوره‌های مالی و تراز آزمایشی
  - name: tracking
    description: رهگیری موقعیت و مسیریابی
  - name: geofences
    description: محدوده جغرافیایی کار
  - name: rules
    description: موتور قوانین و کنترل‌ها
  - name: approvals
    description: صف تأیید و تصمیم تأییدکننده
  - name: reports
    description: گزارش‌ها و داشبوردها (ضمیمه C)
  - name: settings
    description: تنظیمات عمومی و تفکیکی هر حوزه
  - name: integrations
    description: مؤدیان، پوز، پیامک و درگاه (ضمیمه D)

  - name: attachment-transfer
    description: صدور، بازرسی و تاریخچهٔ بستهٔ ضمائم چندموجودیتی (C4)

paths:

  # ---------------- احراز هویت ----------------
  /auth/login:
    post:
      tags: [auth]
      summary: ورود با نام کاربری/رمز + ارسال کد OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: نشست صادر شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423': { $ref: '#/components/responses/Locked' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: تازه‌سازی نشست با Refresh Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: توکن تازه صادر شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [auth]
      summary: خروج و ابطال نشست جاری
      responses:
        '204': { description: نشست ابطال شد }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [auth]
      summary: نشست جاری — کاربر، نقش‌ها و مجوزهای قابل اتکا برای رابط کاربری
      responses:
        '200':
          description: نشست جاری
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/otp/request:
    post:
      tags: [auth]
      summary: درخواست کد یک‌بارمصرف پیامکی
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
                purpose: { type: string, enum: [login, password_reset, device_bind], default: login }
      responses:
        '202':
          description: کد ارسال شد (پاسخ عامدانه برای جلوگیری از enumeration یکسان است)
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/otp/verify:
    post:
      tags: [auth]
      summary: تأیید کد OTP و صدور نشست
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, code]
              properties:
                username: { type: string }
                code: { type: string, minLength: 4, maxLength: 8 }
                device_id:
                  type: string
                  description: >-
                    شناسه دستگاه ثبت‌شده (id ردیف جدول device) برای اتصال به
                    «دستگاه‌های مجاز»؛ تأیید موفق آن را is_trusted می‌کند
      responses:
        '200':
          description: نشست صادر شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '423': { $ref: '#/components/responses/Locked' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/password-reset:
    post:
      tags: [auth]
      summary: بازیابی رمز عبور با کد OTP (purpose=password_reset)
      description: >-
        کد باید پیش‌تر با purpose=password_reset درخواست شده باشد. پس از مصرفِ اتمیک
        کد، رمز عبور عوض می‌شود، قفل و شمارنده تلاش‌های ناموفق پاک و همه نشست‌های
        باز کاربر با revoked_reason=password_reset باطل می‌شود. پاسخ برای نامِ موجود
        بدون کدِ معتبر و نامِ ناشناخته یکسان است تا وجود حساب لو نرود.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '204':
          description: رمز عبور تغییر کرد و همه نشست‌های باز کاربر باطل شد
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423': { $ref: '#/components/responses/Locked' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------- دستگاه‌های مجاز ----------------
  /devices:
    get:
      tags: [users]
      summary: فهرست دستگاه‌های مجاز کاربر جاری
      description: فقط دستگاه‌های خودِ کاربرِ واردشده (از روی نشست)، بدون نیاز به مجوز جداگانه
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        '200':
          description: صفحه‌ای از دستگاه‌های کاربر جاری
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [users]
      summary: ثبت دستگاه کاربر جاری (پیش‌شرط فعال‌سازی با OTP)
      description: >-
        device_uuid باید برای هر کاربر یکتا باشد. دستگاه تازه با is_trusted=false
        ثبت می‌شود و تا تأیید با کد پیامکی (purpose=device_bind روی /auth/otp/verify)
        دستگاه مجاز به‌شمار نمی‌رود. ثبت دوباره دستگاهِ باطل‌شدهٔ همان کاربر
        آن را دوباره فعال می‌کند، اما دستگاهِ متعلق به کاربر دیگر 409 می‌دهد.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCreate' }
      responses:
        '201':
          description: دستگاه ثبت شد (is_trusted تا تأیید با OTP برابر false است)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /devices/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    delete:
      tags: [users]
      summary: ابطال دستگاه از راه دور (گم‌شدن/فروش گوشی)
      description: >-
        دستگاه باطل می‌شود (revoked_at) و همه نشست‌های فعالِ روی همان دستگاه نیز
        با revoked_reason=device_revoked ابطال می‌گردند؛ ردیف برای ممیزی می‌ماند.
        ابطال مجدد همان دستگاه هم 204 برمی‌گرداند (idempotent).
      responses:
        '204':
          description: دستگاه (و نشست‌هایش) باطل شد
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- کاربران و نقش‌ها ----------------
  /users:
    get:
      tags: [users]
      summary: فهرست کاربران (فیلتر نقش/فعال/حوزه)
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
        - { name: role, in: query, schema: { type: string } }
        - { name: is_active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: صفحه‌ای از کاربران
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [users]
      summary: ساخت کاربر سیستم (فقط برای «کاربر سیستم»؛ فروشنده صرفاً پرسنل است)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      responses:
        '201':
          description: کاربر ساخته شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [users]
      summary: جزئیات کاربر
      responses:
        '200':
          description: کاربر
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [users]
      summary: به‌روزرسانی کاربر (نقش، فعالیت، قفل حساب)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      responses:
        '200':
          description: کاربر به‌روزرسانی شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [users]
      summary: غیرفعال‌سازی کاربر (حذف فیزیکی ممنوع — ممیزی)
      responses:
        '204': { description: کاربر غیرفعال شد }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /roles:
    get:
      tags: [roles]
      summary: فهرست نقش‌ها با مجوزهایشان
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
      responses:
        '200':
          description: صفحه‌ای از نقش‌ها
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [roles]
      summary: ساخت نقش با نگاشت مجوزها
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: نقش ساخته شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /roles/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [roles]
      summary: جزئیات نقش
      responses:
        '200':
          description: نقش
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [roles]
      summary: به‌روزرسانی نقش (نقش‌های سیستمی is_system قابل حذف نیستند)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: نقش به‌روزرسانی شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [roles]
      summary: حذف نقش (فقط اگر کاربری نداشته باشد)
      responses:
        '204': { description: نقش حذف شد }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------- اشخاص، پرسنل ----------------
  /persons:
    get:
      tags: [persons]
      summary: فهرست اشخاص (حقیقی/حقوقی) با جست‌وجوی کد/نام/شناسه ملی
      parameters:
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
        - { name: q, in: query, schema: { type: string }, description: جست‌وجوی فازی نام/کد }
        - { name: legal_type, in: query, schema: { type: string, enum: [natural, legal] } }
      responses:
        '200':
          description: صفحه‌ای از اشخاص
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [persons]
      summary: ثبت شخص جدید
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Person' }
      responses:
        '201':
          description: شخص ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /persons/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [persons]
      summary: جزئیات شخص
      responses:
        '200':
          description: شخص
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
