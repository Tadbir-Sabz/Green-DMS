  # ---------------- کالا، قیمت، تشویق ----------------
  /products:
    get:
      tags: [products]
      summary: فهرست کالاها (جست‌وجوی فازی کد/نام، فیلتر دسته/برند/وضعیت)
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [code_asc, code_desc], default: code_asc } }
        - { $ref: '#/components/parameters/cursor' }
        - { $ref: '#/components/parameters/limit' }
        - { name: q, in: query, schema: { type: string } }
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: brand_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200':
          description: صفحه‌ای از کالاها
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Page' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [products]
      summary: تعریف کالای جدید
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        '201':
          description: کالا ساخته شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/export:
    get:
      tags: [products]
      summary: خروجی CSV از کالاهای کاتالوگ مرکزی (TASK-PM-01D-M3)
      description: >-
        یک snapshot فقط-خواندنی و قطعی از کالاهای حذف‌نشدهٔ همان شرکت، با همان
        فیلترهای فهرست کالا (بدون صفحه‌بندی cursor). ستون‌های قابلِ استفاده در
        ورود گروهی محصول حفظ می‌شوند؛ ستون‌های تشخیصی اضافی نادیده گرفته می‌شوند.
        سقف پیش‌فرض ۱۰٬۰۰۰ ردیف است. در صورت وجود ردیف بیشتر، خروجی بریده شده و
        سربرگ X-Product-Export-Truncated مقدار true می‌گیرد؛ پاسخ هرگز به‌صورت
        بی‌صدا ناقص اعلام نمی‌شود. خروجی شامل تاریخچه، صفات، روابط، بسته‌ها،
        بسته‌بندی و عضویت دامنه نیست. مجوز master.product.view و ممیزی export
        اعمال می‌شود.
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [code_asc, code_desc], default: code_asc } }
        - { name: q, in: query, schema: { type: string, maxLength: 128 } }
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: brand_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [active, blocked, discontinued] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 10000 } }
      responses:
        '200':
          description: فایل CSV با BOM UTF-8 و سربرگ‌های امن در برابر فرمول صفحه گسترده
          headers:
            X-Product-Export-Row-Count:
              description: تعداد ردیف‌های کالای نوشته‌شده در فایل
              schema: { type: integer, minimum: 0 }
            X-Product-Export-Truncated:
              description: true یعنی فیلتر بیش از سقف مجاز نتیجه داشته و فایل کامل نیست
              schema: { type: boolean }
            X-Product-Export-Max-Rows:
              description: سقف اعمال‌شده بر تعداد ردیف‌ها
              schema: { type: integer, minimum: 1, maximum: 10000 }
          content:
            text/csv:
              schema:
                type: string
                description: محتوای CSV؛ با parseAs=text از کلاینت تایپ‌شده خوانده می‌شود
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /products/bulk-maintenance/fields:
    get:
      tags: [products]
      summary: فهرست فیلدهای مجاز نگهداشت گروهی (TASK-PM-01D-M4)
      description: >-
        فهرست سفید و برچسبهای فارسی فیلدها از سرور؛ مرورگر هیچ فیلد محافظتشده،
        دامنهای، انباری، قیمتی یا وضعیتی را پیشنهاد نمیدهد. این پاسخ فقط ابزار
        ساخت فرم است و اعمال تغییری نمیکند. مجوز master.product.update لازم است.
      responses:
        '200':
          description: فیلدهای مجاز، نوع مقدار و برچسب فارسی
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkMaintenanceFieldsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /products/bulk-maintenance/preview:
    post:
      tags: [products]
      summary: پیشنمایش محصولی فقطخواندنی نگهداشت گروهی کالا (TASK-PM-01D-M4)
      description: >-
        پیشنمایش سروری و دقیقِ قبل/بعد برای حداکثر ۱۰۰ کالای همان شرکت و حداکثر
        ۹ فیلد مرکزی مجاز. هیچ ردیف product بهروزرسانی نمیشود، هیچ ردیف
        product_catalog_history یا audit_log ساخته نمیشود؛ تنها یک ردیف دفتر
        عملیات پایدار با نشانهٔ یکبارمصرف درج میشود. بنابراین این مسیر از نظر
        محصول فقطخواندنی است، نه یک GET بدون اثر جانبی (TASK-PM-01D-M4-F). مجوز
        master.product.update لازم است؛ master.product.view یا خروجی CSV مجوز
        نوشتن گروهی نیست.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkMaintenancePreviewRequest' }
      responses:
        '200':
          description: پیشنمایش سروری، تفاوت دقیق هر کالا و شمار واجد/ردشدهها
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkMaintenancePreviewResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /products/bulk-maintenance/execute:
    post:
      tags: [products]
      summary: اجرای همهیا هیچ نگهداشت گروهی با هویت بایدار (TASK-PM-01D-M4)
      description: >-
        اجرا فقط مقادیر ذخیرهشدهٔ همان پیشنمایش را میپذیرد؛ changes تازهای در
        این مسیر ارسال نمیشود. تأیید صریح، نشانهٔ پیشنمایش، مجوز نوشتن، بررسی
        تازگی نسخهها و قفل خوشبینانهٔ واقعی row_version الزامی است. همهٔ
        بهروزرسانیها، ممیزی همبسته، تاریخچهای 0060 و وضعیت دفتر عملیات در یک
        تراکنش commit میشوند. پخش مجدد همان شناسه/نشانه دوباره اعمال نمیشود؛
        نتیجهٔ نامشخص تنها با تطبیق شواهد و بدون اجرای کور مجدد بررسی میشود.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkMaintenanceExecuteRequest' }
      responses:
        '200':
          description: نتیجهٔ نهایی، پخش مجدد بیاثر، رد قطعی یا وضعیت نامشخص failclosed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkMaintenanceOperationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/bulk-maintenance/operations/{operationId}:
    get:
      tags: [products]
      summary: وضعیت بایدار و واقعاً فقطخواندنی یک عملیات نگهداشت گروهی
      description: >-
        وضعیت دفتر عملیات همان شرکت/بازیگر را برمیگرداند: پیشنمایش ایجادشده،
        کهنه، منقضی، ثبتشده، ردشده یا نامشخص. این GET هیچ گذار وضعیت یا تطبیق
        شواهد انجام نمیدهد (TASK-PM-01D-M4-F)؛ تطبیق فقط با اکشن صریح
        POST /operations/{operationId}/reconcile ممکن است.
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: وضعیت بایدار عملیات و نتیجهٔ تطبیق در صورت نیاز
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkMaintenanceOperationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/bulk-maintenance/operations/{operationId}/reconcile:
    post:
      tags: [products]
      summary: اکشن صریح تطبیق شواهد operation-bound یک عملیات (TASK-PM-01D-M4-F)
      description: >-
        فقط برای وضعیتهای نامشخص/پذیرفتهشده، شواهد سرور-کنترلشدهٔ ۰۰۶۳
        (ممیزی الزامی، تاریخچهٔ ۰۰۶۰ و جدول شواهد) را بهصورت کامل، سازگار،
        بدون تکرار و بدون اتصال به عملیات/شرکت/بازیگر دیگر بررسی میکند. ناقص،
        ناسازگار، تکراری، جداافتاده یا شواهد عملیات دیگر ⇒ fail-closed نامشخص.
        GET وضعیت هرگز تغییری نمیدهد. مجوز master.product.update لازم است.
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: نتیجهٔ تطبیق قطعی (committed/rolled_back) یا نامشخص failclosed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkMaintenanceOperationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{id}:
