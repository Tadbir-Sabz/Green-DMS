# =====================================================================
# وب‌هوک‌های بیرونی (OpenAPI 3.1) — امضا با X-Signature و تلاش مجدد
# =====================================================================
  /product-families/{id}:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    patch:
      tags: [products]
      summary: ویرایش نام یا فعال/غیرفعال کردن خانواده با حفظ هویت
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                is_active: { type: boolean }
      responses:
        '200':
          description: خانواده
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductFamily' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{id}/history:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [products]
      summary: تاریخچه اتمی کاتالوگ کالا
      parameters:
        - { name: before, in: query, schema: { type: string, pattern: '^[0-9]{1,20}$' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: تاریخچه
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductCatalogHistoryPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /product-catalog/history:
    get:
      tags: [products]
      summary: تاریخچه سراسری و فقط خواندنی کاتالوگ مرکزی
      description: رویدادهای تغییرناپذیر کاتالوگ مرکزی را در محدوده شرکت نشست و با صفحهبندی keyset نمایش میدهد. فقط انواع موجودیت مهاجرت 0060 مجازاند؛ تاریخچه عضویت دامنه، قیمت و موجودی در این مسیر وجود ندارد.
      parameters:
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
            enum: [product, product_category, product_family, product_alias, product_attribute_def, product_attribute_enum_value, product_attribute_value, product_relation, product_bundle, product_barcode, product_packaging]
        - name: product_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - { name: before, in: query, schema: { type: string, pattern: '^[0-9]{1,20}$' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: صفحهای از تاریخچه مرکزی شرکت
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductCatalogHistoryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /product-domain-integration:
    get:
      tags: [products]
      summary: قرارداد اتصال کاتالوگ به دامنه عملیاتی
      description: وضعیت تصمیمهای مالک و مرز فنی اتصال را برمیگرداند؛ `available` تا تصمیم مالک و پیادهسازی عضویت همواره `false` است.
      responses:
        '200':
          description: قرارداد و فهرست تصمیمهای لازم؛ جریان کاری دامنه غیرفعال است
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainCatalogContractStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /products/{id}/domain-catalog:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [products]
      summary: مرز بسته اتصال دامنه؛ عرضه سراسری فرض نمیشود
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /products/{id}/domain-scope:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [products]
      summary: نمای صریح جدایی هویت مرکزی کالا از عضویت و دسترسپذیری دامنهای
      description: |
        TASK-PM-02: پاسخی خواندنی و بیداده در سطح **هویت مرکزی**. چرخهٔ حیات
        مرکزی کالا نمایش داده میشود، ولی `domain_context`، `domain_membership`
        و `domain_availability` همیشه `unresolved` و `available` همیشه `false`
        است. وضعیت `active` مرکزی هرگز به معنی عرضه در دامنه یا فعال بودن در
        همهٔ دامنهها نیست. هیچ عضویت، فهرست دامنه، تاریخچه یا دادهٔ ساختگی
        برگردانده نمیشود. ارسال هدر `x-domain-id` یا پارامتر دامنهای با خطای
        `domain_context_not_supported` / `domain_property_rejected` رد میشود.
        مجوز `master.product.view`، RLS شرکت و قید صریح `company_id` اعمال
        میشوند؛ کالای شرکت دیگر ۴۰۴ یکسان میگیرد تا وجودش افشا نشود.
      responses:
        '200':
          description: مرز مرکزی/دامنهای کالا؛ بدون هیچ نتیجهگیری دامنهای
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDomainScope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
