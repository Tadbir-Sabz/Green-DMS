# =====================================================================
# وب‌هوک‌های بیرونی (OpenAPI 3.1) — امضا با X-Signature و تلاش مجدد
# =====================================================================
webhooks:
  invoicePosted:
    post:
      summary: صدور قطعی فاکتور
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string, enum: [invoice.posted] }
                occurred_at: { type: string, format: date-time }
                data: { $ref: '#/components/schemas/Invoice' }
      responses:
        '200': { description: پذیرفته شد }
  orderStatusChanged:
    post:
      summary: تغییر وضعیت سفارش
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string, enum: [order.status_changed] }
                occurred_at: { type: string, format: date-time }
                data: { $ref: '#/components/schemas/SalesOrder' }
      responses:
        '200': { description: پذیرفته شد }
  paymentReceived:
    post:
      summary: ثبت وصول
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string, enum: [payment.received] }
                occurred_at: { type: string, format: date-time }
                data: { $ref: '#/components/schemas/PaymentReceipt' }
      responses:
        '200': { description: پذیرفته شد }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: توکن دسترسی کوتاه‌عمر (۱۵ دقیقه)؛ تازه‌سازی با `/auth/refresh`
    externalApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: کلید مصرف‌کننده بیرونی (طرح نرخ‌گذاری‌شده)

  parameters:
    cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: مقدار `next_cursor` صفحه قبلی
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      description: اندازه صفحه
    idPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: درخواست نامعتبر (خطای اعتبارسنجی)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: نشست نامعتبر یا منقضی — نیازمند ورود مجدد/تازه‌سازی
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: مجوز کافی نیست (RBAC — ضمیمه H)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: منبع یافت نشد
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: تعارض (کد تکراری، client_uuid تکراری یا row_version ناهمخوان)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Locked:
      description: حساب قفل شده (تلاش‌های ناموفق متوالی)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RuleRejected:
      description: موتور قوانین عملیات را رد کرد؛ `message_fa` را به کاربر نمایش دهید
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: نرخ درخواست بیش از حد مجاز
      headers:
        RateLimit-Limit:
          schema: { type: integer }
        RateLimit-Remaining:
          schema: { type: integer }
        RateLimit-Reset:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Error:
      type: object
      required: [code, message_fa]
      properties:
        code: { type: string, examples: ['validation_failed', 'rule_rejected', 'version_conflict'] }
        message_fa: { type: string, description: پیام فارسی آماده نمایش به کاربر }
        details:
          type: object
          additionalProperties: true
          description: جزئیات فیلد/قاعده ردشده — هر پیام فیلد فارسی است (details.fields.{نام فیلد})
        request_id: { type: string, description: شناسه پیگیری برای ممیزی }

    Page:
      type: object
      properties:
        next_cursor:
          type: [string, 'null']
          description: مقدار cursor برای صفحه بعدی؛ null یعنی پایان
        has_more: { type: boolean }

    GeoPoint:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Point] }
        coordinates:
          type: array
          items: { type: number }
          minItems: 2
          maxItems: 2
          description: '[طول، عرض] به WGS84'

    GeoLineString:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [LineString] }
        coordinates:
          type: array
          items:
            type: array
            items: { type: number }
            minItems: 2
            maxItems: 2

    UpdateGeofence:
      type: object
      description: به‌روزرسانی جزئی محدوده — همه فیلدها اختیاری
      properties:
        name: { type: string, maxLength: 120 }
        kind: { type: string, enum: [work_area, customer, warehouse, restricted] }
        area: { $ref: '#/components/schemas/GeoPolygon' }
        customer_id: { type: [string, 'null'], format: uuid }
        warehouse_id: { type: [string, 'null'], format: uuid }
        is_active: { type: boolean }
    GeoPolygon:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Polygon] }
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items: { type: number }
              minItems: 2
              maxItems: 2

    LoginRequest:
      type: object
      required: [username]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        otp_code: { type: string, description: در صورت فعال‌بودن ورود دومرحله‌ای }

    PasswordResetRequest:
      type: object
      required: [username, code, new_password]
      description: بازیابی رمز عبور با کد پیامکیِ دلیل password_reset
      properties:
        username: { type: string }
        code: { type: string, minLength: 4, maxLength: 8, description: همان کد پیامک‌شده }
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
          description: رمز تازه (دست‌کم ۸ نویسه)؛ فقط هش آن ذخیره و هرگز برنمی‌گردد

    AuthSession:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token: { type: string, description: JWT کوتاه‌عمر }
        refresh_token: { type: string }
        expires_in: { type: integer, description: طول عمر access_token به ثانیه }
        user: { $ref: '#/components/schemas/User' }

    Device:
      type: object
      description: >-
        دستگاه مجاز کاربر (جدول device — مهاجرت 0012)؛ پایه «کنترل دستگاه:
        لیست دستگاه‌های مجاز و ابطال از راه دور» در ضمیمه H
      required: [id, device_uuid, platform, app_kind, is_trusted, created_at]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        device_uuid: { type: string, description: شناسه سخت‌افزاری/نصب اپ (از سوی اپ ارسال می‌شود) }
        platform: { type: string, enum: [android] }
        app_kind: { type: string, enum: [sales, delivery, telesales] }
        app_version: { type: [string, 'null'] }
        os_version: { type: [string, 'null'] }
        push_token: { type: [string, 'null'] }
        is_trusted:
          type: boolean
          description: با تأیید کد پیامکی (device_bind) true می‌شود؛ تا آن زمان دستگاه مجاز نیست
        last_seen_at: { type: [string, 'null'], format: date-time }
        revoked_at:
          type: [string, 'null']
          format: date-time
          description: باطل‌شده؟ null یعنی فعال؛ ردیف برای ممیزی می‌ماند
        created_at: { type: string, format: date-time, readOnly: true }

    DeviceCreate:
      type: object
      required: [device_uuid, platform, app_kind]
      properties:
        device_uuid: { type: string, minLength: 1, maxLength: 128 }
        platform: { type: string, enum: [android] }
        app_kind: { type: string, enum: [sales, delivery, telesales] }
        app_version: { type: string, maxLength: 32 }
        os_version: { type: string, maxLength: 32 }
        push_token: { type: string, maxLength: 512 }

    SessionContext:
      type: object
      required: [user, roles, permissions]
      description: >
        پاسخ GET /auth/me — نقش‌ها و مجوزهای resolveشده از جداول مهاجرت 0004 و
        seed 0022؛ رابط کاربری بدون فراخوانی مجدد می‌تواند منو و دکمه‌ها را بسازد
      properties:
        user: { $ref: '#/components/schemas/User' }
        roles:
          type: array
          items: { type: string }
          description: کدهای نقش کاربر
        permissions:
          type: array
          items: { type: string }
          description: مجوزهای قطعی (الگوهای نقش resolve شده‌اند)

    User:
      type: object
      required: [username]
      description: >
        کاربر سیستم؛ «فروشنده» لزوماً کاربر نیست (فقط پرسنل میدانی).
        فیلدهای writeOnly فقط در POST /users و PATCH /users/{id} پذیرفته می‌شوند
        و هرگز در پاسخ برنمی‌گردند (رمز عبور اصلاً ذخیره/برگردانده نمی‌شود).
      properties:
        id: { type: string, format: uuid, readOnly: true }
        username: { type: string }
        staff_id: { type: [string, 'null'], format: uuid, description: نسبت به پرسنل، در صورت وجود }
        role_ids:
          type: array
          items: { type: string, format: uuid }
        is_active: { type: boolean }
        locked_until: { type: [string, 'null'], format: date-time, readOnly: true }
        last_login_at: { type: [string, 'null'], format: date-time, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        # ------- فقط-نوشتَنی (درخواست‌های POST/PATCH) -------
        password:
          type: string
          format: password
          writeOnly: true
          description: رمز عبور؛ هش آن ذخیره می‌شود و در پاسخ هرگز برنمی‌گردد
        access_level:
          type: string
          enum: [web, field_sales, field_delivery, field_telesales, scope_only, none]
          description: سطح دسترسی کاربر (check app_user_access_level — مهاجرت 0004 §۱.۴)
        is_locked:
          type: boolean
          description: >
            قفل دستی توسط مدیر: در GET /users وضعیت فعلی قفل را می‌دهد و در
            POST/PATCH دستور قفل (true) یا باز کردن قفل و صفر کردن شمارنده تلاش (false) است
        person_code:
          type: string
          writeOnly: true
          description: کد شخص تازه — فقط وقتی staff_id داده نشده باشد (پیش‌فرض USR-نام کاربری)
        first_name:
          type: string
          writeOnly: true
          description: نام شخص تازه — فقط وقتی staff_id داده نشده باشد
        last_name:
          type: string
          writeOnly: true
          description: نام خانوادگی شخص تازه — فقط وقتی staff_id داده نشده باشد

    Role:
      type: object
      required: [code, name]
      description: نقش با الگوی اعطای مجوز («*» همه، «x.y» زیرمجموعه)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string, examples: ['salesperson_cold', 'supervisor'] }
        name: { type: string }
        is_system: { type: boolean, readOnly: true }
        permission_codes:
          type: array
          items: { type: string }
          description: الگوهای مجوز اعطا شده (از seed مهاجرت 0022)

    Person:
      type: object
      required: [code, legal_type]
      description: >
        شخص حقیقی/حقوقی — پایه مشتری، تأمین‌کننده و پرسنل.
        legal_type دقیقاً همان مقادیر check قید جدول person است (natural/legal)؛
        برای legal باید legal_name و برای natural باید first_name یا last_name آمده باشد.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string, description: کد شخص در شرکت (قید یکتای company_id+code) }
        legal_type: { type: string, enum: [natural, legal] }
        first_name: { type: [string, 'null'], description: برای شخص حقیقی }
        last_name: { type: [string, 'null'], description: برای شخص حقیقی }
        legal_name: { type: [string, 'null'], description: برای شخص حقوقی (legal) }
        national_id: { type: [string, 'null'] }
        economic_code: { type: [string, 'null'], description: برای شخص حقوقی }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time, readOnly: true }

    Staff:
      type: object
      required: [person_id]
      description: پرسنل — سمت، سرپرست، وسیله و حوزه کاری
      properties:
        id: { type: string, format: uuid, readOnly: true }
        person_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        job_position_code: { type: string, examples: ['salesperson_cold', 'courier'] }
        employee_no: { type: string }
        hire_date: { type: string, format: date }
        supervisor_id: { type: [string, 'null'], format: uuid, description: نسبت فروشنده به سرپرست }
        vehicle_id: { type: [string, 'null'], format: uuid }
        is_field: { type: boolean, description: آیا میدانی است (رهگیری/تور) }
        area_ids:
          type: array
          items: { type: string, format: uuid }
          description: حوزه‌های مجاز کار
        status: { type: string, enum: [active, inactive] }
        created_at: { type: string, format: date-time, readOnly: true }
        row_version: { type: integer, minimum: 0, description: نسخه قفل خوش‌بینانه — مغایرت با سرور در PATCH برابر است با 409 version_conflict }

    UpdateStaff:
      type: object
      description: به‌روزرسانی جزئی پرسنل — همه فیلدها اختیاری (متناظر با PartialType(CreateStaffDto) سمت API)
      properties:
        person_id: { type: string, format: uuid }
        job_position_code: { type: string }
        employee_no: { type: string }
        hire_date: { type: string, format: date }
        supervisor_id: { type: [string, 'null'], format: uuid }
        vehicle_id: { type: [string, 'null'], format: uuid }
        is_field: { type: boolean }
        area_ids:
          type: array
          items: { type: string, format: uuid }
        status: { type: string, enum: [active, inactive] }
        row_version: { type: integer, minimum: 0 }

    Customer:
      type: object
      required: [person_id, code]
      description: مشتری با مسیر، لیست قیمت، شرایط تسویه و موقعیت نقشه
      properties:
        id: { type: string, format: uuid, readOnly: true }
        person_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        code: { type: string }
        area_id: { type: [string, 'null'], format: uuid }
        route_id: { type: [string, 'null'], format: uuid }
        salesperson_id: { type: [string, 'null'], format: uuid }
        channel: { type: string, description: کانال فروش (سرد/گرم/پورتال) }
        price_list_id: { type: [string, 'null'], format: uuid }
        settlement_term_id: { type: [string, 'null'], format: uuid }
        visit_sequence: { type: integer, description: ترتیب در مسیر }
        geo: { oneOf: [{ $ref: '#/components/schemas/GeoPoint' }, { type: 'null' }] }
        geo_accuracy_m: { type: number }
        geo_source: { type: string, enum: [gps, map_pick, geocode, import] }
        geo_captured_at: { type: [string, 'null'], format: date-time, readOnly: true }
        credit_limit: { type: [string, 'null'], description: سقف اعتبار (رشته اعشاری) }
        status: { type: string, enum: [active, suspended, blocked, closed] }
        created_at: { type: string, format: date-time, readOnly: true }
        row_version: { type: integer, minimum: 0, description: نسخه قفل خوش‌بینانه — مغایرت با سرور در PATCH برابر است با 409 version_conflict }

    Product:
      type: object
      required:
        - id
        - code
        - name
        - category_id
        - base_uom_id
        - is_batch_tracked
        - is_expiry_tracked
        - is_returnable_container
        - requires_permit
        - distribution_kind
        - min_order_qty
        - status
        - created_at
        - row_version
      description: >
        کالا — پاسخ سرور (همه فیلدهای الزامی همیشه در پاسخ هستند؛ فیلدهای
        nullable مثل brand_id ممکن است null باشند). برای نوشتن از
        ProductCreate (POST) و ProductUpdate (PATCH) استفاده می‌شود.
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string }
        name: { type: string }
        category_id: { type: string, format: uuid }
        brand_id: { type: [string, 'null'], format: uuid }
        base_uom_id: { type: string, format: uuid }
        tax_code_id: { type: [string, 'null'], format: uuid }
        is_batch_tracked: { type: boolean }
        is_expiry_tracked: { type: boolean }
        shelf_life_days: { type: [integer, 'null'], description: 'null یعنی کالای انقضادار نیست' }
        is_returnable_container: { type: boolean, description: کالای برگشت‌پذیر (بشکه/سیلندر) }
        requires_permit: { type: boolean }
        distribution_kind: { type: string, enum: [cold, warm, both], description: نوع توزیع (سرد/گرم/هر دو) }
        min_order_qty: { type: number, description: 'حداقل سفارش (رشته اعشاری از دیتابیس به عدد سریالایز می‌شود)' }
        weight_gr: { type: [integer, 'null'] }
        volume_cm3: { type: [integer, 'null'] }
        status: { type: string, enum: [active, blocked, discontinued] }
        created_at: { type: string, format: date-time, readOnly: true }
        row_version:
          type: integer
          readOnly: true
          description: قفل خوش‌بینانه — PATCH با این مقدار مغایرت = 409 version_conflict

    ProductCreate:
      type: object
      required: [code, name, category_id, base_uom_id]
      description: >
        فیلدهای نوشتنی برای POST — سرور id، status، created_at و row_version را
        می‌سازد؛ فیلدهای اختیاری مقدار پیش‌فرض DDL می‌گیرند
      properties:
        code: { type: string }
        name: { type: string }
        category_id: { type: string, format: uuid }
        brand_id: { type: [string, 'null'], format: uuid }
        base_uom_id: { type: string, format: uuid }
        tax_code_id: { type: [string, 'null'], format: uuid }
        is_batch_tracked: { type: boolean }
        is_expiry_tracked: { type: boolean }
        shelf_life_days: { type: [integer, 'null'], description: 'فقط برای کالای انقضادار' }
        is_returnable_container: { type: boolean }
        requires_permit: { type: boolean }
        distribution_kind: { type: string, enum: [cold, warm, both] }
        min_order_qty: { type: number }
        weight_gr: { type: [integer, 'null'] }
        volume_cm3: { type: [integer, 'null'] }

    ProductUpdate:
      type: object
      description: >
        فیلدهای قابل تغییر PATCH — همه اختیاری؛ تغییرها با row_version اعمال
        می‌شوند (مغایرت = 409 version_conflict)
      properties:
        code: { type: string }
        name: { type: string }
        category_id: { type: string, format: uuid }
        brand_id: { type: [string, 'null'], format: uuid }
        base_uom_id: { type: string, format: uuid }
        tax_code_id: { type: [string, 'null'], format: uuid }
        is_batch_tracked: { type: boolean }
        is_expiry_tracked: { type: boolean }
        shelf_life_days: { type: [integer, 'null'] }
        is_returnable_container: { type: boolean }
        requires_permit: { type: boolean }
        distribution_kind: { type: string, enum: [cold, warm, both] }
        min_order_qty: { type: number }
        weight_gr: { type: [integer, 'null'] }
        volume_cm3: { type: [integer, 'null'] }
        status: { type: string, enum: [active, blocked, discontinued] }
        row_version:
          type: integer
          description: قفل خوش‌بینانه — مقدار فرستاده‌شده باید با مقدار فعلی سرور یکی باشد

    ProductCategory:
      type: object
      required: [id, code, name]
      description: دسته‌بندی درختی کالا (هر شرکت ساختار خودش را دارد)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string }
        name: { type: string }
        parent_id: { type: [string, 'null'], format: uuid, description: والد در سلسله‌مراتب }

    Unit:
      type: object
      required: [id, code, title]
      description: واحد اندازه‌گیری — داده مرجع سراسری (جدول uom)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string, examples: ['pcs', 'box', 'carton'] }
        title: { type: string }
        decimal_places: { type: integer, minimum: 0, maximum: 4 }

    PriceList:
      type: object
      required: [code, title]
      description: لیست قیمت؛ قیمت مشتری‌محور در `customer_price` اولویت دارد
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string }
        title: { type: string }
        kind: { type: string, enum: [general, wholesale, retail, chain, cooperative, channel] }
        currency: { type: string, minLength: 3, maxLength: 3, default: IRR }
        is_active: { type: boolean }
        items:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              price: { type: string, description: 'قیمت واحد (رشته اعشاری)' }
              valid_from: { type: [string, 'null'], format: date }
              valid_to: { type: [string, 'null'], format: date }

    Promotion:
      type: object
      required: [code, title, kind]
      description: تخفیف/جایزه با شرایط و منفعت به JSON (ماژول ۱)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string }
        title: { type: string }
        kind: { type: string, enum: [percent_line, amount_line, bundle, buy_x_get_y, gift_item, cash_discount, repeat_order, coupon, volume_tier] }
        valid_from: { type: string, format: date }
        valid_to: { type: string, format: date }
        priority: { type: integer }
        allow_stacking: { type: boolean }
        max_discount_amount: { type: [string, 'null'] }
        max_per_customer_per_day: { type: [string, 'null'] }
        conditions:
          type: object
          additionalProperties: true
          description: شرایط احراز (کالا/کانال/حداقل مبلغ)
        benefit:
          type: object
          additionalProperties: true
          description: منفعت (درصد/مبلغ/کالای جایزه)
        is_active: { type: boolean }

    Warehouse:
      type: object
      required: [code, name, kind]
      description: انبار مرکزی، شعبه یا خودرو (انبار سیار)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        kind: { type: string, enum: [main, vehicle, transit, damaged, quarantine, consignment] }
        parent_warehouse_id: { type: [string, 'null'], format: uuid }
        vehicle_id: { type: [string, 'null'], format: uuid }
        area_id: { type: [string, 'null'], format: uuid }
        allow_negative: { type: boolean }
        is_active: { type: boolean }
        row_version: { type: integer, minimum: 0, description: نسخه قفل خوش‌بینانه — مغایرت با سرور در PATCH برابر است با 409 version_conflict }

    StockBalance:
      type: object
      description: موجودی قابل رزرو در انبار (بدون کلید مجزا — ترکیب انبار/کالا/بچ)
      properties:
        warehouse_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        batch_id: { type: [string, 'null'], format: uuid }
        qty_on_hand: { type: number }
        qty_reserved: { type: number }
        qty_available: { type: number, description: 'on_hand − reserved — محاسبه‌شده' }
        qty_on_hand_value: { type: [string, 'null'], description: ارزش موجودی (بهای تمام‌شده) }
        updated_at: { type: string, format: date-time, readOnly: true }

    StockAdjustment:
      type: object
      required: [warehouse_id, product_id, qty_delta, reason_code]
      description: اصلاحیه موجودی؛ مغایرت‌های بزرگ از طریق approvals تأیید می‌شوند
      properties:
        warehouse_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        batch_id: { type: [string, 'null'], format: uuid }
        qty_delta: { type: number }
        reason_code: { type: string, enum: [damage, expiry, sample, internal_use, theft, count_fix, other] }
        note: { type: [string, 'null'] }
        client_uuid: { type: string, format: uuid, description: کلید idempotency آفلاین — ثبت تکراری = 409 }

    StockTake:
      type: object
      required: [warehouse_id]
      description: سند انبارگردانی با شمارش واقعی در برابر سیستم
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid, readOnly: true }
        warehouse_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, counting, review, approved, posted, voided] }
        row_version: { type: integer, minimum: 0, description: نسخه قفل خوش‌بینانه — مغایرت با سرور در PATCH برابر است با 409 version_conflict }
        lines:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              batch_id: { type: [string, 'null'], format: uuid }
              system_qty: { type: number, readOnly: true }
              counted_qty: { type: number }
              variance_qty: { type: number, readOnly: true }

    Transfer:
      type: object
      required: [from_warehouse_id, to_warehouse_id]
      description: انتقال بین‌انباری (بارگیری خودرو / انتقال شعبه)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        doc_number: { type: string, readOnly: true }
        from_warehouse_id: { type: string, format: uuid }
        to_warehouse_id: { type: string, format: uuid }
        status: { type: string, enum: [draft, approved, in_transit, received, voided] }
        lines:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              batch_id: { type: [string, 'null'], format: uuid }
              qty: { type: number }

    Area:
      type: object
      required: [code, name]
      description: حوزه فروش (سلسله‌مراتبی — هر حوزه انبار و وسایل نقلیه خود را دارد)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid }
        parent_area_id: { type: [string, 'null'], format: uuid }
        code: { type: string }
        name: { type: string }
        is_active: { type: boolean }

    Route:
      type: object
      required: [area_id, code, name]
      description: مسیر پیمایشی با ترتیب هفتگی بازدید مشتریان
      properties:
        id: { type: string, format: uuid, readOnly: true }
        area_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        visit_weekday: { type: [integer, 'null'], minimum: 0, maximum: 6, description: '۰=شنبه … ۵=جمعه' }
        is_active: { type: boolean }
        customer_ids:
          type: array
          items: { type: string, format: uuid }
          description: ترتیب مشتریان در مسیر

    Tour:
      type: object
      required: [tour_date, kind, salesperson_id]
      description: تور فروش/توزیع — دریافت توسط فروشنده یا تخصیص مدیر
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid, readOnly: true }
        doc_number: { type: string, readOnly: true }
        tour_date: { type: string, format: date }
        kind: { type: string, enum: [cold, warm, distribution, telesales] }
        salesperson_id: { type: string, format: uuid }
        supervisor_id: { type: [string, 'null'], format: uuid }
        route_id: { type: [string, 'null'], format: uuid }
        vehicle_id: { type: [string, 'null'], format: uuid }
        warehouse_id: { type: [string, 'null'], format: uuid, description: انبار سیار خودرو }
        status: { type: string, enum: [planned, active, settled, closed] }
        planned_start_at: { type: [string, 'null'], format: date-time }
