          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items: { $ref: '#/components/schemas/SettingEntry' }
      responses:
        '200':
          description: تنظیمات به‌روزرسانی شد
          content:
