            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductBarcode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [products]
      summary: 'ثبت بارکد (یکتاییِ نوع‌محور: GS1 سراسری / داخلیِ شرکت — D2)'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductBarcodeCreate' }
      responses:
        '201':
          description: بارکد ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductBarcode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/{id}/media:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
    get:
      tags: [products]
      summary: فهرست تصاویر و اسناد کالا + تصویرِ اصلی خودکار (§B4 طراحی هدف)
      description: >-
        نمای محصولمحورِ ضمیمههای `owner_type='product'` (بازاستفاده از زنجیرهٔ
        مالکیت راستیآزمایشدهٔ §A). تصویرِ اصلی v1 نخستین «تصویر» بر اساس
        `created_at` است و در لحظهٔ خواندن محاسبه میشود؛ هیچ ستون `is_primary`
        یا `sort_order` و هیچ مهاجرت تازهای وجود ندارد. برچسب UI دقیقاً
        «اصلی (خودکار)» است. اسناد PDF هرگز تصویرِ اصلی نمیشوند. این نما هیچ
        هویت، عضویت، وضعیت یا دسترسپذیری دامنهای برنمیگرداند؛ کلیدها و هدر
        `x-domain-id` دامنهای مانند سایر سطوح خواندنی کاتالوگ (B2) با ۴۰۰ رد
        میشوند. خطاهای ممکن: `invalid_id`، `product_not_found`،
        `domain_property_rejected`، `domain_context_not_supported`، `forbidden`.
      responses:
        '200':
          description: تصاویر/اسناد کالا همراه URL امضاشدهٔ کوتاهعمر
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductMediaView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: ذخیرهسازی شیء پیکربندی نشده است (کد storage_not_configured)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [products]
      summary: بارگذاری تصویر/سند کالا (multipart/form-data — فقط فیلد file)
      description: >-
        مالک (`owner_type='product'`, `owner_id={id}`) و شرکت فقط از مسیر و
        نشست سرور مشتق میشوند؛ ارسال `owner_type`، `owner_id`، `company_id`،
        `uploaded_by` یا `storage_key` در بدنه با ۴۰۰
        `product_media_owner_scope_rejected` رد میشود، نه اینکه بیصدا حذف شود.
        مجوزها: `master.product.update` (§F) و `attachment.upload`؛ هر دو دوباره
        از پایگاهداده بازاعتبارسنجی میشوند. همان خط لولهٔ `POST /attachments`
        (سقف حجم، allowlist، امضای بایتی، SHA-256، کلید نامفضاشده به شرکت،
        URL امضاشده) دوباره استفاده میشود، بیآنکه قرارداد آن تغییر کند. آپلود،
        ثبت metadata و رویداد `audit_log` با `action=create` و
        `entity_type=product_media` در یک تراکنشاند؛ شکست ممیزی ⇒ rollback و
        پاکسازی شیء آپلودشده. حذف ضمیمه در v1 وجود ندارد (مسیر حذف مصوبی نیست).
        خطاها: `empty_file`، `file_too_large`، `unsupported_media_type`،
        `unverifiable_content_type`، `content_type_mismatch`،
        `malformed_content`، `product_media_owner_scope_rejected`،
        `product_not_found`، `forbidden`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    بایتهای فایل. انواع مجاز: image/jpeg، image/png، image/webp،
                    application/pdf؛ سقف حجم پیشفرض ۸ مگابایت. هیچ فیلد مالکیتی
                    پذیرفته نمیشود.
      responses:
        '201':
          description: فایل ذخیره و metadata + رویداد ممیزی ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductMediaItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: حجم فایل بیش از حد مجاز (file_too_large)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: نوع/امضای محتوای فایل پذیرفته نشد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: ذخیرهسازی شیء پیکربندی نشده است (storage_not_configured)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /products/{id}/media/{mediaId}/url:
