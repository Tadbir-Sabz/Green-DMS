        items:
          type: array
          items: { $ref: '#/components/schemas/TransferOwnerTypeOption' }
        note_fa: { type: string }
    TransferOwnerRecord:
      type: object
      required: [owner_type, owner_id, reference, title_fa, label_fa, module_path, attachment_count]
      properties:
        owner_type: { $ref: '#/components/schemas/TransferOwnerType' }
        owner_id: { type: string, format: uuid }
        reference: { type: string }
        title_fa: { type: string }
        label_fa: { type: string }
        module_path: { type: string }
        attachment_count: { type: integer, minimum: 0 }
    TransferOwnersResponse:
      type: object
      required: [items, note_fa]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TransferOwnerRecord' }
        note_fa: { type: string }
    TransferManifestFile:
      type: object
      description: فقط مرجع مالکیت و فرادادهٔ فایل؛ بدون storage_key/URL/اعتبارنامه
      required: [path, attachment_id, owner_type, owner_id, file_name, content_type, size_bytes, sha256, crc32, exported_at]
      properties:
        path: { type: string, pattern: '^files/[0-9]{4}-[a-f0-9]{12}\.(jpg|jpeg|png|webp|pdf)$' }
        attachment_id: { type: string, format: uuid }
        owner_type: { $ref: '#/components/schemas/TransferOwnerType' }
        owner_id: { type: string, format: uuid }
        file_name: { type: string, maxLength: 200 }
        content_type: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
        size_bytes: { type: integer, minimum: 1, maximum: 8388608 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        crc32: { type: integer, minimum: 0, maximum: 4294967295 }
        exported_at: { type: string, format: date-time }
    TransferChecksums:
      type: object
      required: [schema, manifest_sha256, package_sha256, total_bytes, file_count]
      properties:
        schema: { type: string, enum: ['green-dms.attachment-transfer/1'] }
        manifest_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        package_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        total_bytes: { type: integer, minimum: 0 }
        file_count: { type: integer, minimum: 0 }
    TransferManifest:
      type: object
      required: [schema, operation_id, created_at, entity_types, file_count, total_bytes, files, checksums]
      properties:
        schema: { type: string, enum: ['green-dms.attachment-transfer/1'] }
        operation_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        entity_types:
          type: array
          items: { $ref: '#/components/schemas/TransferOwnerType' }
        file_count: { type: integer, minimum: 0 }
        total_bytes: { type: integer, minimum: 0 }
        files:
          type: array
          items: { $ref: '#/components/schemas/TransferManifestFile' }
        checksums: { $ref: '#/components/schemas/TransferChecksums' }
    TransferRejectedFile:
      type: object
      required: [owner_type, owner_id, attachment_id, file_name, reason_code, message_fa]
      properties:
        owner_type: { $ref: '#/components/schemas/TransferOwnerType' }
        owner_id: { type: string, format: uuid }
        attachment_id: { type: string, format: uuid }
        file_name: { type: string }
        reason_code: { type: string }
        message_fa: { type: string }
    TransferExportPreview:
