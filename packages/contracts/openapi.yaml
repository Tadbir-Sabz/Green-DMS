        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [rules-engine]
      summary: ایجاد زنجیره تأیید
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalChain' }
