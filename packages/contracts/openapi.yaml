  /attachments:
    get:
      tags: [attachments]
      summary: فهرستِ ضمیمه‌های یک موجودیت (owner) در دامنهٔ شرکتِ نشست
      parameters:
        - name: owner_type
          in: query
          required: true
          schema:
            type: string
            enum: [pod, invoice, journal_entry, receipt, return_request, sales_order, product, stock_count, other]
        - name: owner_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: ضمیمه‌های موجودیت (هر مورد با URL امضاشدهٔ کوتاه‌عمر)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [attachments]
      summary: بارگذاری ضمیمه / مدرک تحویل (POD) — multipart/form-data
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, owner_type, owner_id]
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    بایت‌های فایل. انواع مجاز: image/jpeg، image/png، image/webp،
                    application/pdf؛ سقف حجم پیش‌فرض ۸ مگابایت.
                owner_type:
                  type: string
                  enum: [pod, invoice, journal_entry, receipt, return_request, sales_order, product, stock_count, other]
                  description: نوعِ موجودیتِ مالکِ ضمیمه
                owner_id:
                  type: string
                  format: uuid
                  description: شناسهٔ موجودیتِ مالک (مثلاً شناسهٔ delivery برای POD)
      responses:
        '201':
          description: فایل در آبجکت‌استوریج ذخیره و metadata ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: حجم فایل بیش از حدِ مجاز است
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: نوع فایل مجاز نیست
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /attachments/{id}/url:
    get:
      tags: [attachments]
      summary: دریافت URL امضاشدهٔ کوتاه‌عمر برای دانلود ضمیمه
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: URL امضاشدهٔ دانلود (بدون bucket عمومی)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ─────────────── TASK-PM-02-C3: ضمائم سازمانی (Enterprise Entity Attachments) ───────────────
  /entity-attachments/{ownerType}/{ownerId}:
    parameters:
      - name: ownerType
        in: path
        required: true
        description: >-
          نوع موجودیت مالک ضمیمه. فقط هفت نوع مصوب دارای زنجیرهٔ مالکیت
          راستیآزمایشده پذیرفته میشوند؛ `product` (نمای C1)، `other` و هر نوع
          تازهای (brand/category/warehouse/…) با ۴۰۰ unsupported_owner_type رد
          میشود. مالک و شرکت هرگز از بدنه/کوئری/هدر کلاینت خوانده نمیشوند.
        schema: { $ref: '#/components/schemas/EntityAttachmentOwnerType' }
      - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid }, description: شناسهٔ رکورد مالک در همان شرکت نشست }
    get:
      tags: [attachments]
      summary: فهرست مشترک ضمائم یک موجودیت واجدشرایط + شمارش و برچسب فارسی
      description: >-
        همان خط لولهٔ `GET /attachments` (زنجیرهٔ مالکیت `ownerTenantSql`،
        RLS/FORCE RLS، URL امضاشدهٔ کوتاهعمر) دوباره استفاده میشود، ولی مالک
        فقط از مسیر و نشست مشتق میگردد. مجوز `attachment.view` در گارد route و
        دوباره از روی DB بررسی میشود. هیچ فیلد دامنهای، عضویت، وضعیت عرضه،
        `is_primary` یا `sort_order`ای برگردانده نمیشود؛ هدر `x-domain-id` و
        کلیدهای دامنهای/مالکیتی در کوئری صریحاً ۴۰۰ میگیرند (همسانی B2).
        خطاها: `unsupported_owner_type`، `invalid_owner_id`،
        `owner_not_found`، `owner_scope_denied`،
        `entity_attachment_owner_scope_rejected`،
        `unsupported_request_field`، `domain_property_rejected`،
        `domain_context_not_supported`، `forbidden`.
      responses:
        '200':
          description: نمای یکسان ضمائم موجودیت
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityAttachmentView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: ذخیرهسازی شیء پیکربندی نشده است (storage_not_configured)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [attachments]
      summary: بارگذاری امن ضمیمه برای یک موجودیت (multipart — فقط فیلد file)
      description: >-
        مالک (`owner_type`, `owner_id`) و `company_id` فقط از مسیر و نشست سرور
        مشتق میشوند؛ ارسال `owner_type`، `owner_id`، `company_id`،
        `uploaded_by`، `storage_key` یا فیلد دامنهای در بدنه/کوئری با ۴۰۰
        صریح رد میشود، نه حذف بیصدا. مجوز `attachment.upload` در گارد route و
        دوباره از DB بررسی میشود؛ RLS/FORCE RLS و زنجیرهٔ مالکیت والد دستنخوردهاند.
        همان خط لولهٔ `POST /attachments` (سقف حجم، allowlist، امضای بایتی،
        SHA-256، کلید نامفضاشده به شرکت، URL امضاشده) دوباره استفاده میشود.
        ثبت ردیف `attachment` و رویداد `audit_log` با `action=create` و
        `entity_type=entity_attachment` در **یک تراکنش**اند؛ شکست ممیزی،
        شکست ثبت DB یا شکست صدور URL ⇒ rollback و پاکسازی شیء آپلودشده تا
        فایل اورفان باقی نماند. URL امضاشده هرگز وارد ممیزی یا لاگ نمیشود.
        حذف/بایگانی/انتخاب تصویر اصلی/سیاست نگهداشت تعریف نشدهاند.
        خطاها: `empty_file`، `file_too_large`، `unsupported_media_type`،
        `unverifiable_content_type`، `content_type_mismatch`،
        `malformed_content`، `extension_mismatch`،
        `unsupported_owner_type`، `owner_not_found`، `owner_scope_denied`،
        `entity_attachment_owner_scope_rejected`، `unsupported_request_field`،
        `forbidden`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    بایتهای فایل. انواع مجاز: image/jpeg، image/png، image/webp،
                    application/pdf؛ سقف حجم پیشفرض ۸ مگابایت. هیچ فیلد مالکیتی
                    یا دامنهای پذیرفته نمیشود.
      responses:
        '201':
          description: فایل ذخیره، metadata ثبت و رویداد ممیزی در همان تراکنش نوشته شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityAttachmentItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: حجم فایل بیش از حد مجاز (file_too_large)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: نوع/امضای محتوای فایل پذیرفته نشد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: ذخیرهسازی شیء پیکربندی نشده یا در دسترس نیست
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /entity-attachments/{ownerType}/{ownerId}/{attachmentId}/url:
    parameters:
      - name: ownerType
        in: path
        required: true
        schema: { $ref: '#/components/schemas/EntityAttachmentOwnerType' }
      - { name: ownerId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid }, description: شناسهٔ ضمیمهٔ دقیقاً همین رکورد }
    get:
      tags: [attachments]
      summary: URL امضاشدهٔ تازه برای ضمیمهٔ دقیقاً همین موجودیت
      description: >-
        علاوه بر راستیآزمایی زنجیرهٔ مالکیت `/attachments/{id}/url`، این مسیر
        صریحاً `owner_type` و `owner_id` مسیر و `company_id` نشست را قید میزند؛
        ضمیمهٔ رکوردی دیگر حتی در همان شرکت ۴۰۴
        `entity_attachment_not_found` میگیرد. URL کوتاهعمر است و bucket هرگز
        عمومی نمیشود. مجوز `attachment.view` در دو لایه بررسی میشود.
      responses:
        '200':
          description: URL امضاشدهٔ دانلود و عمر آن به ثانیه
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentUrl' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: ذخیرهسازی شیء پیکربندی نشده است (storage_not_configured)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bi/kpi:
    get:
      tags: [bi]
      summary: شاخص‌های کلانِ فروش/وصولی/ماندهٔ AR (داشبورد BI)
      parameters:
        - name: days
          in: query
          description: بازهٔ روزهای اخیر برای فروش/وصولی (پیش‌فرض ۳۰)
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        '200':
          description: KPIهای شرکتِ نشست
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BiKpi' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /bi/abc-customers:
    get:
      tags: [bi]
      summary: طبقه‌بندی ABC مشتریان بر پایهٔ درآمد (قانونِ پارتو)
      responses:
        '200':
          description: فهرستِ طبقه‌بندی‌شدهٔ مشتریان
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AbcResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /bi/abc-products:
    get:
      tags: [bi]
      summary: طبقه‌بندی ABC کالاها بر پایهٔ درآمد (قانونِ پارتو)
      responses:
        '200':
          description: فهرستِ طبقه‌بندی‌شدهٔ کالاها
