          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/TransferSelection' }
    TransferOwnerTypeOption:
      type: object
      required: [owner_type, label_fa, module_path, backend_supported, ui_module, note_fa]
      properties:
        owner_type: { $ref: '#/components/schemas/TransferOwnerType' }
        label_fa: { type: string }
        module_path: { type: string }
