        approved_mapping_sha256: { type: 'null' }
        approved_preview_sha256: { type: 'null' }
        current_package_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        current_mapping_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        current_preview_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
