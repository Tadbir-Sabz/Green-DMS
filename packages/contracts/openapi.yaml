        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /products/{id}/domain-membership:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
      - { $ref: '#/components/parameters/xDomainIdHeader' }
    get:
      tags: [products]
      summary: مرز بسته عضویت کالا در دامنه؛ بدون نشت اطلاعات بین دامنهای
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /products/{id}/domain-membership/history:
    parameters:
      - { $ref: '#/components/parameters/idPath' }
      - { $ref: '#/components/parameters/xDomainIdHeader' }
    get:
      tags: [products]
      summary: مرز بسته تاریخچه عضویت؛ بدون نشت اطلاعات بین دامنهای
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ---------------- TASK-PM-02-C4 — مرکز انتقال ضمائم ----------------
  /attachment-transfer/owner-types:
    get:
      tags: [attachment-transfer]
      operationId: attachmentTransferOwnerTypes
      summary: انواع مالک مصوب ضمائم برای صدور/ورود بسته
      responses:
        '200':
          description: فهرست هشت نوع مالک دارای زنجیرهٔ راستیآزمایشده
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferOwnerTypesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /attachment-transfer/owners:
    get:
      tags: [attachment-transfer]
      operationId: attachmentTransferOwners
      summary: رکوردهای مالک مجاز همان شرکت، با شمارش ضمائم
      parameters:
        - name: entity_types
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 8
            items: { $ref: '#/components/schemas/TransferOwnerType' }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        '200':
          description: فقط رکوردهای مجاز همان شرکت
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferOwnersResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /attachment-transfer/exports/preview:
    post:
      tags: [attachment-transfer]
      operationId: attachmentTransferExportPreview
      summary: پیشنمایش بستهٔ صدور و تولید manifest/جمعکنترلها
      description: >-
        هیچ رکورد محصول، دادهٔ مرجع، شرکت یا پیکربندی دامنهای ساخته/تغییر
        نمیکند. manifest فقط مرجع مالک و فرادادهٔ فایل دارد؛ کلید استوریج،
        URL امضاشده و اطلاعات زیرساخت هرگز برگردانده نمیشود.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferExportPreviewRequest' }
      responses:
        '200':
          description: پیشنمایش و شناسهٔ عملیات صدور
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferExportPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503':
          description: خواندن ضمیمه از ذخیرهسازی ممکن نشد؛ بستهٔ ناقصی ساخته نشد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /attachment-transfer/exports/{operationId}/package:
    get:
      tags: [attachment-transfer]
      operationId: attachmentTransferExportPackage
      summary: دانلود امن بستهٔ ZIP صدور با اختیار تازه
      description: >-
        بسته از سابقهٔ ممیزی و ضمائم مجاز همان شرکت بازسازی و هش آن دوباره
        مقایسه میشود. پاسخ باینری همانمبدأ است؛ URL امضاشده یا کلید استوریج
        در بدنه/سرصفحه/تاریخچه وجود ندارد.
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: بستهٔ ZIP کنترلشده
          headers:
            X-Transfer-Package-Sha256:
              description: هش SHA-256 یکپارچگی بسته
              schema: { type: string, pattern: '^[a-f0-9]{64}$' }
            Cache-Control:
              description: عدم ذخیرهسازی پاسخ
              schema: { type: string, enum: [no-store] }
          content:
            application/zip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503':
          description: بازسازی بسته از ذخیرهسازی ممکن نشد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /attachment-transfer/imports/preview:
    post:
      tags: [attachment-transfer]
      operationId: attachmentTransferImportPreview
      summary: بارگذاری و پیشنمایش امن بستهٔ ضمائم
      description: >-
        فقط بستهٔ ضمائم بازرسی میشود: یکپارچگی، مسیرها، MIME، امضای بایتی،
        مالکیت، تکراریها و نگاشت به رکورد موجود. هیچ اجرای ورود، ساخت مالک،
        جایگزینی، حذف یا انتساب شرکتی انجام نمیشود.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file: { type: string, format: binary, description: بستهٔ ZIP کنترلشده }
      responses:
        '200':
          description: پیشنمایش کامل پذیرفته/ردشده/تکراری/حلنشده و وضعیت تأیید
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferImportPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413':
          description: حجم بسته بیش از سقف مجاز
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: نوع یا پسوند بسته مجاز نیست
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /attachment-transfer/imports/{operationId}:
    get:
      tags: [attachment-transfer]
      operationId: attachmentTransferImportStatus
      summary: بازخوانی پیشنمایش کوتاهعمر ورود
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: پیشنمایش معتبر همان آغازکننده
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferImportPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /attachment-transfer/imports/{operationId}/mappings:
    post:
      tags: [attachment-transfer]
      operationId: attachmentTransferUpdateMappings
      summary: نگاشت صریح فایلهای حلنشده به رکورد مالک موجود و مجاز
      description: >-
        فقط owner_id همان owner_type و همان شرکت تغییر میکند؛ نوع مالک، شرکت،
        دامنه و محتوای بسته تغییرناپذیر است. هر تغییر نگاشت، هش پیشنمایش را
        عوض میکند و هر تأیید پیشین را بیاعتبار میسازد.
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferMappingRequest' }
      responses:
        '200':
          description: پیشنمایش تازه با هش نگاشت تازه
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferImportPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /attachment-transfer/imports/{operationId}/execute:
    post:
      tags: [attachment-transfer]
      operationId: attachmentTransferExecute
      summary: دروازهٔ اجرای ورود —fail-closed تا تصمیم مصوب مالک
      description: >-
        معماری تأیید دونفرهٔ موجود برای این عملیات بستهای سیاست/اثرانگشت مصوب
        ندارد؛ بنابراین تلاش اجرا در ممیزی ثبت و با ۴۰۹ رد میشود. هیچ درج،
        بهروزرسانی، حذف یا جایگزینی ضمیمه انجام نمیشود.
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferEmptyRequest' }
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /attachment-transfer/operations:
    get:
      tags: [attachment-transfer]
      operationId: attachmentTransferHistory
      summary: تاریخچهٔ عملیات صدور/ورود و رویدادهای ممیزی
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: تاریخچهٔ تراکنشی بدون کلید استوریج/URL/اعتبارنامه
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferOperationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /attachment-transfer/operations/{operationId}:
    get:
      tags: [attachment-transfer]
      operationId: attachmentTransferOperationDetail
      summary: جزئیات یک عملیات و manifest امن آن
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: وضعیت، رویدادها، شمارشها و manifest بدون اطلاعات زیرساخت
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferOperationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /attachment-transfer/operations/{operationId}/cancel:
    post:
      tags: [attachment-transfer]
      operationId: attachmentTransferCancel
      summary: لغو پیشنمایش ورود؛ حفظ سابقه و بدون حذف فیزیکی
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferEmptyRequest' }
      responses:
        '200':
          description: پیشنمایش لغو و رویداد لغو ثبت شد
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferCancelResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

webhooks:
  invoicePosted:
