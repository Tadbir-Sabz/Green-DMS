        nature: { type: string, enum: [debit, credit], description: ماهیت حساب }
        account_type: { type: string, enum: [asset, liability, equity, revenue, expense, contra] }
        is_postable: { type: boolean, description: فقط حساب‌های سطح ۴ قابل ثبت مستقیم‌اند }
        control_type:
          type: [string, 'null']
          enum: [ar, ap, inventory, cash, bank, tax, cheque_in_hand, cogs, none, null]
          description: نقش کنترلی حساب برای نگاشت خودکار رویدادها
        currency: { type: string }
        is_active: { type: boolean }

    FiscalPeriod:
      type: object
      description: دورهٔ مالی (معمولاً ماهانه) — سند فقط در دورهٔ «باز» ثبت می‌شود
      properties:
        id: { type: string, format: uuid }
        fiscal_year: { type: integer, description: سال مالی شمسی }
        period_no: { type: integer, minimum: 1, maximum: 12 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        status: { type: string, enum: [open, closed, locked] }
        closed_at: { type: [string, 'null'], format: date-time }

    FiscalPeriodCreate:
      type: object
      required: [fiscal_year, period_no, start_date, end_date]
      description: بدنهٔ ساخت یک دورهٔ مالی جدید (با وضعیت open)
      properties:
        fiscal_year: { type: integer }
        period_no: { type: integer, minimum: 1, maximum: 12 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }

    JournalLine:
      type: object
      description: یک سطر سند — دقیقاً یک سمت (بدهکار یا بستانکار) غیر صفر
      properties:
        id: { type: string, description: شناسهٔ بزرگ‌عدد (bigint) به‌صورت رشته }
        line_no: { type: integer, minimum: 1 }
        account_id: { type: string, format: uuid }
        account_code: { type: string }
        account_title: { type: string }
        description: { type: string }
        debit: { type: string }
        credit: { type: string }
        party_type: { type: [string, 'null'], enum: [customer, supplier, staff, null] }
        party_id: { type: [string, 'null'], format: uuid }
        dimensions:
          type: object
          additionalProperties: true
          description: ابعاد تحلیلی (مرکز هزینه، پروژه، …)

    JournalEntry:
      type: object
      description: سند حسابداری (هدر) — جمع بدهکار/بستانکار برای سند غیر draft برابر است
      properties:
        id: { type: string, format: uuid }
        branch_id: { type: [string, 'null'], format: uuid }
        doc_number: { type: string, readOnly: true, description: شمارهٔ سند (JV-سال-ترتیب) }
        fiscal_period_id: { type: string, format: uuid }
        entry_date: { type: string, format: date }
        description: { type: string }
        source_type:
          type: string
          enum: [invoice, credit_note, receipt, payment_voucher, goods_receipt, supplier_invoice, value_document, cash_txn, cheque, payroll, manual, opening, closing, recurring]
        source_id: { type: [string, 'null'], format: uuid, description: شناسهٔ سند مبدأ (برای manual تهی) }
        total_debit: { type: string }
        total_credit: { type: string }
        status: { type: string, enum: [draft, posted, voided] }
        reversal_of_id: { type: [string, 'null'], format: uuid }
        posted_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        lines:
          type: array
          description: سطرها — فقط در پاسخ جزئیات/ثبت سند حاضر است، نه در فهرست
          items: { $ref: '#/components/schemas/JournalLine' }

    JournalLineCreate:
      type: object
      required: [account_id, description]
      description: سطر درخواستی سند — باید دقیقاً یک سمت (debit یا credit) غیر صفر باشد
      properties:
        account_id: { type: string, format: uuid }
        description: { type: string }
        debit: { type: string, description: رشتهٔ اعشاری؛ سمت استفاده‌نشده را صفر/حذف بگذارید }
        credit: { type: string }
        party_type: { type: string, enum: [customer, supplier, staff] }
        party_id: { type: string, format: uuid }
        dimensions:
          type: object
          additionalProperties: true

    JournalEntryCreate:
      type: object
      required: [branch_id, entry_date, description, lines]
      description: بدنهٔ ثبت سند دستیِ متوازن (حداقل دو سطر)
      properties:
        branch_id: { type: string, format: uuid }
        entry_date: { type: string, format: date }
        description: { type: string }
        fiscal_period_id:
          type: string
          format: uuid
          description: در صورت نبود، دورهٔ «باز» شامل entry_date به‌طور خودکار انتخاب می‌شود
        lines:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/JournalLineCreate' }

    TrialBalanceRow:
      type: object
      description: یک ردیف تراز آزمایشی (جمع بدهکار/بستانکار و ماندهٔ هر حساب)
      properties:
        fiscal_year: { type: integer }
        period_no: { type: integer }
        account_code: { type: string }
        title: { type: string }
        level: { type: integer, minimum: 1, maximum: 4 }
        nature: { type: string, enum: [debit, credit] }
        debit_total: { type: string }
        credit_total: { type: string }
        balance: { type: string, description: مانده (بدهکار − بستانکار) }

    LocationSample:
      type: object
      required: [staff_id, at, geo]
      description: نمونه موقعیت اپ میدانی (دسته‌ای از صف آفلاین)
      properties:
        staff_id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        geo: { $ref: '#/components/schemas/GeoPoint' }
        accuracy_m: { type: number }
        speed_kmh: { type: number }
        is_mocked: { type: boolean, description: اپ خود تشخیص می‌دهد GPS جعلی است }

    LatestPosition:
      type: object
      description: آخرین موقعیت معتبر یک کارمند میدانی
      properties:
        staff_id: { type: string, format: uuid }
        staff_name: { type: string }
        tour_id: { type: [string, 'null'], format: uuid }
        at: { type: string, format: date-time }
        geo: { $ref: '#/components/schemas/GeoPoint' }
        accuracy_m: { type: number }

    RoutePlan:
      type: object
      description: طرح مسیر «یک‌کلیکی» با هندسه و آمار
      properties:
        id: { type: string, format: uuid, readOnly: true }
        tour_id: { type: [string, 'null'], format: uuid }
        staff_id: { type: string, format: uuid }
        plan_date: { type: string, format: date }
        provider: { type: string, enum: [neshan, mapir, osrm_selfhosted] }
        objective: { type: string, enum: [min_duration, min_distance] }
        stop_count: { type: integer }
        total_distance_m: { type: integer }
        total_duration_s: { type: integer }
        geometry: { oneOf: [{ $ref: '#/components/schemas/GeoLineString' }, { type: 'null' }] }
        stops:
          type: array
          description: ترتیب بهینه‌شده توقف‌ها
          items:
            type: object
            properties:
              sequence: { type: integer }
              customer_id: { type: string, format: uuid }

    Geofence:
      type: object
      required: [name, kind, area]
      description: محدوده جغرافیایی کار (چندضلعی)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        kind: { type: string, enum: [work_area, customer, warehouse, restricted], description: 'work_area حوزه کاری است (نام در DDL)' }
        area: { $ref: '#/components/schemas/GeoPolygon' }
        customer_id: { type: [string, 'null'], format: uuid }
        warehouse_id: { type: [string, 'null'], format: uuid }
        is_active: { type: boolean }

    Rule:
      type: object
      required: [code, title, entity, event, effect]
      description: قاعده موتور قوانین با پیام فارسی قابل نمایش
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string }
        title: { type: string }
        entity: { type: string, examples: ['sales_order', 'customer', 'product', 'return_request'] }
        event: { type: string, enum: [before_save, before_approve, after_save, on_schedule] }
        # اثر قاعده دقیقاً هم‌اندازهٔ DDL مهاجرت 0009 (check روی ستون effect)
        effect: { type: string, enum: [block, warn, require_approval, set_field, notify] }
        priority: { type: integer }
        message_fa: { type: string }
        # شرایط به‌صورت فهرست گروه‌بندی‌شده ذخیره می‌شود (AND داخل گروه، OR بین گروه‌ها)
        conditions:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              group_no: { type: [integer, 'null'] }
              field: { type: string }
              operator: { type: string }
              value: {}
          description: شرط اجرای قاعده
        actions:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              action_type: { type: string }
              params: { type: object, additionalProperties: true }
          description: اقدامات قاعده (تخفیف/جایزه/تأیید و…)
        valid_from: { type: [string, 'null'], format: date }
        valid_to: { type: [string, 'null'], format: date }
        is_active: { type: boolean }

    ApprovalRequest:
      type: object
      description: درخواست تأیید مبلغ‌محور (زنجیره تأیید — ماژول ۳ §۳.۳)
      properties:
        id: { type: string, format: uuid, readOnly: true }
        approval_chain_id: { type: [string, 'null'], format: uuid }
        entity_type: { type: string, examples: ['sales_order', 'return_request', 'stock_adjustment'] }
        entity_id: { type: string, format: uuid }
        amount: { type: [string, 'null'] }
        status: { type: string, enum: [pending, approved, rejected, expired, cancelled] }
        current_step: { type: integer }
        requested_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        # تصمیم‌های ثبت‌شده تاکنون (یک ردیف به‌ازای هر مرحله)
        decisions:
          type: array
          items:
            type: object
            properties:
              step_no: { type: integer }
              decided_by: { type: [string, 'null'], format: uuid }
              decision: { type: [string, 'null'], enum: [approved, rejected, returned, null] }
              decided_at: { type: [string, 'null'], format: date-time }
              comment: { type: [string, 'null'] }
        steps:
          type: array
          items:
            type: object
            properties:
              step_no: { type: integer }
              approver_role: { type: string }
              decision: { type: [string, 'null'], enum: [approve, reject, null] }
              decided_at: { type: [string, 'null'], format: date-time }
              note: { type: string }

    ReportDescriptor:
      type: object
      description: شناسنامه یک گزارش مجاز (ضمیمه C)
      properties:
        key: { type: string, examples: ['ar_aging', 'tour_settlement', 'sales_by_route'] }
        title: { type: string }
        module: { type: string }
        required_permission: { type: string }

    BiKpi:
      type: object
      description: شاخص‌های کلانِ داشبورد BI برای شرکتِ نشست
      required:
        [period_days, sales, collected, gross, ar_balance, ar_overdue, open_invoice_count, active_customer_count]
      properties:
        period_days: { type: integer, description: بازهٔ روزهایِ فروش/وصولی }
        sales: { type: string, description: خالصِ فروشِ بازه (decimal، از mv_daily_sales.net_sales) }
        collected: { type: string, description: وصولیِ بازه (decimal) }
        gross: { type: string, description: ناخالصِ فروشِ بازه (decimal) }
        ar_balance: { type: string, description: کلِ ماندهٔ دریافتنیِ باز (decimal، از mv_ar_aging.total_due) }
        ar_overdue: { type: string, description: ماندهٔ سررسیدگذشته (decimal) }
        open_invoice_count: { type: integer, description: تعداد فاکتورهای باز }
        active_customer_count: { type: integer, description: تعداد مشتریان با ماندهٔ باز }
        collection_rate:
          type: [number, 'null']
          format: float
          description: نسبتِ وصول به فروشِ بازه (۰..۱)؛ null اگر فروشی نبوده
    AbcEntry:
      type: object
      description: یک قلمِ طبقه‌بندی‌شده در تحلیل ABC
      required: [id, code, name, revenue, share_pct, cumulative_pct, class]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        revenue: { type: string, description: درآمد (decimal) }
        qty: { type: string, description: مقدارِ فروش (decimal) — فقط در ABC کالاها }
        share_pct: { type: number, format: float, description: سهم از کلِ درآمد (٪) }
        cumulative_pct: { type: number, format: float, description: مجموعِ تجمعی تا این قلم (٪) }
        class: { type: string, enum: [A, B, C] }
    AbcResult:
      type: object
      required: [items, thresholds, total_revenue]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AbcEntry' }
        thresholds:
          type: object
          required: [a, b]
          properties:
            a: { type: number, description: آستانهٔ درصدیِ کلاسِ A }
            b: { type: number, description: آستانهٔ درصدیِ کلاسِ B }
        total_revenue: { type: string, description: کلِ درآمد (decimal) }
    BillingInvoice:
      type: object
      description: صورتحسابِ دوره‌ایِ اشتراک (ledger) — بدونِ پرداخت؛ وضعیت issued/void
      required: [id, invoice_no, period_start, period_end, amount, currency, status, notes, issued_at]
      properties:
        id: { type: string, format: uuid }
        invoice_no: { type: string }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        amount: { type: string, description: decimal string }
        currency: { type: string }
        status: { type: string, enum: [issued, void] }
        notes: { type: [string, 'null'] }
        issued_at: { type: string, format: date-time }
    RegisterTenantResult:
      type: object
      description: نتیجهٔ خودخدمت‌دهیِ استقرار — شناسه‌های اجارهٔ تازه و حسابِ مدیر
      required: [company_id, branch_id, app_user_id, admin_username]
      properties:
        company_id: { type: string, format: uuid }
        branch_id: { type: string, format: uuid }
        app_user_id: { type: string, format: uuid }
        admin_username: { type: string }
    PortalIdentity:
      type: object
      required: [id, email, display_name, company_id, customer_id]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: [string, 'null'] }
        company_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
    PortalSessionResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, portal_user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: عمرِ توکن دسترسی به ثانیه }
        portal_user: { $ref: '#/components/schemas/PortalIdentity' }
    PortalMe:
      allOf:
        - $ref: '#/components/schemas/PortalIdentity'
        - type: object
          required: [customer_code, customer_name]
          properties:
            customer_code: { type: string }
            customer_name: { type: string }
    PortalInvoice:
      type: object
      required: [id, doc_number, fiscal_year, invoice_date, due_date, grand_total, paid_amount, status]
      properties:
        id: { type: string, format: uuid }
        doc_number: { type: string }
        fiscal_year: { type: integer }
        invoice_date: { type: string, format: date }
        due_date: { type: [string, 'null'], format: date }
        grand_total: { type: string, description: decimal string }
        paid_amount: { type: string, description: decimal string }
        status: { type: string }
    PortalOrder:
      type: object
      required: [id, doc_number, fiscal_year, order_date, grand_total, status]
      properties:
        id: { type: string, format: uuid }
        doc_number: { type: string }
        fiscal_year: { type: integer }
        order_date: { type: string, format: date }
        grand_total: { type: string, description: decimal string }
        status: { type: string }
    PortalBalance:
      type: object
      required: [outstanding, overdue, credit_limit, credit_available]
      properties:
        outstanding: { type: string, description: ماندهٔ دریافتنیِ کل (decimal string) }
        overdue: { type: string, description: معوق (decimal string) }
        credit_limit: { type: [string, 'null'] }
        credit_available: { type: [string, 'null'] }
    BiForecastPoint:
      type: object
      required: [date, value]
      properties:
        date: { type: string, format: date }
        value: { type: string, description: فروشِ خالصِ پیش‌بینی‌شده (decimal string) }
    BiForecast:
      type: object
      description: پیش‌بینیِ فروشِ روزانه با هموارسازیِ خطیِ هالت
      required: [method, history_days, horizon_days, points, total, trend_per_day, direction]
      properties:
        method: { type: string, enum: [holt-linear] }
        history_days: { type: integer }
        horizon_days: { type: integer }
        points:
          type: array
          items: { $ref: '#/components/schemas/BiForecastPoint' }
        total: { type: string, description: مجموعِ فروشِ پیش‌بینی‌شده در افق }
        trend_per_day: { type: string, description: مؤلفهٔ روند (تغییرِ روزانهٔ سطح) }
        direction: { type: string, enum: [up, down, flat] }
    OptimizedStop:
      type: object
      description: یک توقفِ ترتیب‌داده‌شده در مسیرِ بهینه
      required: [customer_id, code, name, lat, lng, sequence, leg_distance_km, cumulative_distance_km, eta_min]
      properties:
        customer_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        sequence: { type: integer, description: ترتیبِ بازدید (۱-based) }
        leg_distance_km: { type: number, format: float, description: فاصله از توقفِ قبلی }
        cumulative_distance_km: { type: number, format: float, description: مسافتِ تجمعی از شروع }
        eta_min: { type: number, format: float, description: زمانِ تخمینیِ رسیدن از شروع (دقیقه) }
    RoutingOptimization:
      type: object
      required: [route_id, stop_count, stops, total_distance_km, total_duration_min, savings_percent]
      properties:
        route_id: { type: [string, 'null'], format: uuid }
        stop_count: { type: integer }
        stops:
          type: array
          items: { $ref: '#/components/schemas/OptimizedStop' }
        total_distance_km: { type: number, format: float }
        total_duration_min: { type: number, format: float }
        savings_percent: { type: number, format: float, description: درصدِ بهبود نسبت به ترتیبِ ورودی }
    Attachment:
      type: object
      description: یک ضمیمهٔ بارگذاری‌شده (فایل در آبجکت‌استوریج؛ اینجا metadata + URL امضاشده)
      required: [id, owner_type, owner_id, file_name, content_type, size_bytes, sha256, url, created_at]
      properties:
        id: { type: string, format: uuid }
        owner_type:
          type: string
          enum: [pod, invoice, journal_entry, receipt, return_request, sales_order, product, stock_count, other]
        owner_id: { type: string, format: uuid }
        file_name: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, minimum: 1 }
        sha256: { type: string, description: اثرِ انگشت SHA-256 محتوای فایل }
        url: { type: string, format: uri, description: URL امضاشدهٔ کوتاه‌عمر برای دانلود }
        created_at: { type: string, format: date-time }
    AttachmentUrl:
      type: object
      required: [url, expires_in]
      properties:
        url: { type: string, format: uri, description: URL امضاشدهٔ دانلود }
        expires_in: { type: integer, description: عمرِ URL به ثانیه }
    SettingEntry:
      type: object
      required: [key, value]
      description: تنظیم با دامنه — حوزه‌ها فقط محدوده خود را می‌بینند (ماژول ۱۱)
      properties:
        key: { type: string, examples: ['invoice.prefix', 'tour.settlement.deadline_hours'] }
        value: { type: string }
        scope_type: { type: string, enum: [global, company, branch, area] }
        scope_id: { type: [string, 'null'], format: uuid }

    IntegrationStatus:
      type: object
      description: وضعیت اتصال یک سرویس بیرونی (ضمیمه D)
      properties:
        key: { type: string, enum: [moadian, pos, sms, gateway] }
        title: { type: string }
        healthy: { type: boolean }
        last_success_at: { type: [string, 'null'], format: date-time }
        last_error: { type: [string, 'null'] }

    QueueJobReceipt:
      type: object
      description: رسید ثبت شغل در صف پایدار یکپارچه‌سازی
      properties:
        ok: { type: boolean }
        jobId: { type: string, format: uuid }
        status: { type: string, examples: ['queued'] }

    MoadianJob:
      type: object
      description: یک شغل صف ارسال به سامانه مؤدیان
      properties:
        id: { type: string, format: uuid }
        invoice_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, sending, sent, accepted, rejected, retrying, dead] }
        attempt_count: { type: integer }
        last_error: { type: [string, 'null'] }
        next_retry_at: { type: [string, 'null'] }
        created_at: { type: string }

    PspCharge:
      type: object
      description: درخواست شارژ/تراکنش درگاه پرداخت
      required: [branch_id, terminal_id, psp, amount]
      properties:
        branch_id: { type: string, format: uuid }
        terminal_id: { type: string, maxLength: 64 }
        psp: { type: string, maxLength: 32 }
        amount: { type: string, description: مبلغ به ریال (رشتهٔ اعشاری) }
        invoice_id: { type: [string, 'null'], format: uuid }

    PspWebhookEvent:
      type: object
      description: رویداد وب‌هوک درگاه — با امضای HMAC در هدر x-psp-signature
      required: [event_id, psp, status]
      properties:
        event_id: { type: string, maxLength: 128 }
        psp: { type: string, maxLength: 32 }
        status: { type: string, enum: [success, failed] }
        rrn: { type: [string, 'null'], maxLength: 64 }
        trace_no: { type: [string, 'null'], maxLength: 64 }
        amount: { type: [string, 'null'] }

    Uom:
      type: object
      description: واحد اندازه‌گیری (مرجع سراسری)
      required: [code, title]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string, maxLength: 16 }
        title: { type: string, maxLength: 64 }
        decimal_places: { type: integer, minimum: 0, maximum: 6 }

    ProductPackaging:
      type: object
      description: بسته‌بندی کالا با ضریب تبدیل به واحد پایه
      required: [product_id, uom_id, factor_to_base]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        product_id: { type: string, format: uuid }
        uom_id: { type: string, format: uuid }
        factor_to_base: { type: number, exclusiveMinimum: 0 }
        barcode: { type: [string, 'null'], maxLength: 64 }
        is_sales_default: { type: boolean }
        is_purchase_default: { type: boolean }
        uom_code: { type: [string, 'null'], readOnly: true }
        uom_title: { type: [string, 'null'], readOnly: true }

    ApprovalChain:
      type: object
      description: زنجیره تأیید با گام‌های تعریف‌شده
      required: [code, entity]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        company_id: { type: string, format: uuid, readOnly: true }
        code: { type: string }
        entity: { type: string }
        is_active: { type: boolean }
        steps:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              step_no: { type: integer, minimum: 1 }
              approver_role_id: { type: [string, 'null'], format: uuid }
              approver_staff_id: { type: [string, 'null'], format: uuid }
              min_amount: { type: [string, 'null'] }
              max_amount: { type: [string, 'null'] }
              is_mandatory: { type: boolean }

    ExceptionItem:
      type: object
      description: مورد استثنا در صف بازبینی (مغایرت، تخفیف مشکوک، اختلاف قیمت)
      required: [branch_id, kind]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        branch_id: { type: string, format: uuid }
        kind:
          type: string
          enum: [price_mismatch, stock_mismatch, credit_override, discount_override, cash_variance, count_variance, geofence_breach, sync_conflict, moadian_error]
        severity: { type: string, enum: [low, medium, high, critical], default: medium }
        entity_type: { type: [string, 'null'] }
        entity_id: { type: [string, 'null'], format: uuid }
        payload: { type: object, additionalProperties: true }
        status: { type: string, enum: [open, in_review, resolved, ignored], readOnly: true }
        assigned_to: { type: [string, 'null'], format: uuid, readOnly: true }
        resolved_by: { type: [string, 'null'], format: uuid, readOnly: true }
        resolved_at: { type: [string, 'null'], format: date-time, readOnly: true }
        resolution: { type: [string, 'null'], readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }

    LiveLocation:
      type: object
      description: آخرین موقعیت ثبت‌شدهٔ یک کارمند (خروجی v_live_locations)
      properties:
        company_id: { type: string, format: uuid }
        staff_id: { type: string, format: uuid }
        staff_name: { type: string }
        branch_id: { type: string, format: uuid }
        branch_code: { type: [string, 'null'] }
        branch_name: { type: [string, 'null'] }
        session_id: { type: [string, 'null'], format: uuid }
        tour_id: { type: [string, 'null'], format: uuid }
        lat: { type: number }
        lng: { type: number }
        accuracy_m: { type: [number, 'null'] }
        speed_mps: { type: [number, 'null'] }
        heading_deg: { type: [number, 'null'] }
        battery_pct: { type: [integer, 'null'] }
        is_mocked: { type: boolean }
        provider: { type: [string, 'null'] }
        sampled_at: { type: string, format: date-time }

    TrackingPing:
      type: object
      description: تک‌نمونه موقعیت از اپ میدانی (lat/lng)
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracy_m: { type: number, minimum: 0 }
        speed_kph: { type: number, minimum: 0 }
        heading_deg: { type: number, minimum: 0, maximum: 360 }
        battery_pct: { type: integer, minimum: 0, maximum: 100 }
        session_id: { type: [string, 'null'], format: uuid }
        tour_id: { type: [string, 'null'], format: uuid }
        provider: { type: string, enum: [gps, network, fused] }
        is_mocked: { type: boolean }
        recorded_at: { type: [string, 'null'], format: date-time }

    LocationSampleRow:
      type: object
      description: نمونه موقعیت ثبت‌شده (بازگشتی از POST /tracking/ping)
      properties:
        id: { type: [string, integer] }
        staff_id: { type: string, format: uuid }
        recorded_at: { type: string, format: date-time }
        accuracy_m: { type: [number, 'null'] }
        speed_mps: { type: [number, 'null'] }
        heading_deg: { type: [number, 'null'] }
        is_mocked: { type: boolean }
        provider: { type: [string, 'null'] }
