name: مهاجرت‌های پایگاه‌داده

# تست چرخه مهاجرت روی دیتابیس کاملاً خالی:
#   ساخت دیتابیس → up همه مهاجرت‌ها → down برعکس → راستی‌آزمایی خالی‌شدن
#   → up دوم → مقایسه دقیق اشیای دو اجرا (جدول/نما/ایندکس/تریگر/تابع)
# خروجی اسکریپت scripts/test-migrations.mjs غیرصفر یعنی شکست job.

on:
  push:
    paths:
      - 'migrations/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/migrations.yml'
  pull_request:
    paths:
      - 'migrations/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/migrations.yml'
  workflow_dispatch:

jobs:
  migration-cycle:
    name: چرخه up → down → up روی دیتابیس خالی
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # مهاجرت 0001 پسوندهای pgcrypto، pg_trgm، btree_gist و postgis را می‌سازد؛
      # پس تصویر پستگیس لازم است (نسخه 16 هم‌خوان با توسعه محلی).
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # اسکریپت DATABASE_URL را از محیط می‌گیرد (فایل .env در CI وجود ندارد)
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DB: greendms_ci_test

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: نصب وابستگی‌ها
        run: npm ci

      - name: تست چرخه مهاجرت (up → down → up)
        id: migtest
        shell: bash
        run: |
          set -o pipefail
          npm run test:migrations 2>&1 | tee /tmp/mig.log

      # لاگ‌های blob از بیرون خواندنی نیستند؛ دمِ لاگ را به annotation تمیز تبدیل
      # می‌کنیم تا خطای واقعیِ SQL (در صورتِ شکست) از check-runs API دیده شود.
      - name: Migration failure diagnostic
        if: "!cancelled() && steps.migtest.outcome == 'failure'"
        shell: bash
        run: |
          [ -f /tmp/mig.log ] || { echo "::error title=mig-diag::/tmp/mig.log missing"; exit 0; }
          enc() { sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' | tr -d '\r' | sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n'; }
          fail_msg=$(grep -nE "ERROR|error|مهاجرت|violates|syntax|does not exist|already exists|FAIL|mismatch|تفاوت|ناهمسان" /tmp/mig.log | head -n 40 | enc)
          echo "::error title=mig-log-failures::${fail_msg:-<none matched>}"
          tail_msg=$(tail -n 60 /tmp/mig.log | enc)
          echo "::error title=mig-log-tail::${tail_msg:-<empty>}"
