# workflow تستِ سرتاسری (Playwright) در محیطِ ایزوله
# یک پشتهٔ کامل با docker compose بالا می‌آید (postgres/postgis + redis + minio +
# api + وب)، مهاجرت‌ها هنگامِ بوتِ api خودکار اعمال می‌شوند (AUTO_MIGRATE=true)،
# سپس Playwright یک جریانِ تجاریِ واقعی را می‌سنجد: خودخدمت‌دهیِ استقرار → ورودِ
# مدیر → پیمایش تا داشبورد BI. مرورگرها فقط اینجا (در CI) نصب و اجرا می‌شوند.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E (پشتهٔ ایزولهٔ docker)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # نصبِ وابستگی‌ها و مرورگرِ Playwright پیش از بالا آوردنِ پشته تا زمان
      # ساختِ ایمیج‌ها و نصبِ مرورگر هم‌پوشانی داشته باشد.
      - name: install deps
        run: npm ci

      - name: install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: boot the full stack (build images)
        run: |
          docker compose up -d --build
          docker compose ps

      - name: wait for API health (migrations auto-run on boot)
        run: |
          for i in $(seq 1 80); do
            if curl -sf http://localhost:4000/api/health >/dev/null; then
              echo "api healthy after ${i} tries"; break
            fi
            sleep 3
          done
          curl -sf http://localhost:4000/api/health >/dev/null

      - name: wait for web
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/login >/dev/null; then
              echo "web up after ${i} tries"; break
            fi
            sleep 3
          done
          curl -sf http://localhost:3000/login >/dev/null

      - name: run Playwright E2E
        id: e2etest
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /tmp/e2e.log
        env:
          E2E_BASE_URL: http://localhost:3000
          CI: true

      - name: upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: compose diagnostics (on failure, as annotations)
        if: failure()
        shell: bash
        run: |
          enc() { sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' | tr -d '\r' | sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n'; }
          ps_msg=$(docker compose ps -a 2>&1 | tail -n 25 | enc)
          echo "::error title=e2e-compose-ps::${ps_msg:-<empty>}"
          api_msg=$(docker compose logs --no-color --tail 45 api 2>&1 | enc)
          echo "::error title=e2e-api-log::${api_msg:-<empty>}"
          web_msg=$(docker compose logs --no-color --tail 25 web 2>&1 | enc)
          echo "::error title=e2e-web-log::${web_msg:-<empty>}"
          if [ -f /tmp/e2e.log ]; then
            t=$(tail -n 40 /tmp/e2e.log | enc); echo "::error title=e2e-test-log::${t:-<empty>}"
          fi
          docker compose logs --tail=200 || true

      - name: tear down
        if: always()
        run: docker compose down -v
