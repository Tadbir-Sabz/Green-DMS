name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# از انباشته‌شدن اجراهای هم‌زمان روی یک ref جلوگیری می‌کند (runهای قدیمی‌تر لغو می‌شوند).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# مرزِ شفافِ jobها:
#   static              → بررسی‌های ایستا؛ بدونِ هیچ سرویسِ docker
#   unit                → تست‌های واحدِ بدونِ DB/MinIO؛ بدونِ هیچ سرویسِ docker
#   integration-db      → تست‌های DB‌دار (به‌جز ضمیمه)؛ فقط Postgres/Redis
#   integration-storage → round-trip ضمیمه؛ Postgres/Redis + MinIO (پیش‌نیازِ صریح)
# هیچ job ایستا/واحدی به MinIO وابسته نیست، پس شکستِ زیرساختِ آبجکت‌استوریج هرگز
# باعثِ شکستِ کاذبِ typecheck/build/unit نمی‌شود (cascade «vitest: not found»).
env:
  NODE_VERSION: '22'

jobs:
  static:
    name: Static checks (typecheck, OpenAPI, contract drift)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # نصبِ وابستگی‌ها پیش از هر چیزِ دیگر؛ هیچ وابستگی‌ای به سرویسِ docker ندارد.
      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Verify Vitest resolution per workspace
        run: |
          set -e
          echo "api: $(npm exec -w apps/api -- vitest --version)"
          echo "web: $(npm exec -w apps/web -- vitest --version)"

      - name: Typecheck (packages + api + web)
        run: npm run typecheck

      - name: OpenAPI lint
        run: npm run openapi:check

      - name: Contract drift (server routes vs OpenAPI)
        run: node scripts/contract-drift.mjs

      - name: Build (packages + api + web)
        run: npm run build

  unit:
    name: Unit tests (no DB, no MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # عمداً هیچ MINIO_* در سطحِ job ست نمی‌شود تا تستِ «fail-closed وقتی ست نشده»
    # محیطِ صادقانه داشته باشد (به‌علاوهٔ beforeEach در خودِ تست).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: API unit tests (DB-free *.test.ts)
        id: apiunit
        shell: bash
        run: |
          set -o pipefail
          rc=0
          cd apps/api
          files=$(ls test/*.test.ts | grep -v '\.api\.test\.ts$' | tr '\n' ' ')
          echo "selected: $files"
          ../../node_modules/.bin/vitest run $files 2>&1 | tee /tmp/api-unit.log || rc=$?
          exit $rc

      - name: API unit failure diagnostic
        if: "!cancelled() && steps.apiunit.outcome == 'failure'"
        shell: bash
        run: |
          enc() { sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' | tr -d '\r' | sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n'; }
          echo "::error title=api-unit-failures::$(grep -nE 'FAIL|AssertionError|Error:|✗|×' /tmp/api-unit.log | head -n 40 | enc)"
          echo "::error title=api-unit-tail::$(tail -n 45 /tmp/api-unit.log | enc)"

      - name: Web unit tests
        id: webunit
        shell: bash
        run: |
          set -o pipefail
          rc=0
          npm run test:web 2>&1 | tee /tmp/web-unit.log || rc=$?
          exit $rc

      - name: Web unit failure diagnostic
        if: "!cancelled() && steps.webunit.outcome == 'failure'"
        shell: bash
        run: |
          enc() { sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' | tr -d '\r' | sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n'; }
          echo "::error title=web-unit-failures::$(grep -nE 'FAIL|AssertionError|Error:|✗|×' /tmp/web-unit.log | head -n 40 | enc)"
          echo "::error title=web-unit-tail::$(tail -n 45 /tmp/web-unit.log | enc)"

  integration-db:
    name: Integration (Postgres) — API + tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci_only_secret_not_for_production
      SMS_PROVIDER: log
      PSQL: psql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install PostgreSQL client (psql for test migrations)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - run: npm ci

      # همهٔ *.api.test.ts به‌جز attachments.api.test.ts (که پیش‌نیازِ MinIO دارد).
      - name: API integration tests (DB-backed, excludes storage round-trip)
        id: apidb
        shell: bash
        run: |
          set -o pipefail
          rc=0
          cd apps/api
          files=$(ls test/*.api.test.ts | grep -v '^test/attachments\.api\.test\.ts$' | tr '\n' ' ')
          echo "selected $(echo "$files" | wc -w) files"
          ../../node_modules/.bin/vitest run $files 2>&1 | tee /tmp/api-db.log || rc=$?
          exit $rc

      - name: API integration failure diagnostic
        if: "!cancelled() && steps.apidb.outcome == 'failure'"
        shell: bash
        run: |
          enc() { sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' | tr -d '\r' | sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n'; }
          echo "::error title=api-db-failures::$(grep -nE 'FAIL|AssertionError|Error:|violates|Nest can'"'"'t|✗|×' /tmp/api-db.log | head -n 40 | enc)"
          echo "::error title=api-db-tail::$(tail -n 50 /tmp/api-db.log | enc)"

  integration-storage:
    name: Integration (MinIO) — attachment round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci_only_secret_not_for_production
      SMS_PROVIDER: log
      PSQL: psql
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: greendms
      MINIO_USE_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install PostgreSQL client (psql for test migrations)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - run: npm ci

      # پیش‌نیازِ صریحِ تستِ ضمیمه. اگر MinIO سالم نشود، این گام با تشخیصِ کامل
      # «BLOCKED» خارج می‌شود و گامِ تست هرگز اجرا نمی‌شود (بدونِ if: always()) —
      # یعنی شکستِ زیرساخت به‌جای «۵۰۰ در تستِ آپلود»، به‌صورتِ صریح گزارش می‌شود.
      #
      # تصویرِ MinIO دقیقاً همان مرجعی است که docker-compose.yml استفاده می‌کند
      # («minio/minio» بدونِ تگ). هیچ تعویضِ رجیستری یا تگِ حدسی انجام نشده؛ در عوض
      # digestِ واقعیِ pull‌شده ثبت می‌شود تا پین‌کردنِ نسخهٔ تغییرناپذیر در گامِ بعد
      # بر پایهٔ شاهدِ قابلِ اتکا صورت گیرد.
      - name: Start MinIO (explicit prerequisite, full docker evidence)
        id: minio
        shell: bash
        run: |
          set +e
          enc() { sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' | tr -d '\r' | sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n'; }

          echo "=== runner / docker environment ==="
          uname -a
          docker version 2>&1 | sed -n '1,20p'
          docker info --format 'server={{.ServerVersion}} ostype={{.OSType}}/{{.Architecture}} mirrors={{.RegistryConfig.Mirrors}}' 2>&1

          # Evidence-driven image resolution. The reference assumed earlier
          # (minio/minio on Docker Hub) is DENIED from the runner with:
          #   "pull access denied for minio/minio, repository does not exist or
          #    may require 'docker login'"   (pull_rc=1, run_rc=125)
          # while postgis/postgis:16-3.4 and redis:7-alpine pull fine in the same
          # job. So this is a repository-access problem, NOT a rate limit and NOT
          # an invalid tag. Probe the candidate references in order, capture every
          # attempt verbatim, and use the first one that actually pulls. The
          # resolved RepoDigest is recorded so an immutable pin can be committed
          # from verified evidence rather than guesswork.
          IMAGE=""
          DIGEST=""
          : >/tmp/minio-pull.log
          for CAND in quay.io/minio/minio:latest minio/minio:latest; do
            echo "=== docker pull ${CAND} ==="
            echo "----- candidate ${CAND} -----" >>/tmp/minio-pull.log
            docker pull "$CAND" >>/tmp/minio-pull.log 2>&1
            RC=$?
            echo "pull_rc=${RC} for ${CAND}"
            if [ "$RC" -eq 0 ]; then
              IMAGE="$CAND"
              DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$CAND" 2>/dev/null)
              echo "selected=${IMAGE} resolved_digest=${DIGEST:-unresolved}"
              break
            fi
          done
          echo "=== full pull evidence ==="
          cat /tmp/minio-pull.log

          echo "=== was an image present before container creation? ==="
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}' | grep -i minio || echo "(no minio image present locally)"
          PULL_RC=$([ -n "$IMAGE" ] && echo 0 || echo 1)

          if [ -z "$IMAGE" ]; then
            echo "::error title=BLOCKED-minio-unavailable::No candidate MinIO image could be pulled; attachment object-storage integration is BLOCKED by infrastructure (dependent tests were NOT executed)"
            echo "::error title=minio-candidates-tried::quay.io/minio/minio:latest, minio/minio:latest"
            echo "::error title=minio-pull-log::$(head -c 3000 /tmp/minio-pull.log | enc)"
            echo "::error title=minio-docker-env::$( { docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'; docker info --format 'mirrors={{.RegistryConfig.Mirrors}}'; docker images | head -n 15; } 2>&1 | enc)"
            exit 1
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST:-unresolved}" >> "$GITHUB_OUTPUT"
          echo "::notice title=minio-image-resolved::image=${IMAGE} digest=${DIGEST:-unresolved}"

          echo "=== docker run (stdout+stderr captured) ==="
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio123 \
            "$IMAGE" server /data --console-address ':9001' >/tmp/minio-run.log 2>&1
          RUN_RC=$?
          echo "run_rc=${RUN_RC}"
          cat /tmp/minio-run.log

          echo "=== readiness probe (/minio/health/live) ==="
          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              READY=1; echo "MinIO healthy after ${i} probe(s)"; break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error title=BLOCKED-minio-unavailable::MinIO did not become healthy; attachment object-storage integration is BLOCKED by infrastructure (dependent tests were NOT executed)"
            echo "::error title=minio-image-ref::image=${IMAGE} resolved_digest=${DIGEST:-unresolved}"
            echo "::error title=minio-exit-codes::pull_rc=${PULL_RC} run_rc=${RUN_RC} ready=${READY}"
            echo "::error title=minio-pull-log::$(head -c 3000 /tmp/minio-pull.log | enc)"
            echo "::error title=minio-run-log::$(head -c 2000 /tmp/minio-run.log | enc)"
            echo "::error title=minio-container-log::$(docker logs minio 2>&1 | tail -n 40 | enc)"
            echo "::error title=minio-docker-state::$( { docker ps -a; echo '--- images ---'; docker images | head -n 20; echo '--- events ---'; timeout 10 docker events --since 10m --until 0s 2>/dev/null | tail -n 25; } 2>&1 | enc)"
            exit 1
          fi

          echo "healthy=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=minio-ready::image=${IMAGE} digest=${DIGEST:-unresolved} pull_rc=${PULL_RC} run_rc=${RUN_RC}"

      # تنها وقتی اجرا می‌شود که MinIO سالم باشد (پیش‌نیازِ صریح).
      - name: Attachment round-trip tests (requires healthy MinIO)
        if: steps.minio.outputs.healthy == 'true'
        id: att
        shell: bash
        run: |
          set -o pipefail
          rc=0
          cd apps/api
          ../../node_modules/.bin/vitest run test/attachments.api.test.ts 2>&1 | tee /tmp/att.log || rc=$?
          exit $rc

      - name: Attachment failure diagnostic
        if: "!cancelled() && steps.att.outcome == 'failure'"
        shell: bash
        run: |
          enc() { sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' | tr -d '\r' | sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n'; }
          echo "::error title=attachment-failures::$(grep -nE 'FAIL|AssertionError|Error:|✗|×' /tmp/att.log | head -n 40 | enc)"
          echo "::error title=attachment-tail::$(tail -n 50 /tmp/att.log | enc)"
