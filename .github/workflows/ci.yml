name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # The API tests self-bootstrap: each test file reads DATABASE_URL as a
    # superuser "admin" URL, CREATEs a throwaway database, and applies every
    # migration in a single transaction via the psql CLI (PSQL env). So CI must
    # provide a PostGIS server, a Redis server, and a real psql binary.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Superuser URL — the tests derive a temp database name from it.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci_only_secret_not_for_production
      SMS_PROVIDER: log
      # psql binary used by the API tests to apply migrations (installed below).
      PSQL: psql
      # MinIO — آبجکت‌استوریج ضمیمه‌ها/POD. در گام «Start MinIO» با docker بالا می‌آید.
      # StorageService هنگام اولین put به‌صورت خودکار bucket را می‌سازد (ensureBucket).
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: greendms
      MINIO_USE_SSL: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PostgreSQL client (psql for API test migrations)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      # `npm ci` runs the root `prepare` script, which builds the shared packages.
      # IMPORTANT: npm ci runs BEFORE any docker/object-storage step so a transient
      # MinIO or Docker-Hub-rate-limit failure can never skip the install and
      # cascade into "command not found" (exit 127) across every later step.
      - run: npm ci

      - name: Typecheck (packages + api + web)
        run: npm run typecheck

      - name: OpenAPI lint
        run: npm run openapi:check

      - name: Contract drift (server routes vs OpenAPI)
        run: node scripts/contract-drift.mjs

      # MinIO به‌عنوان service container قابل اتکا نیست (بدون آرگومان `server /data`
      # سرویس نمی‌دهد)، پس با docker به‌صورت گامِ اجرایی — و پس از npm ci و بررسی‌های
      # ایستا — بالا می‌آید. pull با چند تلاشِ مجدد چون Docker Hub آی‌پیِ رانرهای
      # اشتراکیِ گیت‌هاب را محدود (rate-limit) می‌کند. bucket را خودِ StorageService می‌سازد.
      - name: Start MinIO (object storage for attachment uploads)
        run: |
          set +e
          for attempt in 1 2 3; do
            docker pull quay.io/minio/minio:latest && break
            echo "MinIO pull attempt ${attempt} failed; retrying in 15s..."; sleep 15
          done
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio123 \
            quay.io/minio/minio:latest server /data --console-address ":9001"
          run_rc=$?
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO ready after ${i} tries"; break
            fi
            sleep 2
          done
          if ! curl -sf http://localhost:9000/minio/health/live >/dev/null; then
            enc() { sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' | tr -d '\r' | sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n'; }
            echo "::error title=minio-run-rc::docker run exit=${run_rc}"
            echo "::error title=minio-docker-logs::$(docker logs minio 2>&1 | tail -n 30 | enc)"
            echo "::error title=minio-docker-ps::$(docker ps -a 2>&1 | tail -n 12 | enc)"
            exit 1
          fi

      # API tests run first and Web tests / Build use `if: '!cancelled()'` so a
      # failure in one suite can never hide the result of the others. The API
      # tests are the ones that exercise real SQL against the PostGIS service,
      # so their signal must always be reported.
      - name: API tests
        if: '!cancelled()'
        id: apitest
        shell: bash
        run: |
          set -o pipefail
          npm run test:api 2>&1 | tee /tmp/api.log

      # همان الگوی diagnostic وب: چون لاگ‌های blob خواندنی نیستند و vitest هنگام
      # شکست در سطح suite (top-level/beforeAll) هیچ annotation تستی صادر نمی‌کند،
      # سر و دمِ لاگ API را به دو annotation تمیز تبدیل می‌کنیم تا از check-runs
      # API خوانده شود.
      - name: API failure diagnostic
        if: "!cancelled() && steps.apitest.outcome == 'failure'"
        shell: bash
        run: |
          [ -f /tmp/api.log ] || { echo "::error title=api-diag::/tmp/api.log missing"; exit 0; }
          enc() { sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' | tr -d '\r' | sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n'; }
          fail_msg=$(grep -nE "FAIL|Failed Suites|AssertionError|Error:|error:|expected|Nest can't|violates|✗|×" /tmp/api.log | head -n 40 | enc)
          echo "::error title=api-log-failures::${fail_msg:-<none matched>}"
          tail_msg=$(tail -n 50 /tmp/api.log | enc)
          echo "::error title=api-log-tail::${tail_msg:-<empty>}"

      - name: Web tests
        if: '!cancelled()'
        id: webtest
        shell: bash
        run: |
          set -o pipefail
          npm run test:web 2>&1 | tee /tmp/web.log

      # لاگ‌های blob برای ما قابل خواندن نیستند و vitest هنگام crash در
      # import/collection هیچ annotation تستی صادر نمی‌کند. این stepِ جدا (با shell
      # تازه پس از web) سر و دمِ لاگ را بعد از strip کردن ANSI/CR و escape کردن %
      # به دو annotation تمیز تبدیل می‌کند تا از check-runs API خوانده شود.
      - name: Web failure diagnostic
        if: "!cancelled() && steps.webtest.outcome == 'failure'"
        shell: bash
        run: |
          [ -f /tmp/web.log ] || { echo "::error title=web-diag::/tmp/web.log missing"; exit 0; }
          enc() { sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' | tr -d '\r' | sed -e 's/%/%25/g' -e 's/$/%0A/' | tr -d '\n'; }
          head_msg=$(head -n 30 /tmp/web.log | enc)
          echo "::error title=web-log-head::${head_msg:-<empty>}"
          tail_msg=$(tail -n 45 /tmp/web.log | enc)
          echo "::error title=web-log-tail::${tail_msg:-<empty>}"

      - name: Build (packages + api + web)
        if: '!cancelled()'
        run: npm run build
